const rows=[{"DIAGNOSTIC_ID":"R4_2D-QA2B-009","QA_ID":"QA2B-009","EXTRACTION_ID":"EXT-000054","CASE_ID":"D1_GDPR","CELEX":"32016R0679","SOURCE_POINTER":"32016R0679#article_32/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"GDPR operative article; direct legal action with a concise contextual “to the risk” phrase in both role slots; Terra did not abstain.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"the controller and the processor","LUNA_ACTION":"implement appropriate technical and organisational measures to","LUNA_OBJECT":"ensure a level of security appropriate to the risk, including inter alia as appropriate:","LUNA_COUNTERPART":"to the risk","LUNA_RECIPIENT":"to the risk","LUNA_SELFREVIEW_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"MEDIUM","TERRA_ABSTAIN":"NO","FULL_SOURCE_TEXT":"[ARTICLE 32]\r\nArticle 32\r\nSecurity of processing\r\n1. Taking into account the state of the art, the costs of implementation and the nature, scope, context and purposes of processing as well as the risk of varying likelihood and severity for the rights and freedoms of natural persons, the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk, including inter alia as appropriate:\r\n(a)\r\nthe pseudonymisation and encryption of personal data;\r\n(b)\r\nthe ability to ensure the ongoing confidentiality, integrity, availability and resilience of processing systems and services;\r\n(c)\r\nthe ability to restore the availability and access to personal data in a timely manner in the event of a physical or technical incident;\r\n(d)\r\na process for regularly testing, assessing and evaluating the effectiveness of technical and organisational measures for ensuring the security of the processing.\r\n2. In assessing the appropriate level of security account shall be taken in particular of the risks that are presented by processing, in particular from accidental or unlawful destruction, loss, alteration, unauthorised disclosure of, or access to personal data transmitted, stored or otherwise processed.\r\n3. Adherence to an approved code of conduct as referred to in Article 40 or an approved certification mechanism as referred to in Article 42 may be used as an element by which to demonstrate compliance with the requirements set out in paragraph 1 of this Article.\r\n4. The controller and processor shall take steps to ensure that any natural person acting under the authority of the controller or the processor who has access to personal data does not process them except on instructions from the controller, unless he or she is required to do so by Union or Member State law.","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 31]\r\nArticle 31\r\nCooperation with the supervisory authority\r\nThe controller and the processor and, where applicable, their representatives, shall cooperate, on request, with the supervisory authority in the performance of its tasks.\r\n[SECTION 2]\r\nSection 2\r\nSecurity of personal data","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 33]\r\nArticle 33\r\nNotification of a personal data breach to the supervisory authority\r\n1. In the case of a personal data breach, the controller shall without undue delay and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent in accordance with Article 55, unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where the notification to the supervisory authority is not made within 72 hours, it shall be accompanied by reasons for the delay.\r\n2. The processor shall notify the controller without undue delay after becoming aware of a personal data breach.\r\n3. The notification referred to in paragraph 1 shall at least:\r\n(a)\r\ndescribe the nature of the personal data breach including where possible, the categories and approximate number of data subjects concerned and the categories and approximate number of personal data records concerned;\r\n(b)\r\ncommunicate the name and contact details of the data protection officer or other contact point where more information can be obtained;\r\n(c)\r\ndescribe the likely consequences of the personal dat","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-026","QA_ID":"QA2B-026","EXTRACTION_ID":"EXT-000272","CASE_ID":"D1_GDPR","CELEX":"32016R0679","SOURCE_POINTER":"32016R0679#recital_103","SOURCE_TYPE":"RECITAL","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"GDPR recital with multiple Commission propositions, long cross-clause structure, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"of personal data to that third country or international organisation","LUNA_ACTION":"take place without the need to obtain","LUNA_OBJECT":"any further authorisation. The Commission may also decide, having given notice and a full statement setting out the reasons to the third country or international organisation, to râ€¦","LUNA_COUNTERPART":"to the third country or international organisation","LUNA_RECIPIENT":"to the third country or international organisation","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[RECITAL 103]\r\n(103)\r\nThe Commission may decide with effect for the entire Union that a third country, a territory or specified sector within a third country, or an international organisation, offers an adequate level of data protection, thus providing legal certainty and uniformity throughout the Union as regards the third country or international organisation which is considered to provide such level of protection. In such cases, transfers of personal data to that third country or international organisation may take place without the need to obtain any further authorisation. The Commission may also decide, having given notice and a full statement setting out the reasons to the third country or international organisation, to revoke such a decision.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 102]\r\n(102)\r\nThis Regulation is without prejudice to international agreements concluded between the Union and third countries regulating the transfer of personal data including appropriate safeguards for the data subjects. Member States may conclude international agreements which involve the transfer of personal data to third countries or international organisations, as far as such agreements do not affect this Regulation or any other provisions of Union law and include an appropriate level of protection for the fundamental rights of the data subjects.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 104]\r\n(104)\r\nIn line with the fundamental values on which the Union is founded, in particular the protection of human rights, the Commission should, in its assessment of the third country, or of a territory or specified sector within a third country, take into account how a particular third country respects the rule of law, access to justice as well as international human rights norms and standards and its general and sectoral law, including legislation concerning public security, defence and national security as well as public order and criminal law. The adoption of an adequacy decision with regard to a territory or a specified sector in a third country should take into account clear and objective criteria, such as specific processing activities and the scope of applicable legal standards and legislation in force in the third country. The third country should offer guarantees ensuring an adequate level of protection essentially equivalent to that ensured within the Union, in particular where personal data are processed in one or several specific sectors. In particular, the third country should ensure effective independent data protection supervision and should provide for","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-036","QA_ID":"QA2B-036","EXTRACTION_ID":"EXT-000500","CASE_ID":"D2_DSA","CELEX":"32022R2065","SOURCE_POINTER":"32022R2065#article_14/p4","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"DSA operative article; clear action with a rights/interests complement duplicated into both role slots; Terra did not abstain.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"Providers of intermediary services","LUNA_ACTION":"act in a diligent","LUNA_OBJECT":", objective and proportionate manner in applying and enforcing the restrictions referred to in paragraph 1, with due regard to the rights and legitimate interests of all parties inâ€¦","LUNA_COUNTERPART":"to the rights and legitimate interests of all parties involved","LUNA_RECIPIENT":"to the rights and legitimate interests of all parties involved","LUNA_SELFREVIEW_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"MEDIUM","TERRA_ABSTAIN":"NO","FULL_SOURCE_TEXT":"[ARTICLE 14]\r\nArticle 14\r\nTerms and conditions\r\n1. Providers of intermediary services shall include information on any restrictions that they impose in relation to the use of their service in respect of information provided by the recipients of the service, in their terms and conditions. That information shall include information on any policies, procedures, measures and tools used for the purpose of content moderation, including algorithmic decision-making and human review, as well as the rules of procedure of their internal complaint handling system. It shall be set out in clear, plain, intelligible, user-friendly and unambiguous language, and shall be publicly available in an easily accessible and machine-readable format.\r\n2. Providers of intermediary services shall inform the recipients of the service of any significant change to the terms and conditions.\r\n3. Where an intermediary service is primarily directed at minors or is predominantly used by them, the provider of that intermediary service shall explain the conditions for, and any restrictions on, the use of the service in a way that minors can understand.\r\n4. Providers of intermediary services shall act in a diligent, objective and proportionate manner in applying and enforcing the restrictions referred to in paragraph 1, with due regard to the rights and legitimate interests of all parties involved, including the fundamental rights of the recipients of the service, such as the freedom of expression, freedom and pluralism of the media, and other fundamental rights and freedoms as enshrined in the Charter.\r\n5. Providers of very large online platforms and of very large online search engines shall provide recipients of services with a concise, easily-accessible and machine-readable summary of the terms and conditions, including the available remedies and redress mechanisms, in clear and unambiguous language.\r\n6. Very large online platforms and very large online search engines within the meaning of Article 33 shall publish their terms and conditions in the official languages of all the Member States in which they offer their services.","FULL_SOURCE_CONTEXT_BEFORE":"e Board, on all issues necessary for the receipt of, compliance with and enforcement of decisions issued in relation to this Regulation. Providers of intermediary services shall provide their legal representative with necessary powers and sufficient resources to guarantee their efficient and timely cooperation with the Member Statesâ€™ competent authorities, the Commission and the Board, and to comply with such decisions.\r\n3. It shall be possible for the designated legal representative to be held liable for non-compliance with obligations under this Regulation, without prejudice to the liability and legal actions that could be initiated against the provider of intermediary services.\r\n4. Providers of intermediary services shall notify the name, postal address, email address and telephone number of their legal representative to the Digital Services Coordinator in the Member State where that legal representative resides or is established. They shall ensure that that information is publicly available, easily accessible, accurate and kept up to date.\r\n5. The designation of a legal representative within the Union pursuant to paragraph 1 shall not constitute an establishment in the Union.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 15]\r\nArticle 15\r\nTransparency reporting obligations for providers of intermediary services\r\n1. Providers of intermediary services shall make publicly available, in a machine-readable format and in an easily accessible manner, at least once a year, clear, easily comprehensible reports on any content moderation that they engaged in during the relevant period. Those reports shall include, in particular, information on the following, as applicable:\r\n(a)\r\nfor providers of intermediary services, the number of orders received from Member Statesâ€™ authorities including orders issued in accordance with Articles 9 and 10, categorised by the type of illegal content concerned, the Member State issuing the order, and the median time needed to inform the authority issuing the order, or any other authority specified in the order, of its receipt, and to give effect to the order;\r\n(b)\r\nfor providers of hosting services, the number of notices submitted in accordance with Article 16, categorised by the type of alleged illegal content concerned, the number of notices submitted by trusted flaggers, any action taken pursuant to the notices by differentiating whether the action was taken on the","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-056","QA_ID":"QA2B-056","EXTRACTION_ID":"EXT-000736","CASE_ID":"D2_DSA","CELEX":"32022R2065","SOURCE_POINTER":"32022R2065#recital_107","SOURCE_TYPE":"RECITAL","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"DSA recital involving multiple advertising actors, an invitation relation, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"the Commission","LUNA_ACTION":"invite the Fundamental Rights Agency or the","LUNA_OBJECT":"European Data Protection Supervisor to express their opinions on the respective code of conduct.","LUNA_COUNTERPART":"from the natural or legal person on whose behalf the advertisement is presented on the online interface of a","LUNA_RECIPIENT":"from the natural or legal person on whose behalf the advertisement is presented on the online interface of a","LUNA_SELFREVIEW_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[RECITAL 107]\r\n(107)\r\nThe provision of online advertising generally involves several actors, including intermediary services that connect publishers of advertisements with advertisers. Codes of conduct should support and complement the transparency obligations relating to advertising for providers of online platforms, of very large online platforms and of very large online search engines set out in this Regulation in order to provide for flexible and effective mechanisms to facilitate and enhance the compliance with those obligations, notably as concerns the modalities of the transmission of the relevant information. This should include facilitating the transmission of the information on the advertiser who pays for the advertisement when they differ from the natural or legal person on whose behalf the advertisement is presented on the online interface of an online platform. The codes of conduct should also include measures to ensure that meaningful information about the monetisation of data is appropriately shared throughout the value chain. The involvement of a wide range of stakeholders should ensure that those codes of conduct are widely supported, technically sound, effective and offer the highest levels of user-friendliness to ensure that the transparency obligations achieve their objectives. In order to ensure the effectiveness of codes of conduct, the Commission should include evaluation mechanisms in drawing up the codes of conduct. Where appropriate, the Commission may invite the Fundamental Rights Agency or the European Data Protection Supervisor to express their opinions on the respective code of conduct.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 106]\r\n(106)\r\nThe rules on codes of conduct under this Regulation could serve as a basis for already established self-regulatory efforts at Union level, including the Product Safety Pledge, the Memorandum of understanding on the sale of counterfeit goods on the internet, the Code of conduct on countering illegal hate speech online, as well as the Code of Practice on Disinformation. In particular for the latter, following the Commissionâ€™s guidance, the Code of Practice on Disinformation has been strengthened as announced in the European Democracy Action Plan.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 108]\r\n(108)\r\nIn addition to the crisis response mechanism for very large online platforms and very large online search engines, the Commission may initiate the drawing up of voluntary crisis protocols to coordinate a rapid, collective and cross-border response in the online environment. Such can be the case, for example, where online platforms are misused for the rapid spread of illegal content or disinformation or where the need arises for rapid dissemination of reliable information. In light of the important role of very large online platforms in disseminating information in our societies and across borders, providers of such platforms should be encouraged in drawing up and applying specific crisis protocols. Such crisis protocols should be activated only for a limited period of time and the measures adopted should also be limited to what is strictly necessary to address the extraordinary circumstance. Those measures should be consistent with this Regulation, and should not amount to a general obligation for the participating providers of very large online platforms and of very large online search engines to monitor the information which they transmit or store, nor activ","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-067","QA_ID":"QA2B-067","EXTRACTION_ID":"EXT-000952","CASE_ID":"D3_AI_ACT","CELEX":"32024R1689","SOURCE_POINTER":"32024R1689#article_22/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"AI Act operative article; short mandate/source phrase duplicated into counterpart and recipient; Terra did not abstain.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"The provider","LUNA_ACTION":"enable its authorised representative to perform the","LUNA_OBJECT":"tasks specified in the mandate received from the provider.","LUNA_COUNTERPART":"from the provider","LUNA_RECIPIENT":"from the provider","LUNA_SELFREVIEW_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"MEDIUM","TERRA_ABSTAIN":"NO","FULL_SOURCE_TEXT":"[ARTICLE 22]\r\nArticle 22\r\nAuthorised representatives of providers of high-risk AI systems\r\n1. Prior to making their high-risk AI systems available on the Union market, providers established in third countries shall, by written mandate, appoint an authorised representative which is established in the Union.\r\n2. The provider shall enable its authorised representative to perform the tasks specified in the mandate received from the provider.\r\n3. The authorised representative shall perform the tasks specified in the mandate received from the provider. It shall provide a copy of the mandate to the market surveillance authorities upon request, in one of the official languages of the institutions of the Union, as indicated by the competent authority. For the purposes of this Regulation, the mandate shall empower the authorised representative to carry out the following tasks:\r\n(a)\r\nverify that the EU declaration of conformity referred to in Article 47 and the technical documentation referred to in Article 11 have been drawn up and that an appropriate conformity assessment procedure has been carried out by the provider;\r\n(b)\r\nkeep at the disposal of the competent authorities and national authorities or bodies referred to in Article 74(10), for a period of 10 years after the high-risk AI system has been placed on the market or put into service, the contact details of the provider that appointed the authorised representative, a copy of the EU declaration of conformity referred to in Article 47, the technical documentation and, if applicable, the certificate issued by the notified body;\r\n(c)\r\nprovide a competent authority, upon a reasoned request, with all the information and documentation, including that referred to in point (b) of this subparagraph, necessary to demonstrate the conformity of a high-risk AI system with the requirements set out in Section 2, including access to the logs, as referred to in Article 12(1), automatically generated by the high-risk AI system, to the extent such logs are under the control of the provider;\r\n(d)\r\ncooperate with competent authorities, upon a reasoned request, in any action the latter take in relation to the high-risk AI system, in particular to reduce and mitigate the risks posed by the high-risk AI system;\r\n(e)\r\nwhere applicable, comply with the registration obligations referred to in Article 49(1), or, if the registration is carried out by the provider itself, ensure that the information referred to in point 3 of Section A of Annex VIII is correct.\r\nThe mandate shall empower the authorised representative to be addressed, in addition to or instead of the provider, by the competent authorities, on all issues related to ensuring compliance with this Regulation.\r\n4. The authorised representative shall terminate the mandate if it considers or has reason to consider the provider to be acting contrary to its obligations pursuant to this Regulation. In such a case, it shall immediately inform the relevant market surveillance authority, as well as, where applicable, the relevant notified body, about the termination of the mandate and the reasons therefor.","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 21]\r\nArticle 21\r\nCooperation with competent authorities\r\n1. Providers of high-risk AI systems shall, upon a reasoned request by a competent authority, provide that authority all the information and documentation necessary to demonstrate the conformity of the high-risk AI system with the requirements set out in Section 2, in a language which can be easily understood by the authority in one of the official languages of the institutions of the Union as indicated by the Member State concerned.\r\n2. Upon a reasoned request by a competent authority, providers shall also give the requesting competent authority, as applicable, access to the automatically generated logs of the high-risk AI system referred to in Article 12(1), to the extent such logs are under their control.\r\n3. Any information obtained by a competent authority pursuant to this Article shall be treated in accordance with the confidentiality obligations set out in Article 78.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 23]\r\nArticle 23\r\nObligations of importers\r\n1. Before placing a high-risk AI system on the market, importers shall ensure that the system is in conformity with this Regulation by verifying that:\r\n(a)\r\nthe relevant conformity assessment procedure referred to in Article 43 has been carried out by the provider of the high-risk AI system;\r\n(b)\r\nthe provider has drawn up the technical documentation in accordance with Article 11 and Annex IV;\r\n(c)\r\nthe system bears the required CE marking and is accompanied by the EU declaration of conformity referred to in Article 47 and instructions for use;\r\n(d)\r\nthe provider has appointed an authorised representative in accordance with Article 22(1).\r\n2. Where an importer has sufficient reason to consider that a high-risk AI system is not in conformity with this Regulation, or is falsified, or accompanied by falsified documentation, it shall not place the system on the market until it has been brought into conformity. Where the high-risk AI system presents a risk within the meaning of Article 79(1), the importer shall inform the provider of the system, the authorised representative and the market surveillance authorities to that effect.\r\n3. I","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-089","QA_ID":"QA2B-089","EXTRACTION_ID":"EXT-000924","CASE_ID":"D3_AI_ACT","CELEX":"32024R1689","SOURCE_POINTER":"32024R1689#annex_VII","SOURCE_TYPE":"ANNEX","PATTERN":"COUNTERPART_RECIPIENT_OVERATTRIBUTION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"AI Act annex procedure with multiple actors, long nested clauses, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"the provider maintains and applies the quality management system and","LUNA_ACTION":"provide information or material","LUNA_OBJECT":". In the context of those audits, the notified body may carry out additional tests of the AI systems for which a Union technical documentation assessment certificate was issued.","LUNA_COUNTERPART":"with any other notified body","LUNA_RECIPIENT":"with any other notified body","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR;SOURCE_EXCERPT_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[ANNEX VII]\r\nANNEX VII\r\nConformity based on an assessment of the quality management system and an assessment of the technical documentation\r\n1. Introduction\r\nConformity based on an assessment of the quality management system and an assessment of the technical documentation is the conformity assessment procedure based on points 2 to 5.\r\n2. Overview\r\nThe approved quality management system for the design, development and testing of AI systems pursuant to Article 17 shall be examined in accordance with point 3 and shall be subject to surveillance as specified in point 5. The technical documentation of the AI system shall be examined in accordance with point 4.\r\n3. Quality management system\r\n3.1.\r\n(a)\r\nthe name and address of the provider and, if the application is lodged by an authorised representative, also their name and address;\r\n(b)\r\nthe list of AI systems covered under the same quality management system;\r\n(c)\r\nthe technical documentation for each AI system covered under the same quality management system;\r\n(d)\r\nthe documentation concerning the quality management system which shall cover all the aspects listed under Article 17;\r\n(e)\r\na description of the procedures in place to ensure that the quality management system remains adequate and effective;\r\n(f)\r\na written declaration that the same application has not been lodged with any other notified body.\r\n3.2.\r\nThe decision shall be notified to the provider or its authorised representative.\r\nThe notification shall contain the conclusions of the assessment of the quality management system and the reasoned assessment decision.\r\n3.3.\r\nThe quality management system as approved shall continue to be implemented and maintained by the provider so that it remains adequate and efficient.\r\n3.4.\r\nThe proposed changes shall be examined by the notified body, which shall decide whether the modified quality management system continues to satisfy the requirements referred to in point 3.2 or whether a reassessment is necessary.\r\nThe notified body shall notify the provider of its decision. The notification shall contain the conclusions of the examination of the changes and the reasoned assessment decision.\r\n4. Control of the technical documentation.\r\n4.1.\r\nIn addition to the application referred to in point 3, an application with a notified body of their choice shall be lodged by the provider for the assessment of the technical documentation relating to the AI system which the provider intends to place on the market or put into service and which is covered by the quality management system referred to under point 3.\r\n4.2.\r\n(a)\r\nthe name and address of the provider;\r\n(b)\r\na written declaration that the same application has not been lodged with any other notified body;\r\n(c)\r\nthe technical documentation referred to in Annex IV.\r\n4.3.\r\nThe technical documentation shall be examined by the notified body. Where relevant, and limited to what is necessary to fulfil its tasks, the notified body shall be granted full access to the training, validation, and testing data sets used, including, where appropriate and subject to security safeguards, through API or other relevant technical means and tools enabling remote access.\r\n4.4.\r\nIn examining the technical documentation, the notified body may require that the provider supply further evidence or carry out further tests so as to enable a proper assessment of the conformity of the AI system with the requirements set out in Chapter III, Section 2. Where the notified body is not satisfied with the tests carried out by the provider, the notified body shall itself directly carry out adequate tests, as appropriate.\r\n4.5.\r\nWhere necessary to assess the conformity of the high-risk AI system with the requirements set out in Chapter III, Section 2, after all other reasonable means to verify conformity have been exhausted and have proven to be insufficient, and upon a reasoned request, the notified body shall also be granted access to the training and trained models of the AI system, including its relevant parameters. Such access shall be subject to existing Union law on the protection of intellectual property and trade secrets.\r\n4.6.\r\nWhere the AI system is in conformity with the requirements set out in Chapter III, Section 2, the notified body shall issue a Union technical documentation assessment certificate. The certificate shall indicate the name and address of the provider, the conclusions of the examination, the conditions (if any) for its validity and the data necessary for the identification of the AI system.\r\nThe certificate and its annexes shall contain all relevant information to allow the conformity of the AI system to be evaluated, and to allow for control of the AI system while in use, where applicable.\r\nWhere the AI system is not in conformity with the requirements set out in Chapter III, Section 2, the notified body shall refuse to issue a Union technical documentation assessment certificate and shall inform the applicant accordingly, giving detailed reasons for its refusal.\r\nWhere the AI system does not meet the requirement relating to the data used to train it, re-training of the AI system will be needed prior to the application for a new conformity assessment. In this case, the reasoned assessment decision of the notified body refusing to issue the Union technical documentation assessment certificate shall contain specific considerations on the quality data used to train the AI system, in particular on the reasons for non-compliance.\r\n4.7.\r\nAny change to the AI system that could affect the compliance of the AI system with the requirements or its intended purpose shall be assessed by the notified body which issued the Union technical documentation assessment certificate. The provider shall inform such notified body of its intention to introduce any of the abovementioned changes, or if it otherwise becomes aware of the occurrence of such changes. The intended changes shall be assessed by the notified body, which shall decide whether those changes require a new conformity assessment in accordance with Article 43(4) or whether they could be addressed by means of a supplement to the Union technical documentation assessment certificate. In the latter case, the notified body shall assess the changes, notify the provider of its decision and, where the changes are approved, issue to the provider a supplement to the Union technical documentation assessment certificate.\r\n5. Surveillance of the approved quality management system.\r\n5.1.\r\nThe purpose of the surveillance carried out by the notified body referred to in Point 3 is to make sure that the provider duly complies with the terms and conditions of the approved quality management system.\r\n5.2.\r\nFor assessment purposes, the provider shall allow the notified body to access the premises where the design, development, testing of the AI systems is taking place. The provider shall further share with the notified body all necessary information.\r\n5.3.\r\nThe notified body shall carry out periodic audits to make sure that the provider maintains and applies the quality management system and shall provide the provider with an audit report. In the context of those audits, the notified body may carry out additional tests of the AI systems for which a Union technical documentation assessment certificate was issued.","FULL_SOURCE_CONTEXT_BEFORE":"[ANNEX VI]\r\nANNEX VI\r\nConformity assessment procedure based on internal control\r\n1.\r\nThe conformity assessment procedure based on internal control is the conformity assessment procedure based on points 2, 3 and 4.\r\n2.\r\nThe provider verifies that the established quality management system is in compliance with the requirements of Article 17.\r\n3.\r\nThe provider examines the information contained in the technical documentation in order to assess the compliance of the AI system with the relevant essential requirements set out in Chapter III, Section 2.\r\n4.\r\nThe provider also verifies that the design and development process of the AI system and its post-market monitoring as referred to in Article 72 is consistent with the technical documentation.","FULL_SOURCE_CONTEXT_AFTER":"[ANNEX VIII]\r\nANNEX VIII\r\nInformation to be submitted upon the registration of high-risk AI systems in accordance with Article 49\r\nSection A â€” Information to be submitted by providers of high-risk AI systems in accordance with Article 49(1)\r\nThe following information shall be provided and thereafter kept up to date with regard to high-risk AI systems to be registered in accordance with Article 49(1):\r\n1.\r\nThe name, address and contact details of the provider;\r\n2.\r\nWhere submission of information is carried out by another person on behalf of the provider, the name, address and contact details of that person;\r\n3.\r\nThe name, address and contact details of the authorised representative, where applicable;\r\n4.\r\nThe AI system trade name and any additional unambiguous reference allowing the identification and traceability of the AI system;\r\n5.\r\nA description of the intended purpose of the AI system and of the components and functions supported through this AI system;\r\n6.\r\nA basic and concise description of the information used by the system (data, inputs) and its operating logic;\r\n7.\r\nThe status of the AI system (on the market, or in service; no longer placed on the market/in service, re","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-010","QA_ID":"QA2B-010","EXTRACTION_ID":"EXT-000071","CASE_ID":"D1_GDPR","CELEX":"32016R0679","SOURCE_POINTER":"32016R0679#article_36/p4","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"GDPR operative article; single clear consultation action and procedural object.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"Member States","LUNA_ACTION":"consult or hear","LUNA_OBJECT":"of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.","LUNA_COUNTERPART":"","LUNA_RECIPIENT":"","LUNA_SELFREVIEW_ERROR":"ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR","TERRA_ERROR":"ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"MEDIUM","TERRA_ABSTAIN":"NO","FULL_SOURCE_TEXT":"[ARTICLE 36]\r\nArticle 36\r\nPrior consultation\r\n1. The controller shall consult the supervisory authority prior to processing where a data protection impact assessment under Article 35 indicates that the processing would result in a high risk in the absence of measures taken by the controller to mitigate the risk.\r\n2. Where the supervisory authority is of the opinion that the intended processing referred to in paragraph 1 would infringe this Regulation, in particular where the controller has insufficiently identified or mitigated the risk, the supervisory authority shall, within period of up to eight weeks of receipt of the request for consultation, provide written advice to the controller and, where applicable to the processor, and may use any of its powers referred to in Article 58. That period may be extended by six weeks, taking into account the complexity of the intended processing. The supervisory authority shall inform the controller and, where applicable, the processor, of any such extension within one month of receipt of the request for consultation together with the reasons for the delay. Those periods may be suspended until the supervisory authority has obtained information it has requested for the purposes of the consultation.\r\n3. When consulting the supervisory authority pursuant to paragraph 1, the controller shall provide the supervisory authority with:\r\n(a)\r\nwhere applicable, the respective responsibilities of the controller, joint controllers and processors involved in the processing, in particular for processing within a group of undertakings;\r\n(b)\r\nthe purposes and means of the intended processing;\r\n(c)\r\nthe measures and safeguards provided to protect the rights and freedoms of data subjects pursuant to this Regulation;\r\n(d)\r\nwhere applicable, the contact details of the data protection officer;\r\n(e)\r\nthe data protection impact assessment provided for in Article 35; and\r\n(f)\r\nany other information requested by the supervisory authority.\r\n4. Member States shall consult the supervisory authority during the preparation of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.\r\n5. Notwithstanding paragraph 1, Member State law may require controllers to consult with, and obtain prior authorisation from, the supervisory authority in relation to processing by a controller for the performance of a task carried out by the controller in the public interest, including processing in relation to social protection and public health.\r\n[SECTION 4]\r\nSection 4\r\nData protection officer","FULL_SOURCE_CONTEXT_BEFORE":"sessing the impact of the processing operations performed by such controllers or processors, in particular for the purposes of a data protection impact assessment.\r\n9. Where appropriate, the controller shall seek the views of data subjects or their representatives on the intended processing, without prejudice to the protection of commercial or public interests or the security of processing operations.\r\n10. Where processing pursuant to point (c) or (e) of Article 6(1) has a legal basis in Union law or in the law of the Member State to which the controller is subject, that law regulates the specific processing operation or set of operations in question, and a data protection impact assessment has already been carried out as part of a general impact assessment in the context of the adoption of that legal basis, paragraphs 1 to 7 shall not apply unless Member States deem it to be necessary to carry out such an assessment prior to processing activities.\r\n11. Where necessary, the controller shall carry out a review to assess if processing is performed in accordance with the data protection impact assessment at least when there is a change of the risk represented by processing operations.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 37]\r\nArticle 37\r\nDesignation of the data protection officer\r\n1. The controller and the processor shall designate a data protection officer in any case where:\r\n(a)\r\nthe processing is carried out by a public authority or body, except for courts acting in their judicial capacity;\r\n(b)\r\nthe core activities of the controller or the processor consist of processing operations which, by virtue of their nature, their scope and/or their purposes, require regular and systematic monitoring of data subjects on a large scale; or\r\n(c)\r\nthe core activities of the controller or the processor consist of processing on a large scale of special categories of data pursuant to Article 9 and personal data relating to criminal convictions and offences referred to in Article 10.\r\n2. A group of undertakings may appoint a single data protection officer provided that a data protection officer is easily accessible from each establishment.\r\n3. Where the controller or the processor is a public authority or body, a single data protection officer may be designated for several such authorities or bodies, taking account of their organisational structure and size.\r\n4. In cases other than those referred to in ","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-025","QA_ID":"QA2B-025","EXTRACTION_ID":"EXT-000266","CASE_ID":"D1_GDPR","CELEX":"32016R0679","SOURCE_POINTER":"32016R0679#recital_10","SOURCE_TYPE":"RECITAL","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"GDPR recital with several clauses, a consequence followed by a Member State proposition, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"natural persons with regard to the processing of personal data","LUNA_ACTION":"be ensured throughout the Union","LUNA_OBJECT":". Regarding the processing of personal data for compliance with a legal obligation, for the performance of a task carried out in the public interest or in the exercise of officialâ€¦","LUNA_COUNTERPART":"to the processing of such data should be equivalent in all Member States","LUNA_RECIPIENT":"to the processing of such data should be equivalent in all Member States","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[RECITAL 10]\r\n(10)\r\nIn order to ensure a consistent and high level of protection of natural persons and to remove the obstacles to flows of personal data within the Union, the level of protection of the rights and freedoms of natural persons with regard to the processing of such data should be equivalent in all Member States. Consistent and homogenous application of the rules for the protection of the fundamental rights and freedoms of natural persons with regard to the processing of personal data should be ensured throughout the Union. Regarding the processing of personal data for compliance with a legal obligation, for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller, Member States should be allowed to maintain or introduce national provisions to further specify the application of the rules of this Regulation. In conjunction with the general and horizontal law on data protection implementing Directive 95/46/EC, Member States have several sector-specific laws in areas that need more specific provisions. This Regulation also provides a margin of manoeuvre for Member States to specify its rules, including for the processing of special categories of personal data (â€˜sensitive dataâ€™). To that extent, this Regulation does not exclude Member State law that sets out the circumstances for specific processing situations, including determining more precisely the conditions under which the processing of personal data is lawful.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 9]\r\n(9)\r\nThe objectives and principles of Directive 95/46/EC remain sound, but it has not prevented fragmentation in the implementation of data protection across the Union, legal uncertainty or a widespread public perception that there are significant risks to the protection of natural persons, in particular with regard to online activity. Differences in the level of protection of the rights and freedoms of natural persons, in particular the right to the protection of personal data, with regard to the processing of personal data in the Member States may prevent the free flow of personal data throughout the Union. Those differences may therefore constitute an obstacle to the pursuit of economic activities at the level of the Union, distort competition and impede authorities in the discharge of their responsibilities under Union law. Such a difference in levels of protection is due to the existence of differences in the implementation and application of Directive 95/46/EC.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 11]\r\n(11)\r\nEffective protection of personal data throughout the Union requires the strengthening and setting out in detail of the rights of data subjects and the obligations of those who process and determine the processing of personal data, as well as equivalent powers for monitoring and ensuring compliance with the rules for the protection of personal data and equivalent sanctions for infringements in the Member States.","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-033","QA_ID":"QA2B-033","EXTRACTION_ID":"EXT-000505","CASE_ID":"D2_DSA","CELEX":"32022R2065","SOURCE_POINTER":"32022R2065#article_16/p5","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"DSA operative article; compact notification action where the extracted action is reduced to “also”.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"The provider","LUNA_ACTION":"also","LUNA_OBJECT":", without undue delay, notify that individual or entity of its decision in respect of the information to which the notice relates, providing information on the possibilities for reâ€¦","LUNA_COUNTERPART":"","LUNA_RECIPIENT":"","LUNA_SELFREVIEW_ERROR":"ACTION_EXTRACTION_ERROR","TERRA_ERROR":"ACTION_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTION_EXTRACTION_ERROR","TERRA_CONFIDENCE":"MEDIUM","TERRA_ABSTAIN":"NO","FULL_SOURCE_TEXT":"[ARTICLE 16]\r\nArticle 16\r\nNotice and action mechanisms\r\n1. Providers of hosting services shall put mechanisms in place to allow any individual or entity to notify them of the presence on their service of specific items of information that the individual or entity considers to be illegal content. Those mechanisms shall be easy to access and user-friendly, and shall allow for the submission of notices exclusively by electronic means.\r\n2. The mechanisms referred to in paragraph 1 shall be such as to facilitate the submission of sufficiently precise and adequately substantiated notices. To that end, the providers of hosting services shall take the necessary measures to enable and to facilitate the submission of notices containing all of the following elements:\r\n(a)\r\na sufficiently substantiated explanation of the reasons why the individual or entity alleges the information in question to be illegal content;\r\n(b)\r\na clear indication of the exact electronic location of that information, such as the exact URL or URLs, and, where necessary, additional information enabling the identification of the illegal content adapted to the type of content and to the specific type of hosting service;\r\n(c)\r\nthe name and email address of the individual or entity submitting the notice, except in the case of information considered to involve one of the offences referred to in Articles 3 to 7 of Directive 2011/93/EU;\r\n(d)\r\na statement confirming the bona fide belief of the individual or entity submitting the notice that the information and allegations contained therein are accurate and complete.\r\n3. Notices referred to in this Article shall be considered to give rise to actual knowledge or awareness for the purposes of Article 6 in respect of the specific item of information concerned where they allow a diligent provider of hosting services to identify the illegality of the relevant activity or information without a detailed legal examination.\r\n4. Where the notice contains the electronic contact information of the individual or entity that submitted it, the provider of hosting services shall, without undue delay, send a confirmation of receipt of the notice to that individual or entity.\r\n5. The provider shall also, without undue delay, notify that individual or entity of its decision in respect of the information to which the notice relates, providing information on the possibilities for redress in respect of that decision.\r\n6. Providers of hosting services shall process any notices that they receive under the mechanisms referred to in paragraph 1 and take their decisions in respect of the information to which the notices relate, in a timely, diligent, non-arbitrary and objective manner. Where they use automated means for that processing or decision-making, they shall include information on such use in the notification referred to in paragraph 5.","FULL_SOURCE_CONTEXT_BEFORE":" the basis for those complaints, decisions taken in respect of those complaints, the median time needed for taking those decisions and the number of instances where those decisions were reversed;\r\n(e)\r\nany use made of automated means for the purpose of content moderation, including a qualitative description, a specification of the precise purposes, indicators of the accuracy and the possible rate of error of the automated means used in fulfilling those purposes, and any safeguards applied.\r\n2. Paragraph 1 of this Article shall not apply to providers of intermediary services that qualify as micro or small enterprises as defined in Recommendation 2003/361/EC and which are not very large online platforms within the meaning of Article 33 of this Regulation.\r\n3. The Commission may adopt implementing acts to lay down templates concerning the form, content and other details of reports pursuant to paragraph 1 of this Article, including harmonised reporting periods. Those implementing acts shall be adopted in accordance with the advisory procedure referred to in Article 88.\r\n[SECTION 2]\r\nSECTION 2\r\nAdditional provisions applicable to providers of hosting services, including online platforms","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 17]\r\nArticle 17\r\nStatement of reasons\r\n1. Providers of hosting services shall provide a clear and specific statement of reasons to any affected recipients of the service for any of the following restrictions imposed on the ground that the information provided by the recipient of the service is illegal content or incompatible with their terms and conditions:\r\n(a)\r\nany restrictions of the visibility of specific items of information provided by the recipient of the service, including removal of content, disabling access to content, or demoting content;\r\n(b)\r\nsuspension, termination or other restriction of monetary payments;\r\n(c)\r\nsuspension or termination of the provision of the service in whole or in part;\r\n(d)\r\nsuspension or termination of the recipient of the service's account.\r\n2. Paragraph 1 shall only apply where the relevant electronic contact details are known to the provider. It shall apply at the latest from the date that the restriction is imposed, regardless of why or how it was imposed.\r\nParagraph 1 shall not apply where the information is deceptive high-volume commercial content.\r\n3. The statement of reasons referred to in paragraph 1 shall at least contain the ","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-054","QA_ID":"QA2B-054","EXTRACTION_ID":"EXT-000728","CASE_ID":"D2_DSA","CELEX":"32022R2065","SOURCE_POINTER":"32022R2065#recital_101","SOURCE_TYPE":"RECITAL","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"DSA recital with long subordinate clauses and multiple distinct actors/actions, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"and considering that Member States","LUNA_ACTION":"be entitled to charge providers established in","LUNA_OBJECT":"their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised by their authorities, the Commission should charge a supervisory fee, the level oâ€¦","LUNA_COUNTERPART":"to the exercise of the specific powers and tasks of supervision","LUNA_RECIPIENT":"to the exercise of the specific powers and tasks of supervision","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[RECITAL 101]\r\n(101)\r\nThe Commission should be in possession of all the necessary resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessary for the adequate supervision at Union level under this Regulation, and considering that Member States should be entitled to charge providers established in their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised by their authorities, the Commission should charge a supervisory fee, the level of which should be established on an annual basis, on very large online platforms and very large online search engines. The overall amount of the annual supervisory fee charged should be established on the basis of the overall amount of the costs incurred by the Commission to exercise its supervisory tasks under this Regulation, as reasonably estimated beforehand. Such amount should include costs relating to the exercise of the specific powers and tasks of supervision, investigation, enforcement and monitoring in respect of providers of very large online platforms and of very large online search engines, including costs related to the designation of very large online platforms and of very large online search engines or to the set up, maintenance and operation of the databases envisaged under this Regulation.\r\nIt should also include costs relating to the set-up, maintenance and operation of the basic information and institutional infrastructure for the cooperation among Digital Services Coordinators, the Board and the Commission, taking into account the fact that in view of their size and reach very large online platforms and very large online search engines have a significant impact on the resources needed to support such infrastructure. The estimation of the overall costs should take into account the supervisory costs incurred in the previous year including, where applicable, those costs exceeding the individual annual supervisory fee charged in the previous year. The external assigned revenues resulting from the annual supervisory fee could be used to finance additional human resources, such as contractual agents and seconded national experts, and other expenditure related to the fulfilment of the tasks entrusted to the Commission by this Regulation. The annual supervisory fee to be charged on providers of very large online platforms and of very large online search engines should be proportionate to the size of the service as reflected by the number of its active recipients of the service in the Union. Moreover, the individual annual supervisory fee should not exceed an overall ceiling for each provider of very large online platforms or of very large online search engines taking into account the economic capacity of the provider of the designated service or services.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 100]\r\n(100)\r\nIn view of the additional risks relating to their activities and their additional obligations under this Regulation, additional transparency requirements should apply specifically to very large online platforms and very large online search engines, notably to report comprehensively on the risk assessments performed and subsequent measures adopted as provided by this Regulation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 102]\r\n(102)\r\nTo facilitate the effective and consistent application of the obligations in this Regulation that may require implementation through technological means, it is important to promote voluntary standards covering certain technical procedures, where the industry can help develop standardised means to support providers of intermediary services in complying with this Regulation, such as allowing the submission of notices, including through application programming interfaces, or standards related to terms and conditions or standards relating to audits, or standards related to the interoperability of advertisement repositories. In addition, such standards could include standards related to online advertising, recommender systems, accessibility and the protection of minors online. Providers of intermediary services are free to adopt the standards, but their adoption does not presume compliance with this Regulation. At the same time, by providing best practices, such standards could in particular be useful for relatively small providers of intermediary services. The standards could distinguish between different types of illegal content or different types of intermediary","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-077","QA_ID":"QA2B-077","EXTRACTION_ID":"EXT-000958","CASE_ID":"D3_AI_ACT","CELEX":"32024R1689","SOURCE_POINTER":"32024R1689#article_25/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"TYPICAL","SELECTION_REASON":"AI Act operative article; explicit list of possible actors and a short legal consequence, suitable for actor/action boundary inspection.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"deployer or other third-party","LUNA_ACTION":"be considered to be a provider of","LUNA_OBJECT":"a high-risk AI system ","LUNA_COUNTERPART":"to the obligations of the provider under Article 16","LUNA_RECIPIENT":"to the obligations of the provider under Article 16","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[ARTICLE 25]\r\nArticle 25\r\nResponsibilities along the AI value chain\r\n1. Any distributor, importer, deployer or other third-party shall be considered to be a provider of a high-risk AI system for the purposes of this Regulation and shall be subject to the obligations of the provider under Article 16, in any of the following circumstances:\r\n(a)\r\nthey put their name or trademark on a high-risk AI system already placed on the market or put into service, without prejudice to contractual arrangements stipulating that the obligations are otherwise allocated;\r\n(b)\r\nthey make a substantial modification to a high-risk AI system that has already been placed on the market or has already been put into service in such a way that it remains a high-risk AI system pursuant to Article 6;\r\n(c)\r\nthey modify the intended purpose of an AI system, including a general-purpose AI system, which has not been classified as high-risk and has already been placed on the market or put into service in such a way that the AI system concerned becomes a high-risk AI system in accordance with Article 6.\r\n2. Where the circumstances referred to in paragraph 1 occur, the provider that initially placed the AI system on the market or put it into service shall no longer be considered to be a provider of that specific AI system for the purposes of this Regulation. That initial provider shall closely cooperate with new providers and shall make available the necessary information and provide the reasonably expected technical access and other assistance that are required for the fulfilment of the obligations set out in this Regulation, in particular regarding the compliance with the conformity assessment of high-risk AI systems. This paragraph shall not apply in cases where the initial provider has clearly specified that its AI system is not to be changed into a high-risk AI system and therefore does not fall under the obligation to hand over the documentation.\r\n3. In the case of high-risk AI systems that are safety components of products covered by the Union harmonisation legislation listed in Section A of Annex I, the product manufacturer shall be considered to be the provider of the high-risk AI system, and shall be subject to the obligations under Article 16 under either of the following circumstances:\r\n(a)\r\nthe high-risk AI system is placed on the market together with the product under the name or trademark of the product manufacturer;\r\n(b)\r\nthe high-risk AI system is put into service under the name or trademark of the product manufacturer after the product has been placed on the market.\r\n4. The provider of a high-risk AI system and the third party that supplies an AI system, tools, services, components, or processes that are used or integrated in a high-risk AI system shall, by written agreement, specify the necessary information, capabilities, technical access and other assistance based on the generally acknowledged state of the art, in order to enable the provider of the high-risk AI system to fully comply with the obligations set out in this Regulation. This paragraph shall not apply to third parties making accessible to the public tools, services, processes, or components, other than general-purpose AI models, under a free and open-source licence.\r\nThe AI Office may develop and recommend voluntary model terms for contracts between providers of high-risk AI systems and third parties that supply tools, services, components or processes that are used for or integrated into high-risk AI systems. When developing those voluntary model terms, the AI Office shall take into account possible contractual requirements applicable in specific sectors or business cases. The voluntary model terms shall be published and be available free of charge in an easily usable electronic format.\r\n5. Paragraphs 2 and 3 are without prejudice to the need to observe and protect intellectual property rights, confidential business information and trade secrets in accordance with Union and national law.","FULL_SOURCE_CONTEXT_BEFORE":"the requirements set out in Section 2, shall take the corrective actions necessary to bring that system into conformity with those requirements, to withdraw it or recall it, or shall ensure that the provider, the importer or any relevant operator, as appropriate, takes those corrective actions. Where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall immediately inform the provider or importer of the system and the authorities competent for the high-risk AI system concerned, giving details, in particular, of the non-compliance and of any corrective actions taken.\r\n5. Upon a reasoned request from a relevant competent authority, distributors of a high-risk AI system shall provide that authority with all the information and documentation regarding their actions pursuant to paragraphs 1 to 4 necessary to demonstrate the conformity of that system with the requirements set out in Section 2.\r\n6. Distributors shall cooperate with the relevant competent authorities in any action those authorities take in relation to a high-risk AI system made available on the market by the distributors, in particular to reduce or mitigate the risk posed by it.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 26]\r\nArticle 26\r\nObligations of deployers of high-risk AI systems\r\n1. Deployers of high-risk AI systems shall take appropriate technical and organisational measures to ensure they use such systems in accordance with the instructions for use accompanying the systems, pursuant to paragraphs 3 and 6.\r\n2. Deployers shall assign human oversight to natural persons who have the necessary competence, training and authority, as well as the necessary support.\r\n3. The obligations set out in paragraphs 1 and 2, are without prejudice to other deployer obligations under Union or national law and to the deployerâ€™s freedom to organise its own resources and activities for the purpose of implementing the human oversight measures indicated by the provider.\r\n4. Without prejudice to paragraphs 1 and 2, to the extent the deployer exercises control over the input data, that deployer shall ensure that input data is relevant and sufficiently representative in view of the intended purpose of the high-risk AI system.\r\n5. Deployers shall monitor the operation of the high-risk AI system on the basis of the instructions for use and, where relevant, inform providers in accordance with Article 72. Wher","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""},{"DIAGNOSTIC_ID":"R4_2D-QA2B-083","QA_ID":"QA2B-083","EXTRACTION_ID":"EXT-001263","CASE_ID":"D3_AI_ACT","CELEX":"32024R1689","SOURCE_POINTER":"32024R1689#recital_106","SOURCE_TYPE":"RECITAL","PATTERN":"ACTOR_ACTION_FRAGMENTATION","SELECTION_TYPE":"COMPLEX","SELECTION_REASON":"AI Act recital with extended multi-sentence reasoning and cross-reference, LOW confidence and Terra abstention.","PRIORITY":"PRIORITY_1_CROSS_MODEL_ERROR","LUNA_ACTOR":"field among providers of general-purpose AI models where no provider","LUNA_ACTION":"be able to gain a competitive advantage","LUNA_OBJECT":"in the Union market by applying lower copyright standards than those provided in the Union.","LUNA_COUNTERPART":"with the relevant obligations in this Regulation","LUNA_RECIPIENT":"with the relevant obligations in this Regulation","LUNA_SELFREVIEW_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_ERROR":"ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CORRECTION":"Targeted human diagnostic recommended for: ACTOR_EXTRACTION_ERROR;ACTION_EXTRACTION_ERROR;OBJECT_EXTRACTION_ERROR;COUNTERPART_EXTRACTION_ERROR;RECIPIENT_EXTRACTION_ERROR","TERRA_CONFIDENCE":"LOW","TERRA_ABSTAIN":"YES","FULL_SOURCE_TEXT":"[RECITAL 106]\r\n(106)\r\nProviders that place general-purpose AI models on the Union market should ensure compliance with the relevant obligations in this Regulation. To that end, providers of general-purpose AI models should put in place a policy to comply with Union law on copyright and related rights, in particular to identify and comply with the reservation of rights expressed by rightsholders pursuant to Article 4(3) of Directive (EU) 2019/790. Any provider placing a general-purpose AI model on the Union market should comply with this obligation, regardless of the jurisdiction in which the copyright-relevant acts underpinning the training of those general-purpose AI models take place. This is necessary to ensure a level playing field among providers of general-purpose AI models where no provider should be able to gain a competitive advantage in the Union market by applying lower copyright standards than those provided in the Union.","FULL_SOURCE_CONTEXT_BEFORE":"ists, authors, and other creators and the way their creative content is created, distributed, used and consumed. The development and training of such models require access to vast amounts of text, images, videos and other data. Text and data mining techniques may be used extensively in this context for the retrieval and analysis of such content, which may be protected by copyright and related rights. Any use of copyright protected content requires the authorisation of the rightsholder concerned unless relevant copyright exceptions and limitations apply. Directive (EU) 2019/790 introduced exceptions and limitations allowing reproductions and extractions of works or other subject matter, for the purpose of text and data mining, under certain conditions. Under these rules, rightsholders may choose to reserve their rights over their works or other subject matter to prevent text and data mining, unless this is done for the purposes of scientific research. Where the rights to opt out has been expressly reserved in an appropriate manner, providers of general-purpose AI models need to obtain an authorisation from rightsholders if they want to carry out text and data mining over such works.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 107]\r\n(107)\r\nIn order to increase transparency on the data that is used in the pre-training and training of general-purpose AI models, including text and data protected by copyright law, it is adequate that providers of such models draw up and make publicly available a sufficiently detailed summary of the content used for training the general-purpose AI model. While taking into due account the need to protect trade secrets and confidential business information, this summary should be generally comprehensive in its scope instead of technically detailed to facilitate parties with legitimate interests, including copyright holders, to exercise and enforce their rights under Union law, for example by listing the main data collections or sets that went into training the model, such as large private or public databases or data archives, and by providing a narrative explanation about other data sources used. It is appropriate for the AI Office to provide a template for the summary, which should be simple, effective, and allow the provider to provide the required summary in narrative form.","HUMAN_PATTERN_CONFIRMED":"","HUMAN_ACTOR_CORRECT":"","HUMAN_ACTION_CORRECT":"","HUMAN_OBJECT_CORRECT":"","HUMAN_COUNTERPART_CORRECT":"","HUMAN_RECIPIENT_CORRECT":"","HUMAN_CORRECT_ACTOR":"","HUMAN_CORRECT_ACTION":"","HUMAN_CORRECT_OBJECT":"","HUMAN_CORRECT_COUNTERPART":"","HUMAN_CORRECT_RECIPIENT":"","HUMAN_NOTES":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":""}];const key='R4_2D_HUMAN_DIAGNOSTIC_V1';let i=0;const explicit=['HUMAN_PATTERN_CONFIRMED','HUMAN_ACTOR_CORRECT','HUMAN_ACTION_CORRECT','HUMAN_OBJECT_CORRECT','HUMAN_COUNTERPART_CORRECT','HUMAN_RECIPIENT_CORRECT'];const opts=(values,current)=>'<option value="">Select…</option>'+values.map(v=>'<option '+(current===v?'selected':'')+'>'+v+'</option>').join('');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isDone(r){return explicit.every(k=>['YES','NO','N/A','PARTIALLY'].includes(r[k]))&&['YES','PARTIALLY','NO'].includes(r.HUMAN_PATTERN_CONFIRMED)}function saveState(){localStorage.setItem(key,JSON.stringify(rows));document.getElementById('saved').textContent='Saved locally';renderCount()}function loadState(){try{const old=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(old)&&old.length===rows.length&&old.every((x,n)=>x.QA_ID===rows[n].QA_ID))for(let n=0;n<rows.length;n++)Object.assign(rows[n],old[n])}catch{}}

resent in this record?</h2><div class="question"><label>Human pattern confirmation</label><select data-key="HUMAN_PATTERN_CONFIRMED">'+opts(['YES','NO','PARTIALLY'],r.HUMAN_PATTERN_CONFIRMED)+'</select></div>'+[['HUMAN_ACTOR_CORRECT','Actor correct?'],['HUMAN_ACTION_CORRECT','Action correct?'],['HUMAN_OBJECT_CORRECT','Object correct?'],['HUMAN_COUNTERPART_CORRECT','Counterpart correct?'],['HUMAN_RECIPIENT_CORRECT','Recipient correct?']].map(([k,l])=>'<div class="question"><label>'+l+'</label><select data-key="'+k+'">'+opts(['YES','NO','N/A'],r[k])+'</select></div>').join('')+'<h3>Concise corrections, where needed</h3><div class="corrections">'+[['HUMAN_CORRECT_ACTOR','Correct actor'],['HUMAN_CORRECT_ACTION','Correct action'],['HUMAN_CORRECT_OBJECT','Correct object'],['HUMAN_CORRECT_COUNTERPART','Correct counterpart'],['HUMAN_CORRECT_RECIPIENT','Correct recipient']].map(([k,l])=>'<label>'+l+'<input data-key="'+k+'" value="'+esc(r[k])+'"></label>').join('')+'</div><h3>Researcher notes</h3><textarea class="notes" data-key="HUMAN_NOTES" placeholder="Optional short rationale or source clarification">'+esc(r.HUMAN_NOTES)+'</textarea><p class="muted">A record is marked REVIEWED only after the primary decision and all five field decisions are explicitly selected. Reviewer name alone never completes a record.</p><button id="saveRecord" class="primary">Save this decision</button><span class="status"> '+esc(r.HUMAN_REVIEW_STATUS||'PENDING')+'</span></section>';

document.getElementById('prev').onclick=document.getElementById('prev2').onclick=()=>nav(-1);document.getElementById('next').onclick=document.getElementById('next2').onclick=()=>nav(1);document.getElementById('goto').onchange=e=>{i=Number(e.target.value);render()};document.getElementById('save').onclick=saveState;document.getElementById('csv').onclick=()=>download('R4_2D_HUMAN_DIAGNOSTIC_COMPLETED.csv',csv(),'text/csv;charset=utf-8');document.getElementById('json').onclick=()=>download('R4_2D_HUMAN_DIAGNOSTIC_COMPLETED.json',JSON.stringify(rows,null,2),'application/json;charset=utf-8');loadState();render();
