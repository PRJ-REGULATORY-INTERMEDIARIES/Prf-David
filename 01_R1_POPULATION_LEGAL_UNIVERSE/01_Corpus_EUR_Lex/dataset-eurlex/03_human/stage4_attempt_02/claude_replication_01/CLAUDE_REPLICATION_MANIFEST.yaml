    - 03_human/stage4_attempt_02/R2_context_manifest.yaml (Terra)
    - 03_human/stage4_attempt_02/RA_context_manifest.yaml
    - any Terra R1xR2 comparison
    - any RA (existing or future)
    - 03_human/stage4_attempt_01/** (any file)
    - any prior benchmark
    - G0/G1/G2 outputs (04_prompts/, 05_runs/, 06_comparison/, 07_report/)
    - methodology/v1.1.0/strings.yaml (and prior-version strings.yaml)
    - any prior empirical LLM result
  forbidden_inputs_status: present_in_workspace_but_not_accessed
