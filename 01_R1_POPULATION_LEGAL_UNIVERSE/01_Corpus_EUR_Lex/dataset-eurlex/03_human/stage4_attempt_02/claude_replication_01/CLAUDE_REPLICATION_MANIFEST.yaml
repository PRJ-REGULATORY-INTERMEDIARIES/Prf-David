replication:
  id: claude_replication_01
  type: cross_model_replication
  project: dataset-eurlex
  stage: 4
  stage_path: 03_human/stage4_attempt_02/claude_replication_01
  purpose: >
    Produce two independent substantive codings (Claude-R1, Claude-R2) over the
    same frozen 90-candidate universe already used for the OpenAI/Terra
    execution, for later external comparison against Terra-R1, Terra-R2,
    Claude-R1 and Claude-R2. This replication performs no comparison itself.

model:
  provider: Anthropic
  model_name: Claude Sonnet 5
  model_id: claude-sonnet-5
  reasoning_effort: default (inherited from orchestrating session; no explicit
    effort override applied to either subagent context)
  identical_for_R1_and_R2: true

execution:
  orchestrator_session_model: claude-sonnet-5
  r1_context: independent fresh subagent context ("Claude-R1"), no memory of
    orchestrator conversation beyond the explicit authorized-input prompt
  r2_context: independent fresh subagent context ("Claude-R2"), spawned only
    after the Claude-R1 context was closed; contains no summary, statistics,
    decisions, or derived information from Claude-R1
  isolation_mechanism: >
    Each subagent context is created via a new, independent agent invocation
    with no shared memory across invocations and no resumption of a prior
    agent. R1 and R2 are separate invocations; neither was given any content
    derived from the other.
  isolation_guaranteed: true
  timestamp_utc: 2026-09-07T17:45:43Z

corpus:
  celex: 32021R1119
  source: EUR-Lex
  path: 02_corpus/act.md
  sha256: b24a02ea241ca631b606660bb48bb5a2222b29f849c4e4552fb99f871b2e8fd4
  locked: true

