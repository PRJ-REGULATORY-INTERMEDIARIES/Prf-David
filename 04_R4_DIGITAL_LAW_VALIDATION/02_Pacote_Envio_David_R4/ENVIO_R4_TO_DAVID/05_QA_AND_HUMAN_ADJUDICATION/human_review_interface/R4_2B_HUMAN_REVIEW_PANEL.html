ropriate, by electronic means. When requested by the data subject, the information may be provided orally, provided that the identity of the data subject is proven by other means.\r\n2. The controller shall facilitate the exercise of data subject rights under Articles 15 to 22. In the cases referred to in Article 11(2), the controller shall not refuse to act on the request of the data subject for exercising his or her rights under Articles 15 to 22, unless the controller demonstrates that it is not in a position to identify the data subject.\r\n3. The controller shall provide information on action taken on a request under Articles 15 to 22 to the data subject without undue delay and in any event within one month of receipt of the request. That period may be extended by two further months where necessary, taking into account the complexity and number of the requests. The controller shall inform the data subject of any such extension within one month of receipt of the request, together with the reasons for the delay. Where the data subject makes the request by electronic form means, the information shall be provided by electronic means where possible, unless otherwise requested by the data subject.\r\n4. If the controller does not take action on the request of the data subject, the controller shall inform the data subject without delay and at the latest within one month of receipt of the request of the reasons for not taking action and on the possibility of lodging a complaint with a supervisory authority and seeking a judicial remedy.\r\n5. Information provided under Articles 13 and 14 and any communication and any actions taken under Articles 15 to 22 and 34 shall be provided free of charge. Where requests from a data subject are manifestly unfounded or excessive, in particular because of their repetitive character, the controller may either:\r\n(a)\r\ncharge a reasonable fee taking into account the administrative costs of providing the information or communication ecks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 21]\r\nArticle 21\r\nRight to object\r\n1. The data subject shall have the right to object, on grounds relating to his or her particular situation, at any time to processing of personal data concerning him or her which is based on point (e) or (f) of Article 6(1), including profiling based on those provisions. The controller shall no longer process the personal data unless the controller demonstrates compelling legitimate grounds for the processing which override the interests, rights and freedoms of the data subject or for the establishment, exercise or defence of legal claims.\r\n2. Where personal data are processed for direct marketing purposes, the data subject shall have the right to object at any time to processing of personal data concerning him or her for such marketing, which includes profiling to the extent that it is related to such direct marketing.\r\n3. Where the data subject objects to processing for direct marketing purposes, the personal data shall no longer be processed for such purposes.\r\n4. At the latest at the time of the first communication with the data subject, the right referred to in paragraphs 1 and 2 shall be explicitly brought to the attention of the data subject and shall be presented clearly and separately from any other information.\r\n5. In the context of the use of information society services, and notwithstanding Directive 2002/58/EC, the data subject may exercise his or her right to object by automated means using technical specifications.\r\n6. Where personal data are processed for scientific or historical research purposes or statistical purposes pursuant to Article 89(1), the data subject, on grounds relating to his or her particular situation, shall have the right to object to processing of personal data concerning him or her, unless the processing is necessary direct marketing purposes, the personal data shall no longer be processed for such purposes.\r\n4. At the latest at the time of the first communication with the data subject, the right referred to in paragraphs 1 and 2 shall be explicitly brought to the attention of the data subject and shall be presented clearly and separately from any other information.\r\n5. In the context of the use of information society services, and notwithstanding Directive 2002/58/EC, the data subject may exercise his or her right to object by automated means using technical specifications.\r\n6. Where personal data are processed for scientific or historical research purposes or statistical purposes pursuant to Article 89(1), the data subject, on grounds relating to his or her particular situation, shall have the right to object to processing of personal data concerning him or her, unless the processing is necessary for the performance of a task carried out for reasons of public interest.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 23]\r\nArticle 23\r\nRestrictions\r\n1. Union or Member State law to which the data controller or processor is subject may restrict by way of a legislative measure the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34, as well as Article 5 in so far as its provisions correspond to the rights and obligations provided for in Articles 12 to 22, when such a restriction respects the essence of the fundamental rights and freedoms and is a necessary and proportionate measure in a democratic society to safeguard:\r\n(a)\r\nnational security;\r\n(b)\r\ndefence;\r\n(c)\r\npublic security;\r\n(d)\r\nthe prevention, investigation, detection or prosecution of criminal offences or the execution of criminal penalties, including the safeguarding against and the prevention of threats to public security;\r\n(e)\r\nother important objectives of general public interest of the Union or of a Member State, in particular an important economic or financial interest of the Union or of a Member State, including monetary, budgetary and taxation a matters, public health and social security;\r\n(f)\r\nthe protection of judicial independence and judicial proceedings;\r\n(g)\r\nthe prevention, investiga","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-006","EXTRACTION_ID":"EXT-000016","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_14/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"The controller","LEGAL_ACTION_LUNA":"provide information or material","ACTION_OBJECT_LUNA":"1 and 2:","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The controller shall provide the information referred to in paragraphs 1 and 2:","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 14]\r\nArticle 14\r\nInformation to be provided where personal data have not been obtained from the data subject\r\n1. Where personal data have not been obtained from the data subject, the controller shall provide the data subject with the following information:\r\n(a)\r\nthe identity and the contact details of the controller and, where applicable, of the controller\u0027s representative;\r\n(b)\r\nthe contact details of the data protection officer, where applicable;\r\n(c)\r\nthe purposes of the processing for which the personal data are intended as well as the legal basis for the processing;\r\n(d)\r\nthe categories of personal data concerned;\r\n(e)\r\nthe recipients or categories of recipients of the personal data, if any;\r\n(f)\r\nwhere applicable, that the controller intends to transfer personal data to a recipient in a third country or international organisation and the existence or absence of an adequacy decision by the Commission, or in the case of transfers referred to in Article 46 or 47, or the second subparagraph of Article 49(1), reference to the appropriate or suitable safeguards and the means to obtain a copy of them or where they have been made available.\r\n2. In addition to the information referred to in paragraph 1, the controller shall provide the data subject with the following information necessary to ensure fair and transparent processing in respect of the data subject:\r\n(a)\r\nthe period for which the personal data will be stored, or if that is not possible, the criteria used to determine that period;\r\n(b)\r\nwhere the processing is based on point (f) of Article 6(1), the legitimate interests pursued by the controller or by a third party;\r\n(c)\r\nthe existence of the right to request from the controller access to and rectification or erasure of personal data or restriction of processing concerning the data subject and to object to processing as well as the right to data portability;\r\n(d)\r\nwhere processing is based on point (a) of Article 6(1) or point (a) of Article 9(2), the existence of the right to withdraw consent at any time, without affecting the lawfulness of processing based on consent before its withdrawal;\r\n(e)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(f)\r\nfrom which source the personal data originate, and if applicable, whether it came from publicly accessible sources;\r\n(g)\r\nthe existence of automated decision-making, including profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful information about the logic involved, as well as the significance and the envisaged consequences of such processing for the data subject.\r\n3. The controller shall provide the information referred to in paragraphs 1 and 2:\r\n(a)\r\nwithin a reasonable period after obtaining the personal data, but at the latest within one month, having regard to the specific circumstances in which the personal data are processed;\r\n(b)\r\nif the personal data are to be used for communication with the data subject, at the latest at the time of the first communication to that data subject; or\r\n(c)\r\nif a disclosure to another recipient is envisaged, at the latest when the personal data are first disclosed.\r\n4. Where the controller intends to further process the personal data for a purpose other than that for which the personal data were obtained, the controller shall provide the data subject prior to that further processing with information on that other purpose and with any relevant further information as referred to in paragraph 2.\r\n5. Paragraphs 1 to 4 shall not apply where and insofar as:\r\n(a)\r\nthe data subject already has the information;\r\n(b)\r\nthe provision of such information proves impossible or would involve a disproportionate effort, in particular for processing for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes, subject to the conditions and safeguards referred to in Article 89(1) or in so far as the obligation referred to in paragraph 1 of this Article is likely to render impossible or seriously impair the achievement of the objectives of that processing. In such cases the controller shall take appropriate measures to protect the data subject\u0027s rights and freedoms and legitimate interests, including making the information publicly available;\r\n(c)\r\nobtaining or disclosure is expressly laid down by Union or Member State law to which the controller is subject and which provides appropriate measures to protect the data subject\u0027s legitimate interests; or\r\n(d)\r\nwhere the personal data must remain confidential subject to an obligation of professional secrecy regulated by Union or Member State law, including a statutory obligation of secrecy.","FULL_SOURCE_CONTEXT_BEFORE":"to withdraw consent at any time, without affecting the lawfulness of processing based on consent before its withdrawal;\r\n(d)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(e)\r\nwhether the provision of personal data is a statutory or contractual requirement, or a requirement necessary to enter into a contract, as well as whether the data subject is obliged to provide the personal data and of the possible consequences of failure to provide such data;\r\n(f)\r\nthe existence of automated decision-making, including profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful information about the logic involved, as well as the significance and the envisaged consequences of such processing for the data subject.\r\n3. Where the controller intends to further process the personal data for a purpose other than that for which the personal data were collected, the controller shall provide the data subject prior to that further processing with information on that other purpose and with any relevant further information as referred to in paragraph 2.\r\n4. Paragraphs 1, 2 and 3 shall not apply where and insofar as the data subject already has the information.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 15]\r\nArticle 15\r\nRight of access by the data subject\r\n1. The data subject shall have the right to obtain from the controller confirmation as to whether or not personal data concerning him or her are being processed, and, where that is the case, access to the personal data and the following information:\r\n(a)\r\nthe purposes of the processing;\r\n(b)\r\nthe categories of personal data concerned;\r\n(c)\r\nthe recipients or categories of recipient to whom the personal data have been or will be disclosed, in particular recipients in third countries or international organisations;\r\n(d)\r\nwhere possible, the envisaged period for which the personal data will be stored, or, if not possible, the criteria used to determine that period;\r\n(e)\r\nthe existence of the right to request from the controller rectification or erasure of personal data or restriction of processing of personal data concerning the data subject or to object to such processing;\r\n(f)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(g)\r\nwhere the personal data are not collected from the data subject, any available information as to their source;\r\n(h)\r\nthe existence of automated decision-making, including profiling","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-007","EXTRACTION_ID":"EXT-000038","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_26/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"the data subject","LEGAL_ACTION_LUNA":"exercise his or her rights under this","ACTION_OBJECT_LUNA":"Regulation in respect of and against each of the controllers.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Irrespective of the terms of the arrangement referred to in paragraph 1, the data subject may exercise his or her rights under this Regulation in respect of and against each of the controllers.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical sonal data must remain confidential subject to an obligation of professional secrecy regulated by Union or Member State law, including a statutory obligation of secrecy.","FULL_SOURCE_CONTEXT_BEFORE":"to withdraw consent at any time, without affecting the lawfulness of processing based on consent before its withdrawal;\r\n(d)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(e)\r\nwhether the provision of personal data is a statutory or contractual requirement, or a requirement necessary to enter into a contract, as well as whether the data subject is obliged to provide the personal data and of the possible consequences of failure to provide such data;\r\n(f)\r\nthe existence of automated decision-making, including profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful information about the logic involved, as well as the significance and the envisaged consequences of such processing for the data subject.\r\n3. Where the controller intends to further process the personal data for a purpose other than that for which the personal data were collected, the controller shall provide the data subject prior to that further processing with information on that other purpose and with any relevant further information as referred to in paragraph 2.\r\n4. Paragraphs 1, 2 and 3 shall not apply where and insofar as the data subject already has the information.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 15]\r\nArticle 15\r\nRight of access by the data subject\r\n1. The data subject shall have the right to obtain from the controller confirmation as to whether or not personal data concerning him or her are being processed, and, where that is the case, access to the personal data and the following information:\r\n(a)\r\nthe purposes of the processing;\r\n(b)\r\nthe categories of personal data concerned;\r\n(c)\r\nthe recipients or categories of recipient to whom the personal data have been or will be disclosed, in particular recipients in third countries or international organisations;\r\n(d)\r\nwhere possible, the envisaged period for which the personal data will be stored, or, if not possible, the criteria used to determine that period;\r\n(e)\r\nthe existence of the right to request from the controller rectification or erasure of personal data or restriction of processing of personal data concerning the data subject or to object to such processing;\r\n(f)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(g)\r\nwhere the personal data are not collected from the data subject, any available information as to their source;\r\n(h)\r\nthe existence of automated decision-making, including profiling","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-009","EXTRACTION_ID":"EXT-000054","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_32/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"the controller and the processor","LEGAL_ACTION_LUNA":"implement appropriate technical and organisational measures to","ACTION_OBJECT_LUNA":"ensure a level of security appropriate to the risk, including inter alia as appropriate:","COUNTERPART_LUNA":"to the risk","RECIPIENT_LUNA":"to the risk","SOURCE_EXCERPT":"Taking into account the state of the art, the costs of implementation and the nature, scope, context and purposes of processing as well as the risk of varying likelihood and severity for the rights and freedoms of natural persons, the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk, including inter alia as appropriate:","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 32]\r\nArticle 32\r\nSecurity of processing\r\n1. Taking into account the state of the art, the costs of implementation and the nature, scope, context and purposes of processing as well as the risk of varying likelihood and severity for the rights and freedoms of natural persons, the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk, including inter alia as appropriate:\r\n(a)\r\nthe pseudonymisation and encryption of personal data;\r\n(b)\r\nthe ability to ensure the ongoing confidentiality, integrity, availability and resilience of processing systems and services;\r\n(c)\r\nthe ability to restore the availability and access to personal data in a timely manner in the event of a physical or technical incident;\r\n(d)\r\na process for regularly testing, assessing and evaluating the effectiveness of technical and organisational measures for ensuring the security of the processing.\r\n2. In assessing the appropriate level of security account shall be taken in particular of the risks that are presented by processing, in particular from accidental or unlawful destruction, loss, alteration, unauthorised disclosure of, or access to personal data transmitted, stored or otherwise processed.\r\n3. Adherence to an approved code of conduct as referred to in Article 40 or an approved certification mechanism as referred to in Article 42 may be used as an element by which to demonstrate compliance with the requirements set out in paragraph 1 of this Article.\r\n4. The controller and processor shall take steps to ensure that any natural person acting under the authority of the controller or the processor who has access to personal data does not process them except on instructions from the controller, unless he or she is required to do so by Union or Member State law.","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 31]\r\nArticle 31\r\nCooperation with the supervisory authority\r\nThe controller and the processor and, where applicable, their representatives, shall cooperate, on request, with the supervisory authority in the performance of its tasks.\r\n[SECTION 2]\r\nSection 2\r\nSecurity of personal data","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 33]\r\nArticle 33\r\nNotification of a personal data breach to the supervisory authority\r\n1. In the case of a personal data breach, the controller shall without undue delay and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent in accordance with Article 55, unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where the notification to the supervisory authority is not made within 72 hours, it shall be accompanied by reasons for the delay.\r\n2. The processor shall notify the controller without undue delay after becoming aware of a personal data breach.\r\n3. The notification referred to in paragraph 1 shall at least:\r\n(a)\r\ndescribe the nature of the personal data breach including where possible, the categories and approximate number of data subjects concerned and the categories and approximate number of personal data records concerned;\r\n(b)\r\ncommunicate the name and contact details of the data protection officer or other contact point where more information can be obtained;\r\n(c)\r\ndescribe the likely consequences of the personal dat","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-010","EXTRACTION_ID":"EXT-000071","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_36/p4","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"consult or hear","ACTION_OBJECT_LUNA":"of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Member States shall consult the supervisory authority during the preparation of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 36]\r\nArticle 36\r\nPrior consultation\r\n1. The controller shall consult the supervisory authority prior to processing where a data protection impact assessment under Article 35 indicates that the processing would result in a high risk in the absence of measures taken by the controller to mitigate the risk.\r\n2. Where the supervisory authority is of the opinion that the intended processing referred to in paragraph 1 would infringe this Regulation, in particular where the controller has insufficiently identified or mitigated the risk, the supervisory authority shall, within period of up to eight weeks of receipt of the request for consultation, provide written advice to the controller and, where applicable to the processor, and may use any of its powers referred to in Article 58. That period may be extended by six weeks, taking into account the complexity of the intended processing. The supervisory authority shall inform the controller and, where applicable, the processor, of any such extension within one month of receipt of the request for consultation together with the reasons for the delay. Those periods may be suspended until the supervisory authority has obtained information it has requested for the purposes of the consultation.\r\n3. When consulting the supervisory authority pursuant to paragraph 1, the controller shall provide the supervisory authority with:\r\n(a)\r\nwhere applicable, the respective responsibilities of the controller, joint controllers and processors involved in the processing, in particular for processing within a group of undertakings;\r\n(b)\r\nthe purposes and means of the intended processing;\r\n(c)\r\nthe measures and safeguards provided to protect the rights and freedoms of data subjects pursuant to this Regulation;\r\n(d)\r\nwhere applicable, the contact details of the data protection officer;\r\n(e)\r\nthe data protection impact assessment provided for in Article 35; and\r\n(f)\r\nany other information requested by the supervisory authority.\r\n4. Member States shall consult the supervisory authority during the preparation of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.\r\n5. Notwithstanding paragraph 1, Member State law may require controllers to consult with, and obtain prior authorisation from, the supervisory authority in relation to processing by a controller for the performance of a task carried out by the controller in the public interest, including processing in relation to social protection and public health.\r\n[SECTION 4]\r\nSection 4\r\nData protection officer","FULL_SOURCE_CONTEXT_BEFORE":"sessing the impact of the processing operations performed by such controllers or processors, in particular for the purposes of a data protection impact assessment.\r\n9. Where appropriate, the controller shall seek the views of data subjects or their representatives on the intended processing, without prejudice to the protection of commercial or public interests or the security of processing operations.\r\n10. Where processing pursuant to point (c) or (e) of Article 6(1) has a legal basis in Union law or in the law of the Member State to which the controller is subject, that law regulates the specific processing operation or set of operations in question, and a data protection impact assessment has already been carried out as part of a general impact assessment in the context of the adoption of that legal basis, paragraphs 1 to 7 shall not apply unless Member States deem it to be necessary to carry out such an assessment prior to processing activities.\r\n11. Where necessary, the controller shall carry out a review to assess if processing is performed in accordance with the data protection impact assessment at least when there is a change of the risk represented by processing operations.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 37]\r\nArticle 37\r\nDesignation of the data protection officer\r\n1. The controller and the processor shall designate a data protection officer in any case where:\r\n(a)\r\nthe processing is carried out by a public authority or body, except for courts acting in their judicial capacity;\r\n(b)\r\nthe core activities of the controller or the processor consist of processing operations which, by virtue of their nature, their scope and/or their purposes, require regular and systematic monitoring of data subjects on a large scale; or\r\n(c)\r\nthe core activities of the controller or the processor consist of processing on a large scale of special categories of data pursuant to Article 9 and personal data relating to criminal convictions and offences referred to in Article 10.\r\n2. A group of undertakings may appoint a single data protection officer provided that a data protection officer is easily accessible from each establishment.\r\n3. Where the controller or the processor is a public authority or body, a single data protection officer may be designated for several such authorities or bodies, taking account of their organisational structure and size.\r\n4. In cases other than those referred to in ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-011","EXTRACTION_ID":"EXT-000002","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_11/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|MEDIUM|NO|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"the controller","LEGAL_ACTION_LUNA":"notify or inform","ACTION_OBJECT_LUNA":", ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 11]\r\nArticle 11\r\nProcessing which does not require identification\r\n1. If the purposes for which a controller processes personal data do not or do no longer require the identification of a data subject by the controller, the controller shall not be obliged to maintain, acquire or process additional information in order to identify the data subject for the sole purpose of complying with this Regulation.\r\n2. Where, in cases referred to in paragraph 1 of this Article, the controller is able to demonstrate that it is not in a position to identify the data subject, the controller shall inform the data subject accordingly, if possible. In such cases, Articles 15 to 20 shall not apply except where the data subject, for the purpose of exercising his or her rights under those articles, provides additional information enabling his or her identification.\r\n[CHAPTER III]\r\nCHAPTER III\r\nRights of the data subject\r\n[SECTION 1]\r\nSection 1\r\nTransparency and modalities","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 10]\r\nArticle 10\r\nProcessing of personal data relating to criminal convictions and offences\r\nProcessing of personal data relating to criminal convictions and offences or related security measures based on Article 6(1) shall be carried out only under the control of official authority or when the processing is authorised by Union or Member State law providing for appropriate safeguards for the rights and freedoms of data subjects. Any comprehensive register of criminal convictions shall be kept only under the control of official authority.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 12]\r\nArticle 12\r\nTransparent information, communication and modalities for the exercise of the rights of the data subject\r\n1. The controller shall take appropriate measures to provide any information referred to in Articles 13 and 14 and any communication under Articles 15 to 22 and 34 relating to processing to the data subject in a concise, transparent, intelligible and easily accessible form, using clear and plain language, in particular for any information addressed specifically to a child. The information shall be provided in writing, or by other means, including, where appropriate, by electronic means. When requested by the data subject, the information may be provided orally, provided that the identity of the data subject is proven by other means.\r\n2. The controller shall facilitate the exercise of data subject rights under Articles 15 to 22. In the cases referred to in Article 11(2), the controller shall not refuse to act on the request of the data subject for exercising his or her rights under Articles 15 to 22, unless the controller demonstrates that it is not in a position to identify the data subject.\r\n3. The controller shall provide information on action taken ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-012","EXTRACTION_ID":"EXT-000035","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_23/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|MEDIUM|NO|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"Member State law to which the data controller or processor is subject","LEGAL_ACTION_LUNA":"restrict by way of a legislative measure","ACTION_OBJECT_LUNA":"the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34, as well as Article 5 in so far as its provisions correspond to the rights and obligationsâ€¦","COUNTERPART_LUNA":"to the rights and obligations provided for in Articles 12 to 22","RECIPIENT_LUNA":"to the rights and obligations provided for in Articles 12 to 22","SOURCE_EXCERPT":"Union or Member State law to which the data controller or processor is subject may restrict by way of a legislative measure the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34, as well as Article 5 in so far as its provisions correspond to the rights and obligations provided for in Articles 12 to 22, when such a restriction respects the essence of the fundamental rights and freedoms and is a necessary and proportionate measure in a democratic society to safegâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 23]\r\nArticle 23\r\nRestrictions\r\n1. Union or Member State law to which the data controller or processor is subject may restrict by way of a legislative measure the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34, as well as Article 5 in so far as its provisions correspond to the rights and obligations provided for in Articles 12 to 22, when such a restriction respects the essence of the fundamental rights and freedoms and is a necessary and proportionate measure in a democratic society to safeguard:\r\n(a)\r\nnational security;\r\n(b)\r\ndefence;\r\n(c)\r\npublic security;\r\n(d)\r\nthe prevention, investigation, detection or prosecution of criminal offences or the execution of criminal penalties, including the safeguarding against and the prevention of threats to public security;\r\n(e)\r\nother important objectives of general public interest of the Union or of a Member State, in particular an important economic or financial interest of the Union or of a Member State, including monetary, budgetary and taxation a matters, public health and social security;\r\n(f)\r\nthe protection of judicial independence and judicial proceedings;\r\n(g)\r\nthe prevention, investigation, detection and prosecution of breaches of ethics for regulated professions;\r\n(h)\r\na monitoring, inspection or regulatory function connected, even occasionally, to the exercise of official authority in the cases referred to in points (a) to (e) and (g);\r\n(i)\r\nthe protection of the data subject or the rights and freedoms of others;\r\n(j)\r\nthe enforcement of civil law claims.\r\n2. In particular, any legislative measure referred to in paragraph 1 shall contain specific provisions at least, where relevant, as to:\r\n(a)\r\nthe purposes of the processing or categories of processing;\r\n(b)\r\nthe categories of personal data;\r\n(c)\r\nthe scope of the restrictions introduced;\r\n(d)\r\nthe safeguards to prevent abuse or unlawful access or transfer;\r\n(e)\r\nthe specification of the controller or categories of controllers;\r\n(f)\r\nthe storage periods and the applicable safeguards taking into account the nature, scope and purposes of the processing or categories of processing;\r\n(g)\r\nthe risks to the rights and freedoms of data subjects; and\r\n(h)\r\nthe right of data subjects to be informed about the restriction, unless that may be prejudicial to the purpose of the restriction.\r\n[CHAPTER IV]\r\nCHAPTER IV\r\nController and processor\r\n[SECTION 1]\r\nSection 1\r\nGeneral obligations","FULL_SOURCE_CONTEXT_BEFORE":"ing, which produces legal effects concerning him or her or similarly significantly affects him or her.\r\n2. Paragraph 1 shall not apply if the decision:\r\n(a)\r\nis necessary for entering into, or performance of, a contract between the data subject and a data controller;\r\n(b)\r\nis authorised by Union or Member State law to which the controller is subject and which also lays down suitable measures to safeguard the data subject\u0027s rights and freedoms and legitimate interests; or\r\n(c)\r\nis based on the data subject\u0027s explicit consent.\r\n3. In the cases referred to in points (a) and (c) of paragraph 2, the data controller shall implement suitable measures to safeguard the data subject\u0027s rights and freedoms and legitimate interests, at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision.\r\n4. Decisions referred to in paragraph 2 shall not be based on special categories of personal data referred to in Article 9(1), unless point (a) or (g) of Article 9(2) applies and suitable measures to safeguard the data subject\u0027s rights and freedoms and legitimate interests are in place.\r\n[SECTION 5]\r\nSection 5\r\nRestrictions","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 24]\r\nArticle 24\r\nResponsibility of the controller\r\n1. Taking into account the nature, scope, context and purposes of processing as well as the risks of varying likelihood and severity for the rights and freedoms of natural persons, the controller shall implement appropriate technical and organisational measures to ensure and to be able to demonstrate that processing is performed in accordance with this Regulation. Those measures shall be reviewed and updated where necessary.\r\n2. Where proportionate in relation to processing activities, the measures referred to in paragraph 1 shall include the implementation of appropriate data protection policies by the controller.\r\n3. Adherence to approved codes of conduct as referred to in Article 40 or approved certification mechanisms as referred to in Article 42 may be used as an element by which to demonstrate compliance with the obligations of the controller.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-013","EXTRACTION_ID":"EXT-000050","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_28/p4","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|MEDIUM|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"the initial processor","LEGAL_ACTION_LUNA":"remain fully liable to the controller for","ACTION_OBJECT_LUNA":"the performance of that other processor\u0027s obligations.","COUNTERPART_LUNA":"to the controller for the performance of that other processor\u0027s obligations","RECIPIENT_LUNA":"to the controller for the performance of that other processor\u0027s obligations","SOURCE_EXCERPT":"","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 28]\r\nArticle 28\r\nProcessor\r\n1. Where processing is to be carried out on behalf of a controller, the controller shall use only processors providing sufficient guarantees to implement appropriate technical and organisational measures in such a manner that processing will meet the requirements of this Regulation and ensure the protection of the rights of the data subject.\r\n2. The processor shall not engage another processor without prior specific or general written authorisation of the controller. In the case of general written authorisation, the processor shall inform the controller of any intended changes concerning the addition or replacement of other processors, thereby giving the controller the opportunity to object to such changes.\r\n3. Processing by a processor shall be governed by a contract or other legal act under Union or Member State law, that is binding on the processor with regard to the controller and that sets out the subject-matter and duration of the processing, the nature and purpose of the processing, the type of personal data and categories of data subjects and the obligations and rights of the controller. That contract or other legal act shall stipulate, in particular, that the processor:\r\n(a)\r\nprocesses the personal data only on documented instructions from the controller, including with regard to transfers of personal data to a third country or an international organisation, unless required to do so by Union or Member State law to which the processor is subject; in such a case, the processor shall inform the controller of that legal requirement before processing, unless that law prohibits such information on important grounds of public interest;\r\n(b)\r\nensures that persons authorised to process the personal data have committed themselves to confidentiality or are under an appropriate statutory obligation of confidentiality;\r\n(c)\r\ntakes all measures required pursuant to Article 32;\r\n(d)\r\nrespects the conditions referred to in paragraphs 2 and 4 for engaging another processor;\r\n(e)\r\ntaking into account the nature of the processing, assists the controller by appropriate technical and organisational measures, insofar as this is possible, for the fulfilment of the controller\u0027s obligation to respond to requests for exercising the data subject\u0027s rights laid down in Chapter III;\r\n(f)\r\nassists the controller in ensuring compliance with the obligations pursuant to Articles 32 to 36 taking into account the nature of processing and the information available to the processor;\r\n(g)\r\nat the choice of the controller, deletes or returns all the personal data to the controller after the end of the provision of services relating to processing, and deletes existing copies unless Union or Member State law requires storage of the personal data;\r\n(h)\r\nmakes available to the controller all information necessary to demonstrate compliance with the obligations laid down in this Article and allow for and contribute to audits, including inspections, conducted by the controller or another auditor mandated by the controller.\r\nWith regard to point (h) of the first subparagraph, the processor shall immediately inform the controller if, in its opinion, an instruction infringes this Regulation or other Union or Member State data protection provisions.\r\n4. Where a processor engages another processor for carrying out specific processing activities on behalf of the controller, the same data protection obligations as set out in the contract or other legal act between the controller and the processor as referred to in paragraph 3 shall be imposed on that other processor by way of a contract or other legal act under Union or Member State law, in particular providing sufficient guarantees to implement appropriate technical and organisational measures in such a manner that the processing will meet the requirements of this Regulation. Where that other processor fails to fulfil its data protection obligations, the initial processor shall remain fully liable to the controller for the performance of that other processor\u0027s obligations.\r\n5. Adherence of a processor to an approved code of conduct as referred to in Article 40 or an approved certification mechanism as referred to in Article 42 may be used as an element by which to demonstrate sufficient guarantees as referred to in paragraphs 1 and 4 of this Article.\r\n6. Without prejudice to an individual contract between the controller and the processor, the contract or the other legal act referred to in paragraphs 3 and 4 of this Article may be based, in whole or in part, on standard contractual clauses referred to in paragraphs 7 and 8 of this Article, including when they are part of a certification granted to the controller or processor pursuant to Articles 42 and 43.\r\n7. The Commission may lay down standard contractual clauses for the matters referred to in paragraph 3 and 4 of this Article and in accordance with the examination procedure referred to in Article 93(2).\r\n8. A supervisory authority may adopt standard contractual clauses for the matters referred to in paragraph 3 and 4 of this Article and in accordance with the consistency mechanism referred to in Article 63.\r\n9. The contract or the other legal act referred to in paragraphs 3 and 4 shall be in writing, including in electronic form.\r\n10. Without prejudice to Articles 82, 83 and 84, if a processor infringes this Regulation by determining the purposes and means of processing, the processor shall be considered to be a controller in respect of that processing.","FULL_SOURCE_CONTEXT_BEFORE":"le shall not apply to:\r\n(a)\r\nprocessing which is occasional, does not include, on a large scale, processing of special categories of data as referred to in Article 9(1) or processing of personal data relating to criminal convictions and offences referred to in Article 10, and is unlikely to result in a risk to the rights and freedoms of natural persons, taking into account the nature, context, scope and purposes of the processing; or\r\n(b)\r\na public authority or body.\r\n3. The representative shall be established in one of the Member States where the data subjects, whose personal data are processed in relation to the offering of goods or services to them, or whose behaviour is monitored, are.\r\n4. The representative shall be mandated by the controller or processor to be addressed in addition to or instead of the controller or the processor by, in particular, supervisory authorities and data subjects, on all issues related to processing, for the purposes of ensuring compliance with this Regulation.\r\n5. The designation of a representative by the controller or processor shall be without prejudice to legal actions which could be initiated against the controller or the processor themselves.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 29]\r\nArticle 29\r\nProcessing under the authority of the controller or processor\r\nThe processor and any person acting under the authority of the controller or of the processor, who has access to personal data, shall not process those data except on instructions from the controller, unless required to do so by Union or Member State law.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-014","EXTRACTION_ID":"EXT-000151","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_6/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|MEDIUM|NO|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"maintain, store or record","ACTION_OBJECT_LUNA":"adapt the application of the rules of this Regulation with regard to processing for compliance with points (c) and (e) of paragraph 1 by determining more precisely specific requireâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Member States may maintain or introduce more specific provisions to adapt the application of the rules of this Regulation with regard to processing for compliance with points (c) and (e) of paragraph 1 by determining more precisely specific requirements for the processing and other measures to ensure lawful and fair processing including for other specific processing situations as provided for in Chapter IX.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 6]\r\nArticle 6\r\nLawfulness of processing\r\n1. Processing shall be lawful only if and to the extent that at least one of the following applies:\r\n(a)\r\nthe data subject has given consent to the processing of his or her personal data for one or more specific purposes;\r\n(b)\r\nprocessing is necessary for the performance of a contract to which the data subject is party or in order to take steps at the request of the data subject prior to entering into a contract;\r\n(c)\r\nprocessing is necessary for compliance with a legal obligation to which the controller is subject;\r\n(d)\r\nprocessing is necessary in order to protect the vital interests of the data subject or of another natural person;\r\n(e)\r\nprocessing is necessary for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller;\r\n(f)\r\nprocessing is necessary for the purposes of the legitimate interests pursued by the controller or by a third party, except where such interests are overridden by the interests or fundamental rights and freedoms of the data subject which require protection of personal data, in particular where the data subject is a child.\r\nPoint (f) of the first subparagraph shall not apply to processing carried out by public authorities in the performance of their tasks.\r\n2. Member States may maintain or introduce more specific provisions to adapt the application of the rules of this Regulation with regard to processing for compliance with points (c) and (e) of paragraph 1 by determining more precisely specific requirements for the processing and other measures to ensure lawful and fair processing including for other specific processing situations as provided for in Chapter IX.\r\n3. The basis for the processing referred to in point (c) and (e) of paragraph 1 shall be laid down by:\r\n(a)\r\nUnion law; or\r\n(b)\r\nMember State law to which the controller is subject.\r\nThe purpose of the processing shall be determined in that legal basis or, as regards the processing referred to in point (e) of paragraph 1, shall be necessary for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller. That legal basis may contain specific provisions to adapt the application of rules of this Regulation, inter alia: the general conditions governing the lawfulness of processing by the controller; the types of data which are subject to the processing; the data subjects concerned; the entities to, and the purposes for which, the personal data may be disclosed; the purpose limitation; storage periods; and processing operations and processing procedures, including measures to ensure lawful and fair processing such as those for other specific processing situations as provided for in Chapter IX. The Union or the Member State law shall meet an objective of public interest and be proportionate to the legitimate aim pursued.\r\n4. Where the processing for a purpose other than that for which the personal data have been collected is not based on the data subject\u0027s consent or on a Union or Member State law which constitutes a necessary and proportionate measure in a democratic society to safeguard the objectives referred to in Article 23(1), the controller shall, in order to ascertain whether processing for another purpose is compatible with the purpose for which the personal data are initially collected, take into account, inter alia:\r\n(a)\r\nany link between the purposes for which the personal data have been collected and the purposes of the intended further processing;\r\n(b)\r\nthe context in which the personal data have been collected, in particular regarding the relationship between data subjects and the controller;\r\n(c)\r\nthe nature of the personal data, in particular whether special categories of personal data are processed, pursuant to Article 9, or whether personal data related to criminal convictions and offences are processed, pursuant to Article 10;\r\n(d)\r\nthe possible consequences of the intended further processing for data subjects;\r\n(e)\r\nthe existence of appropriate safeguards, which may include encryption or pseudonymisation.","FULL_SOURCE_CONTEXT_BEFORE":"en to ensure that personal data that are inaccurate, having regard to the purposes for which they are processed, are erased or rectified without delay (â€˜accuracyâ€™);\r\n(e)\r\nkept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed; personal data may be stored for longer periods insofar as the personal data will be processed solely for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes in accordance with Article 89(1) subject to implementation of the appropriate technical and organisational measures required by this Regulation in order to safeguard the rights and freedoms of the data subject (â€˜storage limitationâ€™);\r\n(f)\r\nprocessed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing and against accidental loss, destruction or damage, using appropriate technical or organisational measures (â€˜integrity and confidentialityâ€™).\r\n2. The controller shall be responsible for, and be able to demonstrate compliance with, paragraph 1 (â€˜accountabilityâ€™).","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 7]\r\nArticle 7\r\nConditions for consent\r\n1. Where processing is based on consent, the controller shall be able to demonstrate that the data subject has consented to processing of his or her personal data.\r\n2. If the data subject\u0027s consent is given in the context of a written declaration which also concerns other matters, the request for consent shall be presented in a manner which is clearly distinguishable from the other matters, in an intelligible and easily accessible form, using clear and plain language. Any part of such a declaration which constitutes an infringement of this Regulation shall not be binding.\r\n3. The data subject shall have the right to withdraw his or her consent at any time. The withdrawal of consent shall not affect the lawfulness of processing based on consent before its withdrawal. Prior to giving consent, the data subject shall be informed thereof. It shall be as easy to withdraw as to give consent.\r\n4. When assessing whether consent is freely given, utmost account shall be taken of whether, inter alia, the performance of a contract, including the provision of a service, is conditional on consent to the processing of personal data that is not necess","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-015","EXTRACTION_ID":"EXT-000003","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_12/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"The controller","LEGAL_ACTION_LUNA":"take appropriate measures to provide any information","ACTION_OBJECT_LUNA":"referred to in Articles 13 and 14 and any communication under Articles 15 to 22 and 34 relating to processing to the data subject in a concise, transparent, intelligible and easilyâ€¦","COUNTERPART_LUNA":"to the data subject in a concise","RECIPIENT_LUNA":"to the data subject in a concise","SOURCE_EXCERPT":"The controller shall take appropriate measures to provide any information referred to in Articles 13 and 14 and any communication under Articles 15 to 22 and 34 relating to processing to the data subject in a concise, transparent, intelligible and easily accessible form, using clear and plain language, in particular for any information addressed specifically to a child. The information shall be provided in writing, or by other means, including, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 12]\r\nArticle 12\r\nTransparent information, communication and modalities for the exercise of the rights of the data subject\r\n1. The controller shall take appropriate measures to provide any information referred to in Articles 13 and 14 and any communication under Articles 15 to 22 and 34 relating to processing to the data subject in a concise, transparent, intelligible and easily accessible form, using clear and plain language, in particular for any information addressed specifically to a child. The information shall be provided in writing, or by other means, including, where appropriate, by electronic means. When requested by the data subject, the information may be provided orally, provided that the identity of the data subject is proven by other means.\r\n2. The controller shall facilitate the exercise of data subject rights under Articles 15 to 22. In the cases referred to in Article 11(2), the controller shall not refuse to act on the request of the data subject for exercising his or her rights under Articles 15 to 22, unless the controller demonstrates that it is not in a position to identify the data subject.\r\n3. The controller shall provide information on action taken on a request under Articles 15 to 22 to the data subject without undue delay and in any event within one month of receipt of the request. That period may be extended by two further months where necessary, taking into account the complexity and number of the requests. The controller shall inform the data subject of any such extension within one month of receipt of the request, together with the reasons for the delay. Where the data subject makes the request by electronic form means, the information shall be provided by electronic means where possible, unless otherwise requested by the data subject.\r\n4. If the controller does not take action on the request of the data subject, the controller shall inform the data subject without delay and at the latest within one month of receipt of the request of the reasons for not taking action and on the possibility of lodging a complaint with a supervisory authority and seeking a judicial remedy.\r\n5. Information provided under Articles 13 and 14 and any communication and any actions taken under Articles 15 to 22 and 34 shall be provided free of charge. Where requests from a data subject are manifestly unfounded or excessive, in particular because of their repetitive character, the controller may either:\r\n(a)\r\ncharge a reasonable fee taking into account the administrative costs of providing the information or communication or taking the action requested; or\r\n(b)\r\nrefuse to act on the request.\r\nThe controller shall bear the burden of demonstrating the manifestly unfounded or excessive character of the request.\r\n6. Without prejudice to Article 11, where the controller has reasonable doubts concerning the identity of the natural person making the request referred to in Articles 15 to 21, the controller may request the provision of additional information necessary to confirm the identity of the data subject.\r\n7. The information to be provided to data subjects pursuant to Articles 13 and 14 may be provided in combination with standardised icons in order to give in an easily visible, intelligible and clearly legible manner a meaningful overview of the intended processing. Where the icons are presented electronically they shall be machine-readable.\r\n8. The Commission shall be empowered to adopt delegated acts in accordance with Article 92 for the purpose of determining the information to be presented by the icons and the procedures for providing standardised icons.\r\n[SECTION 2]\r\nSection 2\r\nInformation and access to personal data","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 11]\r\nArticle 11\r\nProcessing which does not require identification\r\n1. If the purposes for which a controller processes personal data do not or do no longer require the identification of a data subject by the controller, the controller shall not be obliged to maintain, acquire or process additional information in order to identify the data subject for the sole purpose of complying with this Regulation.\r\n2. Where, in cases referred to in paragraph 1 of this Article, the controller is able to demonstrate that it is not in a position to identify the data subject, the controller shall inform the data subject accordingly, if possible. In such cases, Articles 15 to 20 shall not apply except where the data subject, for the purpose of exercising his or her rights under those articles, provides additional information enabling his or her identification.\r\n[CHAPTER III]\r\nCHAPTER III\r\nRights of the data subject\r\n[SECTION 1]\r\nSection 1\r\nTransparency and modalities","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 13]\r\nArticle 13\r\nInformation to be provided where personal data are collected from the data subject\r\n1. Where personal data relating to a data subject are collected from the data subject, the controller shall, at the time when personal data are obtained, provide the data subject with all of the following information:\r\n(a)\r\nthe identity and the contact details of the controller and, where applicable, of the controller\u0027s representative;\r\n(b)\r\nthe contact details of the data protection officer, where applicable;\r\n(c)\r\nthe purposes of the processing for which the personal data are intended as well as the legal basis for the processing;\r\n(d)\r\nwhere the processing is based on point (f) of Article 6(1), the legitimate interests pursued by the controller or by a third party;\r\n(e)\r\nthe recipients or categories of recipients of the personal data, if any;\r\n(f)\r\nwhere applicable, the fact that the controller intends to transfer personal data to a third country or international organisation and the existence or absence of an adequacy decision by the Commission, or in the case of transfers referred to in Article 46 or 47, or the second subparagraph of Article 49(1), reference to the app","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-016","EXTRACTION_ID":"EXT-000021","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_15/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"the controller","LEGAL_ACTION_LUNA":"charge a reasonable fee based on administrative","ACTION_OBJECT_LUNA":"costs. ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The controller shall provide a copy of the personal data undergoing processing. For any further copies requested by the data subject, the controller may charge a reasonable fee based on administrative costs. ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_SCOPE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 15]\r\nArticle 15\r\nRight of access by the data subject\r\n1. The data subject shall have the right to obtain from the controller confirmation as to whether or not personal data concerning him or her are being processed, and, where that is the case, access to the personal data and the following information:\r\n(a)\r\nthe purposes of the processing;\r\n(b)\r\nthe categories of personal data concerned;\r\n(c)\r\nthe recipients or categories of recipient to whom the personal data have been or will be disclosed, in particular recipients in third countries or international organisations;\r\n(d)\r\nwhere possible, the envisaged period for which the personal data will be stored, or, if not possible, the criteria used to determine that period;\r\n(e)\r\nthe existence of the right to request from the controller rectification or erasure of personal data or restriction of processing of personal data concerning the data subject or to object to such processing;\r\n(f)\r\nthe right to lodge a complaint with a supervisory authority;\r\n(g)\r\nwhere the personal data are not collected from the data subject, any available information as to their source;\r\n(h)\r\nthe existence of automated decision-making, including profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful information about the logic involved, as well as the significance and the envisaged consequences of such processing for the data subject.\r\n2. Where personal data are transferred to a third country or to an international organisation, the data subject shall have the right to be informed of the appropriate safeguards pursuant to Article 46 relating to the transfer.\r\n3. The controller shall provide a copy of the personal data undergoing processing. For any further copies requested by the data subject, the controller may charge a reasonable fee based on administrative costs. Where the data subject makes the request by electronic means, and unless otherwise requested by the data subject, the information shall be provided in a commonly used electronic form.\r\n4. The right to obtain a copy referred to in paragraph 3 shall not adversely affect the rights and freedoms of others.\r\n[SECTION 3]\r\nSection 3\r\nRectification and erasure","FULL_SOURCE_CONTEXT_BEFORE":"2.\r\n5. Paragraphs 1 to 4 shall not apply where and insofar as:\r\n(a)\r\nthe data subject already has the information;\r\n(b)\r\nthe provision of such information proves impossible or would involve a disproportionate effort, in particular for processing for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes, subject to the conditions and safeguards referred to in Article 89(1) or in so far as the obligation referred to in paragraph 1 of this Article is likely to render impossible or seriously impair the achievement of the objectives of that processing. In such cases the controller shall take appropriate measures to protect the data subject\u0027s rights and freedoms and legitimate interests, including making the information publicly available;\r\n(c)\r\nobtaining or disclosure is expressly laid down by Union or Member State law to which the controller is subject and which provides appropriate measures to protect the data subject\u0027s legitimate interests; or\r\n(d)\r\nwhere the personal data must remain confidential subject to an obligation of professional secrecy regulated by Union or Member State law, including a statutory obligation of secrecy.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 16]\r\nArticle 16\r\nRight to rectification\r\nThe data subject shall have the right to obtain from the controller without undue delay the rectification of inaccurate personal data concerning him or her. Taking into account the purposes of the processing, the data subject shall have the right to have incomplete personal data completed, including by means of providing a supplementary statement.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-017","EXTRACTION_ID":"EXT-000023","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_17/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"a concerning him or her without undue delay and the controller","LEGAL_ACTION_LUNA":"have the obligation to erase personal data","ACTION_OBJECT_LUNA":"without undue delay ","COUNTERPART_LUNA":"from the controller the erasure of personal data concerning him or her without undue delay and the controlle","RECIPIENT_LUNA":"from the controller the erasure of personal data concerning him or her without undue delay and the controlle","SOURCE_EXCERPT":"The data subject shall have the right to obtain from the controller the erasure of personal data concerning him or her without undue delay and the controller shall have the obligation to erase personal data without undue delay ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 17]\r\nArticle 17\r\nRight to erasure (â€˜right to be forgottenâ€™)\r\n1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning him or her without undue delay and the controller shall have the obligation to erase personal data without undue delay where one of the following grounds applies:\r\n(a)\r\nthe personal data are no longer necessary in relation to the purposes for which they were collected or otherwise processed;\r\n(b)\r\nthe data subject withdraws consent on which the processing is based according to point (a) of Article 6(1), or point (a) of Article 9(2), and where there is no other legal ground for the processing;\r\n(c)\r\nthe data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);\r\n(d)\r\nthe personal data have been unlawfully processed;\r\n(e)\r\nthe personal data have to be erased for compliance with a legal obligation in Union or Member State law to which the controller is subject;\r\n(f)\r\nthe personal data have been collected in relation to the offer of information society services referred to in Article 8(1).\r\n2. Where the controller has made the personal data public and is obliged pursuant to paragraph 1 to erase the personal data, the controller, taking account of available technology and the cost of implementation, shall take reasonable steps, including technical measures, to inform controllers which are processing the personal data that the data subject has requested the erasure by such controllers of any links to, or copy or replication of, those personal data.\r\n3. Paragraphs 1 and 2 shall not apply to the extent that processing is necessary:\r\n(a)\r\nfor exercising the right of freedom of expression and information;\r\n(b)\r\nfor compliance with a legal obligation which requires processing by Union or Member State law to which the controller is subject or for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller;\r\n(c)\r\nfor reasons of public interest in the area of public health in accordance with points (h) and (i) of Article 9(2) as well as Article 9(3);\r\n(d)\r\nfor archiving purposes in the public interest, scientific or historical research purposes or statistical purposes in accordance with Article 89(1) in so far as the right referred to in paragraph 1 is likely to render impossible or seriously impair the achievement of the objectives of that processing; or\r\n(e)\r\nfor the establishment, exercise or defence of legal claims.","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 16]\r\nArticle 16\r\nRight to rectification\r\nThe data subject shall have the right to obtain from the controller without undue delay the rectification of inaccurate personal data concerning him or her. Taking into account the purposes of the processing, the data subject shall have the right to have incomplete personal data completed, including by means of providing a supplementary statement.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 18]\r\nArticle 18\r\nRight to restriction of processing\r\n1. The data subject shall have the right to obtain from the controller restriction of processing where one of the following applies:\r\n(a)\r\nthe accuracy of the personal data is contested by the data subject, for a period enabling the controller to verify the accuracy of the personal data;\r\n(b)\r\nthe processing is unlawful and the data subject opposes the erasure of the personal data and requests the restriction of their use instead;\r\n(c)\r\nthe controller no longer needs the personal data for the purposes of the processing, but they are required by the data subject for the establishment, exercise or defence of legal claims;\r\n(d)\r\nthe data subject has objected to processing pursuant to Article 21(1) pending the verification whether the legitimate grounds of the controller override those of the data subject.\r\n2. Where processing has been restricted under paragraph 1, such personal data shall, with the exception of storage, only be processed with the data subject\u0027s consent or for the establishment, exercise or defence of legal claims or for the protection of the rights of another natural or legal person or for reasons of import","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-018","EXTRACTION_ID":"EXT-000024","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_17/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"The data subject shall","LEGAL_ACTION_LUNA":"obtain from the controller the erasure of","ACTION_OBJECT_LUNA":"personal data concerning him or her without undue delay and the controller shall have the obligation to erase personal data without undue delay ","COUNTERPART_LUNA":"from the controller the erasure of personal data concerning him or her without undue delay and the controlle","RECIPIENT_LUNA":"from the controller the erasure of personal data concerning him or her without undue delay and the controlle","SOURCE_EXCERPT":"The data subject shall have the right to obtain from the controller the erasure of personal data concerning him or her without undue delay and the controller shall have the obligation to erase personal data without undue delay ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 17]\r\nArticle 17\r\nRight to erasure (â€˜right to be forgottenâ€™)\r\n1. The data subject shall have the right to obtain from the controller the erasure of personal data concerning him or her without undue delay and the controller shall have the obligation to erase personal data without undue delay where one of the following grounds applies:\r\n(a)\r\nthe personal data are no longer necessary in relation to the purposes for which they were collected or otherwise processed;\r\n(b)\r\nthe data subject withdraws consent on which the processing is based according to point (a) of Article 6(1), or point (a)
