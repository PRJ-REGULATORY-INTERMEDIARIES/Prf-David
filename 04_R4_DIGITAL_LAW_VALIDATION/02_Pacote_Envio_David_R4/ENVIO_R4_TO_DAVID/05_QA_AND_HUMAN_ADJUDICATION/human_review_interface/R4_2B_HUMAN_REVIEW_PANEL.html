ss that exist, and a description of the territorial scope of the order, in accordance with paragraph 2.\r\n6. The conditions and requirements laid down in this Article shall be without prejudice to national civil and criminal procedural law.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 11]\r\nArticle 11\r\nPoints of contact for Member Statesâ€™ authorities, the Commission and the Board\r\n1. Providers of intermediary services shall designate a single point of contact to enable them to communicate directly, by electronic means, with Member Statesâ€™ authorities, the Commission and the Board referred to in Article 61 for the application of this Regulation.\r\n2. Providers of intermediary services shall make public the information necessary to easily identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.\r\n3. Providers of intermediary services shall specify in the information referred to in paragraph 2 the official language or languages of the Member States which, in addition to a language broadly understood by the largest possible number of Union citizens, can be used to communicate with their points of contact, and which shall include at least one of the official languages of the Member State in which the provider of intermediary services has its main establishment or where its legal representative resides or is established.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-047","EXTRACTION_ID":"EXT-000490","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_11/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"Providers of intermediary services","LEGAL_ACTION_LUNA":"make public the information necessary to easily","ACTION_OBJECT_LUNA":"identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Providers of intermediary services shall make public the information necessary to easily identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 11]\r\nArticle 11\r\nPoints of contact for Member Statesâ€™ authorities, the Commission and the Board\r\n1. Providers of intermediary services shall designate a single point of contact to enable them to communicate directly, by electronic means, with Member Statesâ€™ authorities, the Commission and the Board referred to in Article 61 for the application of this Regulation.\r\n2. Providers of intermediary services shall make public the information necessary to easily identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.\r\n3. Providers of intermediary services shall specify in the information referred to in paragraph 2 the official language or languages of the Member States which, in addition to a language broadly understood by the largest possible number of Union citizens, can be used to communicate with their points of contact, and which shall include at least one of the official languages of the Member State in which the provider of intermediary services has its main establishment or where its legal representative resides or is established.","FULL_SOURCE_CONTEXT_BEFORE":" order to the Digital Services Coordinator from the Member State of the issuing authority.\r\n4. After receiving the order from the judicial or administrative authority, the Digital Services Coordinator of the Member State concerned shall, without undue delay, transmit a copy of the order referred to in paragraph 1 of this Article to all Digital Services Coordinators through the system established in accordance with Article 85.\r\n5. At the latest when effect is given to the order, or, where applicable, at the time provided by the issuing authority in its order, providers of intermediary services shall inform the recipient of the service concerned of the order received and the effect given to it. Such information provided to the recipient of the service shall include a statement of reasons and the possibilities for redress that exist, in accordance with paragraph 2.\r\n6. The conditions and requirements laid down in this Article shall be without prejudice to national civil and criminal procedural law.\r\n[CHAPTER III]\r\nCHAPTER III\r\nDUE DILIGENCE OBLIGATIONS FOR A TRANSPARENT AND SAFE ONLINE ENVIRONMENT\r\n[SECTION 1]\r\nSECTION 1\r\nProvisions applicable to all providers of intermediary services","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 12]\r\nArticle 12\r\nPoints of contact for recipients of the service\r\n1. Providers of intermediary services shall designate a single point of contact to enable recipients of the service to communicate directly and rapidly with them, by electronic means and in a user-friendly manner, including by allowing recipients of the service to choose the means of communication, which shall not solely rely on automated tools.\r\n2. In addition to the obligations provided under Directive 2000/31/EC, providers of intermediary services shall make public the information necessary for the recipients of the service in order to easily identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-048","EXTRACTION_ID":"EXT-000499","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_14/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"the provider of that intermediary service","LEGAL_ACTION_LUNA":"explain the conditions for","ACTION_OBJECT_LUNA":", and any restrictions on, the use of the service in a way that minors can understand.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_SCOPE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 14]\r\nArticle 14\r\nTerms and conditions\r\n1. Providers of intermediary services shall include information on any restrictions that they impose in relation to the use of their service in respect of information provided by the recipients of the service, in their terms and conditions. That information shall include information on any policies, procedures, measures and tools used for the purpose of content moderation, including algorithmic decision-making and human review, as well as the rules of procedure of their internal complaint handling system. It shall be set out in clear, plain, intelligible, user-friendly and unambiguous language, and shall be publicly available in an easily accessible and machine-readable format.\r\n2. Providers of intermediary services shall inform the recipients of the service of any significant change to the terms and conditions.\r\n3. Where an intermediary service is primarily directed at minors or is predominantly used by them, the provider of that intermediary service shall explain the conditions for, and any restrictions on, the use of the service in a way that minors can understand.\r\n4. Providers of intermediary services shall act in a diligent, objective and proportionate manner in applying and enforcing the restrictions referred to in paragraph 1, with due regard to the rights and legitimate interests of all parties involved, including the fundamental rights of the recipients of the service, such as the freedom of expression, freedom and pluralism of the media, and other fundamental rights and freedoms as enshrined in the Charter.\r\n5. Providers of very large online platforms and of very large online search engines shall provide recipients of services with a concise, easily-accessible and machine-readable summary of the terms and conditions, including the available remedies and redress mechanisms, in clear and unambiguous language.\r\n6. Very large online platforms and very large online search engines within the meaning of Article 33 shall publish their terms and conditions in the official languages of all the Member States in which they offer their services.","FULL_SOURCE_CONTEXT_BEFORE":"e Board, on all issues necessary for the receipt of, compliance with and enforcement of decisions issued in relation to this Regulation. Providers of intermediary services shall provide their legal representative with necessary powers and sufficient resources to guarantee their efficient and timely cooperation with the Member Statesâ€™ competent authorities, the Commission and the Board, and to comply with such decisions.\r\n3. It shall be possible for the designated legal representative to be held liable for non-compliance with obligations under this Regulation, without prejudice to the liability and legal actions that could be initiated against the provider of intermediary services.\r\n4. Providers of intermediary services shall notify the name, postal address, email address and telephone number of their legal representative to the Digital Services Coordinator in the Member State where that legal representative resides or is established. They shall ensure that that information is publicly available, easily accessible, accurate and kept up to date.\r\n5. The designation of a legal representative within the Union pursuant to paragraph 1 shall not constitute an establishment in the Union.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 15]\r\nArticle 15\r\nTransparency reporting obligations for providers of intermediary services\r\n1. Providers of intermediary services shall make publicly available, in a machine-readable format and in an easily accessible manner, at least once a year, clear, easily comprehensible reports on any content moderation that they engaged in during the relevant period. Those reports shall include, in particular, information on the following, as applicable:\r\n(a)\r\nfor providers of intermediary services, the number of orders received from Member Statesâ€™ authorities including orders issued in accordance with Articles 9 and 10, categorised by the type of illegal content concerned, the Member State issuing the order, and the median time needed to inform the authority issuing the order, or any other authority specified in the order, of its receipt, and to give effect to the order;\r\n(b)\r\nfor providers of hosting services, the number of notices submitted in accordance with Article 16, categorised by the type of alleged illegal content concerned, the number of notices submitted by trusted flaggers, any action taken pursuant to the notices by differentiating whether the action was taken on the","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-049","EXTRACTION_ID":"EXT-000502","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_15/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"issue, adopt or make decision","ACTION_OBJECT_LUNA":"concerning the form, content and other details of reports pursuant to paragraph 1 of this Article, including harmonised reporting periods. Those implementing acts shall be adopted ","COUNTERPART_LUNA":"with the advisory procedure referred to in Article 88","RECIPIENT_LUNA":"with the advisory procedure referred to in Article 88","SOURCE_EXCERPT":"The Commission may adopt implementing acts to lay down templates concerning the form, content and other details of reports pursuant to paragraph 1 of this Article, including harmonised reporting periods. Those implementing acts shall be adopted ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 15]\r\nArticle 15\r\nTransparency reporting obligations for providers of intermediary services\r\n1. Providers of intermediary services shall make publicly available, in a machine-readable format and in an easily accessible manner, at least once a year, clear, easily comprehensible reports on any content moderation that they engaged in during the relevant period. Those reports shall include, in particular, information on the following, as applicable:\r\n(a)\r\nfor providers of intermediary services, the number of orders received from Member Statesâ€™ authorities including orders issued in accordance with Articles 9 and 10, categorised by the type of illegal content concerned, the Member State issuing the order, and the median time needed to inform the authority issuing the order, or any other authority specified in the order, of its receipt, and to give effect to the order;\r\n(b)\r\nfor providers of hosting services, the number of notices submitted in accordance with Article 16, categorised by the type of alleged illegal content concerned, the number of notices submitted by trusted flaggers, any action taken pursuant to the notices by differentiating whether the action was taken on the basis of the law or the terms and conditions of the provider, the number of notices processed by using automated means and the median time needed for taking the action;\r\n(c)\r\nfor providers of intermediary services, meaningful and comprehensible information about the content moderation engaged in at the providersâ€™ own initiative, including the use of automated tools, the measures taken to provide training and assistance to persons in charge of content moderation, the number and type of measures taken that affect the availability, visibility and accessibility of information provided by the recipients of the service and the recipientsâ€™ ability to provide information through the service, and other related restrictions of the service; the information reported shall be categorised by the type of illegal content or violation of the terms and conditions of the service provider, by the detection method and by the type of restriction applied;\r\n(d)\r\nfor providers of intermediary services, the number of complaints received through the internal complaint-handling systems in accordance with the providerâ€™s terms and conditions and additionally, for providers of online platforms, in accordance with Article 20, the basis for those complaints, decisions taken in respect of those complaints, the median time needed for taking those decisions and the number of instances where those decisions were reversed;\r\n(e)\r\nany use made of automated means for the purpose of content moderation, including a qualitative description, a specification of the precise purposes, indicators of the accuracy and the possible rate of error of the automated means used in fulfilling those purposes, and any safeguards applied.\r\n2. Paragraph 1 of this Article shall not apply to providers of intermediary services that qualify as micro or small enterprises as defined in Recommendation 2003/361/EC and which are not very large online platforms within the meaning of Article 33 of this Regulation.\r\n3. The Commission may adopt implementing acts to lay down templates concerning the form, content and other details of reports pursuant to paragraph 1 of this Article, including harmonised reporting periods. Those implementing acts shall be adopted in accordance with the advisory procedure referred to in Article 88.\r\n[SECTION 2]\r\nSECTION 2\r\nAdditional provisions applicable to providers of hosting services, including online platforms","FULL_SOURCE_CONTEXT_BEFORE":" at minors or is predominantly used by them, the provider of that intermediary service shall explain the conditions for, and any restrictions on, the use of the service in a way that minors can understand.\r\n4. Providers of intermediary services shall act in a diligent, objective and proportionate manner in applying and enforcing the restrictions referred to in paragraph 1, with due regard to the rights and legitimate interests of all parties involved, including the fundamental rights of the recipients of the service, such as the freedom of expression, freedom and pluralism of the media, and other fundamental rights and freedoms as enshrined in the Charter.\r\n5. Providers of very large online platforms and of very large online search engines shall provide recipients of services with a concise, easily-accessible and machine-readable summary of the terms and conditions, including the available remedies and redress mechanisms, in clear and unambiguous language.\r\n6. Very large online platforms and very large online search engines within the meaning of Article 33 shall publish their terms and conditions in the official languages of all the Member States in which they offer their services.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 16]\r\nArticle 16\r\nNotice and action mechanisms\r\n1. Providers of hosting services shall put mechanisms in place to allow any individual or entity to notify them of the presence on their service of specific items of information that the individual or entity considers to be illegal content. Those mechanisms shall be easy to access and user-friendly, and shall allow for the submission of notices exclusively by electronic means.\r\n2. The mechanisms referred to in paragraph 1 shall be such as to facilitate the submission of sufficiently precise and adequately substantiated notices. To that end, the providers of hosting services shall take the necessary measures to enable and to facilitate the submission of notices containing all of the following elements:\r\n(a)\r\na sufficiently substantiated explanation of the reasons why the individual or entity alleges the information in question to be illegal content;\r\n(b)\r\na clear indication of the exact electronic location of that information, such as the exact URL or URLs, and, where necessary, additional information enabling the identification of the illegal content adapted to the type of content and to the specific type of hosting service;\r\n","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-050","EXTRACTION_ID":"EXT-000536","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_24/p3","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"Providers of online platforms or of online search engines","LEGAL_ACTION_LUNA":"communicate to the Digital Services Coordinator of","ACTION_OBJECT_LUNA":"establishment and the Commission, upon their request and without undue delay, the information referred to in paragraph 2, updated to the moment of such request. That Digital Servicâ€¦","COUNTERPART_LUNA":"to the Digital Services Coordinator of establishment and the Commission","RECIPIENT_LUNA":"to the Digital Services Coordinator of establishment and the Commission","SOURCE_EXCERPT":"Providers of online platforms or of online search engines shall communicate to the Digital Services Coordinator of establishment and the Commission, upon their request and without undue delay, the information referred to in paragraph 2, updated to the moment of such request. That Digital Services Coordinator or the Commission may require the provider of the online platform or of the online search engine to provide additional information as regards the calculation referred to in that paragraph, iâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 24]\r\nArticle 24\r\nTransparency reporting obligations for providers of online platforms\r\n1. In addition to the information referred to in Article 15, providers of online platforms shall include in the reports referred to in that Article information on the following:\r\n(a)\r\nthe number of disputes submitted to the out-of-court dispute settlement bodies referred to in Article 21, the outcomes of the dispute settlement, and the median time needed for completing the dispute settlement procedures, as well as the share of disputes where the provider of the online platform implemented the decisions of the body;\r\n(b)\r\nthe number of suspensions imposed pursuant to Article 23, distinguishing between suspensions enacted for the provision of manifestly illegal content, the submission of manifestly unfounded notices and the submission of manifestly unfounded complaints.\r\n2. By 17 February 2023 and at least once every six months thereafter, providers shall publish for each online platform or online search engine, in a publicly available section of their online interface, information on the average monthly active recipients of the service in the Union, calculated as an average over the period of the past six months and in accordance with the methodology laid down in the delegated acts referred to in Article 33(3), where those delegated acts have been adopted.\r\n3. Providers of online platforms or of online search engines shall communicate to the Digital Services Coordinator of establishment and the Commission, upon their request and without undue delay, the information referred to in paragraph 2, updated to the moment of such request. That Digital Services Coordinator or the Commission may require the provider of the online platform or of the online search engine to provide additional information as regards the calculation referred to in that paragraph, including explanations and substantiation in respect of the data used. That information shall not include personal data.\r\n4. When the Digital Services Coordinator of establishment has reasons to consider, based the information received pursuant to paragraphs 2 and 3 of this Article, that a provider of online platforms or of online search engines meets the threshold of average monthly active recipients of the service in the Union laid down in Article 33(1), it shall inform the Commission thereof.\r\n5. Providers of online platforms shall, without undue delay, submit to the Commission the decisions and the statements of reasons referred to in Article 17(1) for the inclusion in a publicly accessible machine-readable database managed by the Commission. Providers of online platforms shall ensure that the information submitted does not contain personal data.\r\n6. The Commission may adopt implementing acts to lay down templates concerning the form, content and other details of reports pursuant to paragraph 1 of this Article. Those implementing acts shall be adopted in accordance with the advisory procedure referred to in Article 88.","FULL_SOURCE_CONTEXT_BEFORE":"ice, the individual, the entity or the complainant engages in the misuse referred to in paragraphs 1 and 2, taking into account all relevant facts and circumstances apparent from the information available to the provider of online platforms. Those circumstances shall include at least the following:\r\n(a)\r\nthe absolute numbers of items of manifestly illegal content or manifestly unfounded notices or complaints, submitted within a given time frame;\r\n(b)\r\nthe relative proportion thereof in relation to the total number of items of information provided or notices submitted within a given time frame;\r\n(c)\r\nthe gravity of the misuses, including the nature of illegal content, and of its consequences;\r\n(d)\r\nwhere it is possible to identify it, the intention of the recipient of the service, the individual, the entity or the complainant.\r\n4. Providers of online platforms shall set out, in a clear and detailed manner, in their terms and conditions their policy in respect of the misuse referred to in paragraphs 1 and 2, and shall give examples of the facts and circumstances that they take into account when assessing whether certain behaviour constitutes misuse and the duration of the suspension.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 25]\r\nArticle 25\r\nOnline interface design and organisation\r\n1. Providers of online platforms shall not design, organise or operate their online interfaces in a way that deceives or manipulates the recipients of their service or in a way that otherwise materially distorts or impairs the ability of the recipients of their service to make free and informed decisions.\r\n2. The prohibition in paragraph 1 shall not apply to practices covered by Directive 2005/29/EC or Regulation (EU) 2016/679.\r\n3. The Commission may issue guidelines on how paragraph 1 applies to specific practices, notably:\r\n(a)\r\ngiving more prominence to certain choices when asking the recipient of the service for a decision;\r\n(b)\r\nrepeatedly requesting that the recipient of the service make a choice where that choice has already been made, especially by presenting pop-ups that interfere with the user experience;\r\n(c)\r\nmaking the procedure for terminating a service more difficult than subscribing to it.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-051","EXTRACTION_ID":"EXT-000750","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_115","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"set out in their national law","ACTION_OBJECT_LUNA":", ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Member States should set out in their national law, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 115]\r\n(115)\r\nMember States should set out in their national law, in accordance with Union law and in particular this Regulation and the Charter, the detailed conditions and limits for the exercise of the investigatory and enforcement powers of their Digital Services Coordinators, and other competent authorities where relevant, under this Regulation.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 114]\r\n(114)\r\nMember States should provide the Digital Services Coordinator, and any other competent authority designated under this Regulation, with sufficient powers and means to ensure effective investigation and enforcement, in accordance with the tasks conferred on them. This includes the power of competent authorities to adopt interim measures in accordance with national law in case of risk of serious harm. Such interim measures, which may include orders to terminate or remedy a given alleged infringement, should not go beyond what is necessary to ensure that serious harm is prevented pending the final decision. The Digital Services Coordinators should in particular be able to search for and obtain information which is located in its territory, including in the context of joint investigations, with due regard to the fact that oversight and enforcement measures concerning a provider under the jurisdiction of another Member State or the Commission should be adopted by the Digital Services Coordinator of that other Member State, where relevant in accordance with the procedures relating to cross-border cooperation, or, where applicable, by the Commission.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 116]\r\n(116)\r\nIn the course of the exercise of those powers, the competent authorities should comply with the applicable national rules regarding procedures and matters such as the need for a prior judicial authorisation to enter certain premises and legal professional privilege. Those provisions should in particular ensure respect for the fundamental rights to an effective remedy and to a fair trial, including the rights of defence, and, the right to respect for private life. In this regard, the guarantees provided for in relation to the proceedings of the Commission pursuant to this Regulation could serve as an appropriate point of reference. A prior, fair and impartial procedure should be guaranteed before taking any final decision, including the right to be heard of the persons concerned, and the right to have access to the file, while respecting confidentiality and professional and business secrecy, as well as the obligation to give meaningful reasons for the decisions. This should not preclude the taking of measures, however, in duly substantiated cases of urgency and subject to appropriate conditions and procedural arrangements. The exercise of powers should also be ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-052","EXTRACTION_ID":"EXT-000776","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_135","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"the Commission","LEGAL_ACTION_LUNA":"ensure or safeguard","ACTION_OBJECT_LUNA":"is set ","COUNTERPART_LUNA":"with the requests of the members of the Board as laid down in the rules of procedure and in compliance with","RECIPIENT_LUNA":"with the requests of the members of the Board as laid down in the rules of procedure and in compliance with","SOURCE_EXCERPT":"The Commission, through the Chair, should participate in the Board without voting rights. Through the Chair, the Commission should ensure that the agenda of the meetings is set ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 135]\r\n(135)\r\nThe Commission, through the Chair, should participate in the Board without voting rights. Through the Chair, the Commission should ensure that the agenda of the meetings is set in accordance with the requests of the members of the Board as laid down in the rules of procedure and in compliance with the duties of the Board laid down in this Regulation.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 134]\r\n(134)\r\nThe Board should bring together the representatives of the Digital Services Coordinators and possible other competent authorities under the chairmanship of the Commission, with a view to ensuring an assessment of matters submitted to it in a fully European dimension. In view of possible cross-cutting elements that may be of relevance for other regulatory frameworks at Union level, the Board should be allowed to cooperate with other Union bodies, offices, agencies and advisory groups with responsibilities in fields such as equality, including gender equality, and non-discrimination, data protection, electronic communications, audiovisual services, detection and investigation of frauds against the Union budget as regards custom duties, consumer protection, or competition law, as necessary for the performance of its tasks.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 136]\r\n(136)\r\nIn view of the need to ensure support for the Boardâ€™s activities, the Board should be able to rely on the expertise and human resources of the Commission and of the competent national authorities. The specific operational arrangements for the internal functioning of the Board should be further specified in the rules of procedure of the Board.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-053","EXTRACTION_ID":"EXT-000825","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_33","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"The provider of intermediary services","LEGAL_ACTION_LUNA":"notify or inform","ACTION_OBJECT_LUNA":"given to such orders without undue delay, in compliance with the time limits set out in relevant Union or national law.","COUNTERPART_LUNA":"with the time limits set out in relevant Union or national law","RECIPIENT_LUNA":"with the time limits set out in relevant Union or national law","SOURCE_EXCERPT":"The provider of intermediary services should inform the issuing authority about any follow-up given to such orders without undue delay, in compliance with the time limits set out in relevant Union or national law.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 33]\r\n(33)\r\nThe provider of intermediary services should inform the issuing authority about any follow-up given to such orders without undue delay, in compliance with the time limits set out in relevant Union or national law.","FULL_SOURCE_CONTEXT_BEFORE":"L 32]\r\n(32)\r\nThe applicable Union or national law on the basis of which those orders are issued might require additional conditions and should be the basis for the enforcement of the respective orders. In the event of non-compliance with such orders, the issuing Member State should be able to enforce them in accordance with its national law. The applicable national law should be in compliance with Union law, including the Charter and the TFEU provisions on the freedom of establishment and the freedom to provide services within the Union, in particular with regard to online gambling and betting services. Similarly, the application of such national laws for the enforcement of the respective orders is without prejudice to applicable Union legal acts or international agreements concluded by the Union or by Member States relating to the cross-border recognition, execution and enforcement of those orders, in particular in civil and criminal matters. On the other hand, the enforcement of the obligation to inform the relevant authorities about the effect given to those orders, as opposed to the enforcement of the orders themselves, should be subject to the rules set out in this Regulation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 34]\r\n(34)\r\nRelevant national authorities should be able to issue such orders against content considered illegal or orders to provide information on the basis of Union law or national law in compliance with Union law, in particular the Charter, and to address them to providers of intermediary services, including those established in another Member State. However, this Regulation should be without prejudice to Union law in the field of judicial cooperation in civil or criminal matters, including Regulation (EU) No 1215/2012 and a Regulation on European production and preservation orders for electronic evidence in criminal matters, and to national criminal or civil procedural law. Therefore, where those laws in the context of criminal or civil proceedings provide for conditions that are additional to or incompatible with the conditions provided for in this Regulation in relation to orders to act against illegal content or to provide information, the conditions provided for in this Regulation might not apply or might be adapted. In particular, the obligation on the Digital Services Coordinator from the Member State of the issuing authority to transmit a copy of the orders to a","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-054","EXTRACTION_ID":"EXT-000728","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_101","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"and considering that Member States","LEGAL_ACTION_LUNA":"be entitled to charge providers established in","ACTION_OBJECT_LUNA":"their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised by their authorities, the Commission should charge a supervisory fee, the level oâ€¦","COUNTERPART_LUNA":"to the exercise of the specific powers and tasks of supervision","RECIPIENT_LUNA":"to the exercise of the specific powers and tasks of supervision","SOURCE_EXCERPT":"The Commission should be in possession of all the necessary resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessary for the adequate supervision at Union level under this Regulation, and considering that Member States should be entitled to charge providers established in their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised bâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 101]\r\n(101)\r\nThe Commission should be in possession of all the necessary resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessary for the adequate supervision at Union level under this Regulation, and considering that Member States should be entitled to charge providers established in their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised by their authorities, the Commission should charge a supervisory fee, the level of which should be established on an annual basis, on very large online platforms and very large online search engines. The overall amount of the annual supervisory fee charged should be established on the basis of the overall amount of the costs incurred by the Commission to exercise its supervisory tasks under this Regulation, as reasonably estimated beforehand. Such amount should include costs relating to the exercise of the specific powers and tasks of supervision, investigation, enforcement and monitoring in respect of providers of very large online platforms and of very large online search engines, including costs related to the designation of very large online platforms and of very large online search engines or to the set up, maintenance and operation of the databases envisaged under this Regulation.\r\nIt should also include costs relating to the set-up, maintenance and operation of the basic information and institutional infrastructure for the cooperation among Digital Services Coordinators, the Board and the Commission, taking into account the fact that in view of their size and reach very large online platforms and very large online search engines have a significant impact on the resources needed to support such infrastructure. The estimation of the overall costs should take into account the supervisory costs incurred in the previous year including, where applicable, those costs exceeding the individual annual supervisory fee charged in the previous year. The external assigned revenues resulting from the annual supervisory fee could be used to finance additional human resources, such as contractual agents and seconded national experts, and other expenditure related to the fulfilment of the tasks entrusted to the Commission by this Regulation. The annual supervisory fee to be charged on providers of very large online platforms and of very large online search engines should be proportionate to the size of the service as reflected by the number of its active recipients of the service in the Union. Moreover, the individual annual supervisory fee should not exceed an overall ceiling for each provider of very large online platforms or of very large online search engines taking into account the economic capacity of the provider of the designated service or services.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 100]\r\n(100)\r\nIn view of the additional risks relating to their activities and their additional obligations under this Regulation, additional transparency requirements should apply specifically to very large online platforms and very large online search engines, notably to report comprehensively on the risk assessments performed and subsequent measures adopted as provided by this Regulation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 102]\r\n(102)\r\nTo facilitate the effective and consistent application of the obligations in this Regulation that may require implementation through technological means, it is important to promote voluntary standards covering certain technical procedures, where the industry can help develop standardised means to support providers of intermediary services in complying with this Regulation, such as allowing the submission of notices, including through application programming interfaces, or standards related to terms and conditions or standards relating to audits, or standards related to the interoperability of advertisement repositories. In addition, such standards could include standards related to online advertising, recommender systems, accessibility and the protection of minors online. Providers of intermediary services are free to adopt the standards, but their adoption does not presume compliance with this Regulation. At the same time, by providing best practices, such standards could in particular be useful for relatively small providers of intermediary services. The standards could distinguish between different types of illegal content or different types of intermediary","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-055","EXTRACTION_ID":"EXT-000729","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_101","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"be in possession of all the necessary","ACTION_OBJECT_LUNA":"resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessâ€¦","COUNTERPART_LUNA":"to the exercise of the specific powers and tasks of supervision","RECIPIENT_LUNA":"to the exercise of the specific powers and tasks of supervision","SOURCE_EXCERPT":"The Commission should be in possession of all the necessary resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessary for the adequate supervision at Union level under this Regulation, and considering that Member States should be entitled to charge providers established in their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised bâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 101]\r\n(101)\r\nThe Commission should be in possession of all the necessary resources, in terms of staffing, expertise, and financial means, for the performance of its tasks under this Regulation. In order to ensure the availability of the resources necessary for the adequate supervision at Union level under this Regulation, and considering that Member States should be entitled to charge providers established in their territory a supervisory fee to in respect of the supervisory and enforcement tasks exercised by their authorities, the Commission should charge a supervisory fee, the level of which should be established on an annual basis, on very large online platforms and very large online search engines. The overall amount of the annual supervisory fee charged should be established on the basis of the overall amount of the costs incurred by the Commission to exercise its supervisory tasks under this Regulation, as reasonably estimated beforehand. Such amount should include costs relating to the exercise of the specific powers and tasks of supervision, investigation, enforcement and monitoring in respect of providers of very large online platforms and of very large online search engines, including costs related to the designation of very large online platforms and of very large online search engines or to the set up, maintenance and operation of the databases envisaged under this Regulation.\r\nIt should also include costs relating to the set-up, maintenance and operation of the basic information and institutional infrastructure for the cooperation among Digital Services Coordinators, the Board and the Commission, taking into account the fact that in view of their size and reach very large online platforms and very large online search engines have a significant impact on the resources needed to support such infrastructure. The estimation of the overall costs should take into account the supervisory costs incurred in the previous year including, where applicable, those costs exceeding the individual annual supervisory fee charged in the previous year. The external assigned revenues resulting from the annual supervisory fee could be used to finance additional human resources, such as contractual agents and seconded national experts, and other expenditure related to the fulfilment of the tasks entrusted to the Commission by this Regulation. The annual supervisory fee to be charged on providers of very large online platforms and of very large online search engines should be proportionate to the size of the service as reflected by the number of its active recipients of the service in the Union. Moreover, the individual annual supervisory fee should not exceed an overall ceiling for each provider of very large online platforms or of very large online search engines taking into account the economic capacity of the provider of the designated service or services.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 100]\r\n(100)\r\nIn view of the additional risks relating to their activities and their additional obligations under this Regulation, additional transparency requirements should apply specifically to very large online platforms and very large online search engines, notably to report comprehensively on the risk assessments performed and subsequent measures adopted as provided by this Regulation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 102]\r\n(102)\r\nTo facilitate the effective and consistent application of the obligations in this Regulation that may require implementation through technological means, it is important to promote voluntary standards covering certain technical procedures, where the industry can help develop standardised means to support providers of intermediary services in complying with this Regulation, such as allowing the submission of notices, including through application programming interfaces, or standards related to terms and conditions or standards relating to audits, or standards related to the interoperability of advertisement repositories. In addition, such standards could include standards related to online advertising, recommender systems, accessibility and the protection of minors online. Providers of intermediary services are free to adopt the standards, but their adoption does not presume compliance with this Regulation. At the same time, by providing best practices, such standards could in particular be useful for relatively small providers of intermediary services. The standards could distinguish between different types of illegal content or different types of intermediary","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-056","EXTRACTION_ID":"EXT-000736","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_107","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"the Commission","LEGAL_ACTION_LUNA":"invite the Fundamental Rights Agency or the","ACTION_OBJECT_LUNA":"European Data Protection Supervisor to express their opinions on the respective code of conduct.","COUNTERPART_LUNA":"from the natural or legal person on whose behalf the advertisement is presented on the online interface of a","RECIPIENT_LUNA":"from the natural or legal person on whose behalf the advertisement is presented on the online interface of a","SOURCE_EXCERPT":"The provision of online advertising generally involves several actors, including intermediary services that connect publishers of advertisements with advertisers. Codes of conduct should support and complement the transparency obligations relating to advertising for providers of online platforms, of very large online platforms and of very large online search engines set out in this Regulation in order to provide for flexible and effective mechanisms to facilitate and enhance the compliance withâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTION_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 107]\r\n(107)\r\nThe provision of online advertising generally involves several actors, including intermediary services that connect publishers of advertisements with advertisers. Codes of conduct should support and complement the transparency obligations relating to advertising for providers of online platforms, of very large online platforms and of very large online search engines set out in this Regulation in order to provide for flexible and effective mechanisms to facilitate and enhance the compliance with those obligations, notably as concerns the modalities of the transmission of the relevant information. This should include facilitating the transmission of the information on the advertiser who pays for the advertisement when they differ from the natural or legal person on whose behalf the advertisement is presented on the online interface of an online platform. The codes of conduct should also include measures to ensure that meaningful information about the monetisation of data is appropriately shared throughout the value chain. The involvement of a wide range of stakeholders should ensure that those codes of conduct are widely supported, technically sound, effective and offer the highest levels of user-friendliness to ensure that the transparency obligations achieve their objectives. In order to ensure the effectiveness of codes of conduct, the Commission should include evaluation mechanisms in drawing up the codes of conduct. Where appropriate, the Commission may invite the Fundamental Rights Agency or the European Data Protection Supervisor to express their opinions on the respective code of conduct.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 106]\r\n(106)\r\nThe rules on codes of conduct under this Regulation could serve as a basis for already established self-regulatory efforts at Union level, including the Product Safety Pledge, the Memorandum of understanding on the sale of counterfeit goods on the internet, the Code of conduct on countering illegal hate speech online, as well as the Code of Practice on Disinformation. In particular for the latter, following the Commissionâ€™s guidance, the Code of Practice on Disinformation has been strengthened as announced in the European Democracy Action Plan.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 108]\r\n(108)\r\nIn addition to the crisis response mechanism for very large online platforms and very large online search engines, the Commission may initiate the drawing up of voluntary crisis protocols to coordinate a rapid, collective and cross-border response in the online environment. Such can be the case, for example, where online platforms are misused for the rapid spread of illegal content or disinformation or where the need arises for rapid dissemination of reliable information. In light of the important role of very large online platforms in disseminating information in our societies and across borders, providers of such platforms should be encouraged in drawing up and applying specific crisis protocols. Such crisis protocols should be activated only for a limited period of time and the measures adopted should also be limited to what is strictly necessary to address the extraordinary circumstance. Those measures should be consistent with this Regulation, and should not amount to a general obligation for the participating providers of very large online platforms and of very large online search engines to monitor the information which they transmit or store, nor activ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-057","EXTRACTION_ID":"EXT-000755","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_119","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Member States should ensure that Digital Services Coordinators","LEGAL_ACTION_LUNA":"take measures that are effective in addressing","ACTION_OBJECT_LUNA":"and proportionate to certain particularly serious and persistent infringements of this Regulation. Especially ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Member States should ensure that Digital Services Coordinators can take measures that are effective in addressing and proportionate to certain particularly serious and persistent infringements of this Regulation. Especially ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 119]\r\n(119)\r\nMember States should ensure that Digital Services Coordinators can take measures that are effective in addressing and proportionate to certain particularly serious and persistent infringements of this Regulation. Especially where those measures can affect the rights and interests of third parties, as may be the case in particular where the access to online interfaces is restricted, it is appropriate to require that the measures are subject to additional safeguards. In particular, third parties potentially affected should be afforded the opportunity to be heard and such orders should only be issued when powers to take such measures as provided by other acts of Union law or by national law, for instance to protect collective interests of consumers, to ensure the prompt removal of web pages containing or disseminating child pornography, or to disable access to services that are being used by a third party to infringe an intellectual property right, are not reasonably available.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 118]\r\n(118)\r\nIn order to ensure effective enforcement of the obligations laid down in this Regulation, individuals or representative organisations should be able to lodge any complaint related to compliance with those obligations with the Digital Services Coordinator in the territory where they received the service, without prejudice to this Regulationâ€™s rules on allocation of competences and to the applicable rules on handling of complaints in accordance with national principles of good administration. Complaints could provide a faithful overview of concerns related to a particular intermediary service providerâ€™s compliance and could also inform the Digital Services Coordinator of any more cross-cutting issues. The Digital Services Coordinator should involve other national competent authorities as well as the Digital Services Coordinator of another Member State, and in particular the one of the Member State where the provider of intermediary services concerned is established, if the issue requires cross-border cooperation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 120]\r\n(120)\r\nSuch an order to restrict access should not go beyond what is necessary to achieve its objective. For that purpose, it should be temporary and be addressed in principle to a provider of intermediary services, such as the relevant hosting service provider, internet service provider or domain registry or registrar, which is in a reasonable position to achieve that objective without unduly restricting access to lawful information.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-058","EXTRACTION_ID":"EXT-000766","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_13","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"providers of hosting services","LEGAL_ACTION_LUNA":"not be considered as online platforms where","ACTION_OBJECT_LUNA":"the dissemination to the public is merely a minor and purely ancillary feature that is intrinsically linked to another service, or a minor functionality of the principal service, aâ€¦","COUNTERPART_LUNA":"to the public at the request of the recipients of the service","RECIPIENT_LUNA":"to the public at the request of the recipients of the service","SOURCE_EXCERPT":"Considering the particular characteristics of the services concerned and the corresponding need to make the providers thereof ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 13]\r\n(13)\r\nConsidering the particular characteristics of the services concerned and the corresponding need to make the providers thereof subject to certain specific obligations, it is necessary to distinguish, within the broader category of providers of hosting services as defined in this Regulation, the subcategory of online platforms. Online platforms, such as social networks or online platforms allowing consumers to conclude distance contracts with traders, should be defined as providers of hosting services that not only store information provided by the recipients of the service at their request, but that also disseminate that information to the public at the request of the recipients of the service. However, in order to avoid imposing overly broad obligations, providers of hosting services should not be considered as online platforms where the dissemination to the public is merely a minor and purely ancillary feature that is intrinsically linked to another service, or a minor functionality of the principal service, and that feature or functionality cannot, for objective technical reasons, be used without that other or principal service, and the integration of that feature or functionality is not a means to circumvent the applicability of the rules of this Regulation applicable to online platforms. For example, the comments section in an online newspaper could constitute such a feature, where it is clear that it is ancillary to the main service represented by the publication of news under the editorial responsibility of the publisher. In contrast, the storage of comments in a social network should be considered an online platform service where it is clear that it is not a minor feature of the service offered, even if it is ancillary to publishing the posts of recipients of the service. For the purposes of this Regulation, cloud computing or web-hosting services should not be considered to be an online platform where dissemination of specific information to the public constitutes a minor and ancillary feature or a minor functionality of such services.\r\nMoreover, cloud computing services and web-hosting services, when serving as infrastructure, such as the underlying infrastructural storage and computing services of an internet-based application, website or online platform, should not in themselves be considered as disseminating to the public information stored or processed at the request of a recipient of the application, website or online platform which they host.","FULL_SOURCE_CONTEXT_BEFORE":"espective of its form, that under the applicable law is either itself illegal, such as illegal hate speech or terrorist content and unlawful discriminatory content, or that the applicable rules render illegal in view of the fact that it relates to illegal activities. Illustrative examples include the sharing of images depicting child sexual abuse, the unlawful non-consensual sharing of private images, online stalking, the sale of non-compliant or counterfeit products, the sale of products or the provision of services in infringement of consumer protection law, the non-authorised use of copyright protected material, the illegal offer of accommodation services or the illegal sale of live animals. In contrast, an eyewitness video of a potential crime should not be considered to constitute illegal content, merely because it depicts an illegal act, where recording or disseminating such a video to the public is not illegal under national or Union law. In this regard, it is immaterial whether the illegality of the information or activity results from Union law or from national law that is in compliance with Union law and what the precise nature or subject matter is of the law in question.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 14]\r\n(14)\r\nThe concept of â€˜dissemination to the publicâ€™, as used in this Regulation, should entail the making available of information to a potentially unlimited number of persons, meaning making the information easily accessible to recipients of the service in general without further action by the recipient of the service providing the information being required, irrespective of whether those persons actually access the information in question. Accordingly, where access to information requires registration or admittance to a group of recipients of the service, that information should be considered to be disseminated to the public only where recipients of the service seeking to access the information are automatically registered or admitted without a human decision or selection of whom to grant access. Interpersonal communication services, as defined in Directive (EU) 2018/1972 of the European Parliament and of the Council (24), such as emails or private messaging services, fall outside the scope of the definition of online platforms as they are used for interpersonal communication between a finite number of persons determined by the sender of the communication. Howeve","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-059","EXTRACTION_ID":"EXT-000773","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_133","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"the Board","LEGAL_ACTION_LUNA":"be able to adopt opinions","ACTION_OBJECT_LUNA":", requests and recommendations addressed to Digital Services Coordinators or other competent national authorities. While not legally binding, the decision to deviate therefrom shouâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"For that purpose, the Board should be able to adopt opinions, requests and recommendations addressed to Digital Services Coordinators or other competent national authorities. While not legally binding, the decision to deviate therefrom should be properly explained and could be taken into account by the Commission in assessing the compliance of the Member State concerned with this Regulation.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 133]\r\n(133)\r\nFor that purpose, the Board should be able to adopt opinions, requests and recommendations addressed to Digital Services Coordinators or other competent national authorities. While not legally binding, the decision to deviate therefrom should be properly explained and could be taken into account by the Commission in assessing the compliance of the Member State concerned with this Regulation.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 132]\r\n(132)\r\nThe Board should contribute to achieving a common Union perspective on the consistent application of this Regulation and to the cooperation among competent authorities, including by advising the Commission and the Digital Services Coordinators about appropriate investigation and enforcement measures, in particular vis Ã  vis the providers of very large online platforms or of very large online search engines and having regard, in particular, to the freedom of the providers of intermediary services to provide services across the Union. The Board should also contribute to the drafting of relevant templates and codes of conduct and to the analysis of emerging general trends in the development of digital services in the Union, including by issuing opinions or recommendations on matters related to standards.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 134]\r\n(134)\r\nThe Board should bring together the representatives of the Digital Services Coordinators and possible other competent authorities under the chairmanship of the Commission, with a view to ensuring an assessment of matters submitted to it in a fully European dimension. In view of possible cross-cutting elements that may be of relevance for other regulatory frameworks at Union level, the Board should be allowed to cooperate with other Union bodies, offices, agencies and advisory groups with responsibilities in fields such as equality, including gender equality, and non-discrimination, data protection, electronic communications, audiovisual services, detection and investigation of frauds against the Union budget as regards custom duties, consumer protection, or competition law, as necessary for the performance of its tasks.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-060","EXTRACTION_ID":"EXT-000734","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#recital_103","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"The Commission and the Board","LEGAL_ACTION_LUNA":"encourage the drawing-up of voluntary codes of","ACTION_OBJECT_LUNA":"conduct, as well as the implementation of the provisions of those codes in order to contribute to the application of this Regulation. The Commission and the Board should aim that tâ€¦","COUNTERPART_LUNA":"to the application of this Regulation","RECIPIENT_LUNA":"to the application of this Regulation","SOURCE_EXCERPT":"The Commission and the Board should encourage the drawing-up of voluntary codes of conduct, as well as the implementation of the provisions of those codes in order to contribute to the application of this Regulation. The Commission and the Board should aim that the codes of conduct clearly define the nature of the public interest objectives being addressed, that they contain mechanisms for independent evaluation of the achievement of those objectives and that the role of relevant authorities isâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 103]\r\n(103)\r\nThe Commission and the Board should encourage the drawing-up of voluntary codes of conduct, as well as the implementation of the provisions of those codes in order to contribute to the application of this Regulation. The Commission and the Board should aim that the codes of conduct clearly define the nature of the public interest objectives being addressed, that they contain mechanisms for independent evaluation of the achievement of those objectives and that the role of relevant authorities is clearly defined. Particular attention should be given to avoiding negative effects on security, the protection of privacy and personal data, as well as to the prohibition on imposing general monitoring obligations. While the implementation of codes of conduct should be measurable and subject to public oversight, this should not impair the voluntary nature of such codes and the freedom of interested parties to decide whether to participate. In certain circumstances, it is important that very large online platforms cooperate in the drawing-up and adhere to specific codes of conduct. Nothing in this Regulation prevents other service providers from adhering to the same standards of due diligence, adopting best practices and benefitting from the guidelines provided by the Commission and the Board, by participating in the same codes of conduct.","FULL_SOURCE_CONTEXT_BEFORE":"acilitate the effective and consistent application of the obligations in this Regulation that may require implementation through technological means, it is important to promote voluntary standards covering certain technical procedures, where the industry can help develop standardised means to support providers of intermediary services in complying with this Regulation, such as allowing the submission of notices, including through application programming interfaces, or standards related to terms and conditions or standards relating to audits, or standards related to the interoperability of advertisement repositories. In addition, such standards could include standards related to online advertising, recommender systems, accessibility and the protection of minors online. Providers of intermediary services are free to adopt the standards, but their adoption does not presume compliance with this Regulation. At the same time, by providing best practices, such standards could in particular be useful for relatively small providers of intermediary services. The standards could distinguish between different types of illegal content or different types of intermediary services, as appropriate.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 104]\r\n(104)\r\nIt is appropriate that this Regulation identify certain areas of consideration for such codes of conduct. In particular, risk mitigation measures concerning specific types of illegal content should be explored via self- and co-regulatory agreements. Another area for consideration is the possible negative impacts of systemic risks on society and democracy, such as disinformation or manipulative and abusive activities or any adverse effects on minors. This includes coordinated operations aimed at amplifying information, including disinformation, such as the use of bots or fake accounts for the creation of intentionally inaccurate or misleading information, sometimes with a purpose of obtaining economic gain, which are particularly harmful for vulnerable recipients of the service, such as minors. In relation to such areas, adherence to and compliance with a given code of conduct by a very large online platform or a very large online search engine may be considered as an appropriate risk mitigating measure. The refusal without proper explanations by a provider of an online platform or of an online search engine of the Commissionâ€™s invitation to participate in th","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-061","EXTRACTION_ID":"EXT-000927","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#article_101/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"impose on providers of general-purpose AI models","ACTION_OBJECT_LUNA":"fines not exceeding 3 % of their annual total worldwide turnover in the preceding financial year or EUR 15 000 000, whichever is higher., when the Commission finds that the provideâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The Commission may impose on providers of general-purpose AI models fines not exceeding 3 % of their annual total worldwide turnover in the preceding financial year or EUR 15 000 000, whichever is higher., when the Commission finds that the provider intentionally or negligently:","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 101]\r\nArticle 101\r\nFines for providers of general-purpose AI models\r\n1. The Commission may impose on providers of general-purpose AI models fines not exceeding 3 % of their annual total worldwide turnover in the preceding financial year or EUR 15 000 000, whichever is higher., when the Commission finds that the provider intentionally or negligently:\r\n(a)\r\ninfringed the relevant provisions of this Regulation;\r\n(b)\r\nfailed to comply with a request for a document or for information pursuant to Article 91, or supplied incorrect, incomplete or misleading information;\r\n(c)\r\nfailed to comply with a measure requested under Article 93;\r\n(d)\r\nfailed to make available to the Commission access to the general-purpose AI model or general-purpose AI model with systemic risk with a view to conducting an evaluation pursuant to Article 92.\r\nIn fixing the amount of the fine or periodic penalty payment, r
