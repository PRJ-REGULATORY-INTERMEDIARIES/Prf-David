 of Article 9(2), and where there is no other legal ground for the processing;\r\n(c)\r\nthe data subject objects to the processing pursuant to Article 21(1) and there are no overriding legitimate grounds for the processing, or the data subject objects to the processing pursuant to Article 21(2);\r\n(d)\r\nthe personal data have been unlawfully processed;\r\n(e)\r\nthe personal data have to be erased for compliance with a legal obligation in Union or Member State law to which the controller is subject;\r\n(f)\r\nthe personal data have been collected in relation to the offer of information society services referred to in Article 8(1).\r\n2. Where the controller has made the personal data public and is obliged pursuant to paragraph 1 to erase the personal data, the controller, taking account of available technology and the cost of implementation, shall take reasonable steps, including technical measures, to inform controllers which are processing the personal data that the data subject has requested the erasure by such controllers of any links to, or copy or replication of, those personal data.\r\n3. Paragraphs 1 and 2 shall not apply to the extent that processing is necessary:\r\n(a)\r\nfor exercising the right of freedom of expression and information;\r\n(b)\r\nfor compliance with a legal obligation which requires processing by Union or Member State law to which the controller is subject or for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller;\r\n(c)\r\nfor reasons of public interest in the area of public health in accordance with points (h) and (i) of Article 9(2) as well as Article 9(3);\r\n(d)\r\nfor archiving purposes in the public interest, scientific or historical research purposes or statistical purposes in accordance with Article 89(1) in so far as the right referred to in paragraph 1 is likely to render impossible or seriously impair the achievement of the objectives of that processing; or\r\n(e)\r\nfor the establishment, exercise or defence of legal claims.","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 16]\r\nArticle 16\r\nRight to rectification\r\nThe data subject shall have the right to obtain from the controller without undue delay the rectification of inaccurate personal data concerning him or her. Taking into account the purposes of the processing, the data subject shall have the right to have incomplete personal data completed, including by means of providing a supplementary statement.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 18]\r\nArticle 18\r\nRight to restriction of processing\r\n1. The data subject shall have the right to obtain from the controller restriction of processing where one of the following applies:\r\n(a)\r\nthe accuracy of the personal data is contested by the data subject, for a period enabling the controller to verify the accuracy of the personal data;\r\n(b)\r\nthe processing is unlawful and the data subject opposes the erasure of the personal data and requests the restriction of their use instead;\r\n(c)\r\nthe controller no longer needs the personal data for the purposes of the processing, but they are required by the data subject for the establishment, exercise or defence of legal claims;\r\n(d)\r\nthe data subject has objected to processing pursuant to Article 21(1) pending the verification whether the legitimate grounds of the controller override those of the data subject.\r\n2. Where processing has been restricted under paragraph 1, such personal data shall, with the exception of storage, only be processed with the data subject\u0027s consent or for the establishment, exercise or defence of legal claims or for the protection of the rights of another natural or legal person or for reasons of import","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-019","EXTRACTION_ID":"EXT-000026","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_20/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"The data subject shall","LEGAL_ACTION_LUNA":"receive the personal data concerning him or","ACTION_OBJECT_LUNA":"her, which he or she has provided to a controller, in a structured, commonly used and machine-readable format and have the right to transmit those data to another controller withouâ€¦","COUNTERPART_LUNA":"to a controller","RECIPIENT_LUNA":"to a controller","SOURCE_EXCERPT":"The data subject shall have the right to receive the personal data concerning him or her, which he or she has provided to a controller, in a structured, commonly used and machine-readable format and have the right to transmit those data to another controller without hindrance from the controller to which the personal data have been provided, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTION_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 20]\r\nArticle 20\r\nRight to data portability\r\n1. The data subject shall have the right to receive the personal data concerning him or her, which he or she has provided to a controller, in a structured, commonly used and machine-readable format and have the right to transmit those data to another controller without hindrance from the controller to which the personal data have been provided, where:\r\n(a)\r\nthe processing is based on consent pursuant to point (a) of Article 6(1) or point (a) of Article 9(2) or on a contract pursuant to point (b) of Article 6(1); and\r\n(b)\r\nthe processing is carried out by automated means.\r\n2. In exercising his or her right to data portability pursuant to paragraph 1, the data subject shall have the right to have the personal data transmitted directly from one controller to another, where technically feasible.\r\n3. The exercise of the right referred to in paragraph 1 of this Article shall be without prejudice to Article 17. That right shall not apply to processing necessary for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller.\r\n4. The right referred to in paragraph 1 shall not adversely affect the rights and freedoms of others.\r\n[SECTION 4]\r\nSection 4\r\nRight to object and automated individual decision-making","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 19]\r\nArticle 19\r\nNotification obligation regarding rectification or erasure of personal data or restriction of processing\r\nThe controller shall communicate any rectification or erasure of personal data or restriction of processing carried out in accordance with Article 16, Article 17(1) and Article 18 to each recipient to whom the personal data have been disclosed, unless this proves impossible or involves disproportionate effort. The controller shall inform the data subject about those recipients if the data subject requests it.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 21]\r\nArticle 21\r\nRight to object\r\n1. The data subject shall have the right to object, on grounds relating to his or her particular situation, at any time to processing of personal data concerning him or her which is based on point (e) or (f) of Article 6(1), including profiling based on those provisions. The controller shall no longer process the personal data unless the controller demonstrates compelling legitimate grounds for the processing which override the interests, rights and freedoms of the data subject or for the establishment, exercise or defence of legal claims.\r\n2. Where personal data are processed for direct marketing purposes, the data subject shall have the right to object at any time to processing of personal data concerning him or her for such marketing, which includes profiling to the extent that it is related to such direct marketing.\r\n3. Where the data subject objects to processing for direct marketing purposes, the personal data shall no longer be processed for such purposes.\r\n4. At the latest at the time of the first communication with the data subject, the right referred to in paragraphs 1 and 2 shall be explicitly brought to the attention of the dat","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-020","EXTRACTION_ID":"EXT-000234","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#article_82/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Any controller involved in processing","LEGAL_ACTION_LUNA":"be liable for the damage caused by","ACTION_OBJECT_LUNA":"processing which infringes this Regulation. A processor shall be liable for the damage caused by processing only ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"Any controller involved in processing shall be liable for the damage caused by processing which infringes this Regulation. A processor shall be liable for the damage caused by processing only ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 82]\r\nArticle 82\r\nRight to compensation and liability\r\n1. Any person who has suffered material or non-material damage as a result of an infringement of this Regulation shall have the right to receive compensation from the controller or processor for the damage suffered.\r\n2. Any controller involved in processing shall be liable for the damage caused by processing which infringes this Regulation. A processor shall be liable for the damage caused by processing only where it has not complied with obligations of this Regulation specifically directed to processors or where it has acted outside or contrary to lawful instructions of the controller.\r\n3. A controller or processor shall be exempt from liability under paragraph 2 if it proves that it is not in any way responsible for the event giving rise to the damage.\r\n4. Where more than one controller or processor, or both a controller and a processor, are involved in the same processing and where they are, under paragraphs 2 and 3, responsible for any damage caused by processing, each controller or processor shall be held liable for the entire damage in order to ensure effective compensation of the data subject.\r\n5. Where a controller or processor has, in accordance with paragraph 4, paid full compensation for the damage suffered, that controller or processor shall be entitled to claim back from the other controllers or processors involved in the same processing that part of the compensation corresponding to their part of responsibility for the damage, in accordance with the conditions set out in paragraph 2.\r\n6. Court proceedings for exercising the right to receive compensation shall be brought before the courts competent under the law of the Member State referred to in Article 79(2).","FULL_SOURCE_CONTEXT_BEFORE":"[ARTICLE 81]\r\nArticle 81\r\nSuspension of proceedings\r\n1. Where a competent court of a Member State has information on proceedings, concerning the same subject matter as regards processing by the same controller or processor, that are pending in a court in another Member State, it shall contact that court in the other Member State to confirm the existence of such proceedings.\r\n2. Where proceedings concerning the same subject matter as regards processing of the same controller or processor are pending in a court in another Member State, any competent court other than the court first seized may suspend its proceedings.\r\n3. Where those proceedings are pending at first instance, any court other than the court first seized may also, on the application of one of the parties, decline jurisdiction if the court first seized has jurisdiction over the actions in question and its law permits the consolidation thereof.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 83]\r\nArticle 83\r\nGeneral conditions for imposing administrative fines\r\n1. Each supervisory authority shall ensure that the imposition of administrative fines pursuant to this Article in respect of infringements of this Regulation referred to in paragraphs 4, 5 and 6 shall in each individual case be effective, proportionate and dissuasive.\r\n2. Administrative fines shall, depending on the circumstances of each individual case, be imposed in addition to, or instead of, measures referred to in points (a) to (h) and (j) of Article 58(2). When deciding whether to impose an administrative fine and deciding on the amount of the administrative fine in each individual case due regard shall be given to the following:\r\n(a)\r\nthe nature, gravity and duration of the infringement taking into account the nature scope or purpose of the processing concerned as well as the number of data subjects affected and the level of damage suffered by them;\r\n(b)\r\nthe intentional or negligent character of the infringement;\r\n(c)\r\nany action taken by the controller or processor to mitigate the damage suffered by data subjects;\r\n(d)\r\nthe degree of responsibility of the controller or processor taking into ac","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-021","EXTRACTION_ID":"EXT-000269","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_102","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"conclude international agreements which involve the transfer","ACTION_OBJECT_LUNA":"of personal data to third countries or international organisations, as far as such agreements do not affect this Regulation or any other provisions of Union law and include an apprâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"This Regulation is without prejudice to international agreements concluded between the Union and third countries regulating the transfer of personal data including appropriate safeguards for the data subjects. Member States may conclude international agreements which involve the transfer of personal data to third countries or international organisations, as far as such agreements do not affect this Regulation or any other provisions of Union law and include an appropriate level of protection forâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 102]\r\n(102)\r\nThis Regulation is without prejudice to international agreements concluded between the Union and third countries regulating the transfer of personal data including appropriate safeguards for the data subjects. Member States may conclude international agreements which involve the transfer of personal data to third countries or international organisations, as far as such agreements do not affect this Regulation or any other provisions of Union law and include an appropriate level of protection for the fundamental rights of the data subjects.","FULL_SOURCE_CONTEXT_BEFORE":"Flows of personal data to and from countries outside the Union and international organisations are necessary for the expansion of international trade and international cooperation. The increase in such flows has raised new challenges and concerns with regard to the protection of personal data. However, when personal data are transferred from the Union to controllers, processors or other recipients in third countries or to international organisations, the level of protection of natural persons ensured in the Union by this Regulation should not be undermined, including in cases of onward transfers of personal data from the third country or international organisation to controllers, processors in the same or another third country or international organisation. In any event, transfers to third countries and international organisations may only be carried out in full compliance with this Regulation. A transfer could take place only if, subject to the other provisions of this Regulation, the conditions laid down in the provisions of this Regulation relating to the transfer of personal data to third countries or international organisations are complied with by the controller or processor.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 103]\r\n(103)\r\nThe Commission may decide with effect for the entire Union that a third country, a territory or specified sector within a third country, or an international organisation, offers an adequate level of data protection, thus providing legal certainty and uniformity throughout the Union as regards the third country or international organisation which is considered to provide such level of protection. In such cases, transfers of personal data to that third country or international organisation may take place without the need to obtain any further authorisation. The Commission may also decide, having given notice and a full statement setting out the reasons to the third country or international organisation, to revoke such a decision.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-022","EXTRACTION_ID":"EXT-000287","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_114","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"the controller or processor","LEGAL_ACTION_LUNA":"make use of solutions that provide data","ACTION_OBJECT_LUNA":"subjects with enforceable and effective rights as regards the processing of their data in the Union once those data have been transferred so that that they will continue to benefitâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"In any case, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 114]\r\n(114)\r\nIn any case, where the Commission has taken no decision on the adequate level of data protection in a third country, the controller or processor should make use of solutions that provide data subjects with enforceable and effective rights as regards the processing of their data in the Union once those data have been transferred so that that they will continue to benefit from fundamental rights and safeguards.","FULL_SOURCE_CONTEXT_BEFORE":"be qualified as not repetitive and that only concern a limited number of data subjects, could also be possible for the purposes of the compelling legitimate interests pursued by the controller, when those interests are not overridden by the interests or rights and freedoms of the data subject and when the controller has assessed all the circumstances surrounding the data transfer. The controller should give particular consideration to the nature of the personal data, the purpose and duration of the proposed processing operation or operations, as well as the situation in the country of origin, the third country and the country of final destination, and should provide suitable safeguards to protect fundamental rights and freedoms of natural persons with regard to the processing of their personal data. Such transfers should be possible only in residual cases where none of the other grounds for transfer are applicable. For scientific or historical research purposes or statistical purposes, the legitimate expectations of society for an increase of knowledge should be taken into consideration. The controller should inform the supervisory authority and the data subject about the transfer.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 115]\r\n(115)\r\nSome third countries adopt laws, regulations and other legal acts which purport to directly regulate the processing activities of natural and legal persons under the jurisdiction of the Member States. This may include judgments of courts or tribunals or decisions of administrative authorities in third countries requiring a controller or processor to transfer or disclose personal data, and which are not based on an international agreement, such as a mutual legal assistance treaty, in force between the requesting third country and the Union or a Member State. The extraterritorial application of those laws, regulations and other legal acts may be in breach of international law and may impede the attainment of the protection of natural persons ensured in the Union by this Regulation. Transfers should only be allowed where the conditions of this Regulation for a transfer to third countries are met. This may be the case, inter alia, where disclosure is necessary for an important ground of public interest recognised in Union or Member State law to which the controller is subject.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-023","EXTRACTION_ID":"EXT-000290","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_117","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"be able to establish more than one","ACTION_OBJECT_LUNA":"supervisory authority, to reflect their constitutional, organisational and administrative structure.","COUNTERPART_LUNA":"to the processing of their personal data","RECIPIENT_LUNA":"to the processing of their personal data","SOURCE_EXCERPT":"The establishment of supervisory authorities in Member States, empowered to perform their tasks and exercise their powers with complete independence, is an essential component of the protection of natural persons with regard to the processing of their personal data. Member States should be able to establish more than one supervisory authority, to reflect their constitutional, organisational and administrative structure.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 117]\r\n(117)\r\nThe establishment of supervisory authorities in Member States, empowered to perform their tasks and exercise their powers with complete independence, is an essential component of the protection of natural persons with regard to the processing of their personal data. Member States should be able to establish more than one supervisory authority, to reflect their constitutional, organisational and administrative structure.","FULL_SOURCE_CONTEXT_BEFORE":"eased risk the ability of natural persons to exercise data protection rights in particular to protect themselves from the unlawful use or disclosure of that information. At the same time, supervisory authorities may find that they are unable to pursue complaints or conduct investigations relating to the activities outside their borders. Their efforts to work together in the cross-border context may also be hampered by insufficient preventative or remedial powers, inconsistent legal regimes, and practical obstacles like resource constraints. Therefore, there is a need to promote closer cooperation among data protection supervisory authorities to help them exchange information and carry out investigations with their international counterparts. For the purposes of developing international cooperation mechanisms to facilitate and provide international mutual assistance for the enforcement of legislation for the protection of personal data, the Commission and the supervisory authorities should exchange information and cooperate in activities related to the exercise of their powers with competent authorities in third countries, based on reciprocity and in accordance with this Regulation.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 118]\r\n(118)\r\nThe independence of supervisory authorities should not mean that the supervisory authorities cannot be subject to control or monitoring mechanisms regarding their financial expenditure or to judicial review.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-024","EXTRACTION_ID":"EXT-000265","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_10","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"be allowed to maintain or introduce national","ACTION_OBJECT_LUNA":"provisions to further specify the application of the rules of this Regulation. In conjunction with the general and horizontal law on data protection implementing Directive 95/46/ECâ€¦","COUNTERPART_LUNA":"to the processing of such data should be equivalent in all Member States","RECIPIENT_LUNA":"to the processing of such data should be equivalent in all Member States","SOURCE_EXCERPT":"In order to ensure a consistent and high level of protection of natural persons and to remove the obstacles to flows of personal data within the Union, the level of protection of the rights and freedoms of natural persons with regard to the processing of such data should be equivalent in all Member States. Consistent and homogenous application of the rules for the protection of the fundamental rights and freedoms of natural persons with regard to the processing of personal data should be ensuredâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTION_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 10]\r\n(10)\r\nIn order to ensure a consistent and high level of protection of natural persons and to remove the obstacles to flows of personal data within the Union, the level of protection of the rights and freedoms of natural persons with regard to the processing of such data should be equivalent in all Member States. Consistent and homogenous application of the rules for the protection of the fundamental rights and freedoms of natural persons with regard to the processing of personal data should be ensured throughout the Union. Regarding the processing of personal data for compliance with a legal obligation, for the performance of a task carried out in the public interest or in the exercise of official authority vested in the controller, Member States should be allowed to maintain or introduce national provisions to further specify the application of the rules of this Regulation. In conjunction with the general and horizontal law on data protection implementing Directive 95/46/EC, Member States have several sector-specific laws in areas that need more specific provisions. This Regulation also provides a margin of manoeuvre for Member States to specify its rules, including for the processing of special categories of personal data (â€˜sensitive dataâ€™). To that extent, this Regulation does not exclude Member State law that sets out the circumstances for specific processing situations, including determining more precisely the conditions under which the processing of personal data is lawful.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 9]\r\n(9)\r\nThe objectives and principles of Directive 95/46/EC remain sound, but it has not prevented fragmentation in the implementation of data protection across the Union, legal uncertainty or a widespread public perception that there are significant risks to the protection of natural persons, in particular with regard to online activity. Differences in the level of protection of the rights and freedoms of natural persons, in particular the right to the protection of personal data, with regard to the processing of personal data in the Member States may prevent the free flow of personal data throughout the Union. Those differences may therefore constitute an obstacle to the pursuit of economic activities at the level of the Union, distort competition and impede authorities in the discharge of their responsibilities under Union law. Such a difference in levels of protection is due to the existence of differences in the implementation and application of Directive 95/46/EC.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 11]\r\n(11)\r\nEffective protection of personal data throughout the Union requires the strengthening and setting out in detail of the rights of data subjects and the obligations of those who process and determine the processing of personal data, as well as equivalent powers for monitoring and ensuring compliance with the rules for the protection of personal data and equivalent sanctions for infringements in the Member States.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-025","EXTRACTION_ID":"EXT-000266","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_10","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"natural persons with regard to the processing of personal data","LEGAL_ACTION_LUNA":"be ensured throughout the Union","ACTION_OBJECT_LUNA":". Regarding the processing of personal data for compliance with a legal obligation, for the performance of a task carried out in the public interest or in the e k carried out in the public interest or in the exercise of official authority vested in the controller, Member States should be allowed to maintain or introduce national provisions to further specify the application of the rules of this Regulation. In conjunction with the general and horizontal law on data protection implementing Directive 95/46/EC, Member States have several sector-specific laws in areas that need more specific provisions. This Regulation also provides a margin of manoeuvre for Member States to specify its rules, including for the processing of special categories of personal data (â€˜sensitive dataâ€™). To that extent, this Regulation does not exclude Member State law that sets out the circumstances for specific processing situations, including determining more precisely the conditions under which the processing of personal data is lawful.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 9]\r\n(9)\r\nThe objectives and principles of Directive 95/46/EC remain sound, but it has not prevented fragmentation in the implementation of data protection across the Union, legal uncertainty or a widespread public perception that there are significant risks to the protection of natural persons, in particular with regard to online activity. Differences in the level of protection of the rights and freedoms of natural persons, in particular the right to the protection of personal data, with regard to the processing of personal data in the Member States may prevent the free flow of personal data throughout the Union. Those differences may therefore constitute an obstacle to the pursuit of economic activities at the level of the Union, distort competition and impede authorities in the discharge of their responsibilities under Union law. Such a difference in levels of protection is due to the existence of differences in the implementation and application of Directive 95/46/EC.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 11]\r\n(11)\r\nEffective protection of personal data throughout the Union requires the strengthening and setting out in detail of the rights of data subjects and the obligations of those who process and determine the processing of personal data, as well as equivalent powers for monitoring and ensuring compliance with the rules for the protection of personal data and equivalent sanctions for infringements in the Member States.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-026","EXTRACTION_ID":"EXT-000272","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_103","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"of personal data to that third country or international organisation","LEGAL_ACTION_LUNA":"take place without the need to obtain","ACTION_OBJECT_LUNA":"any further authorisation. The Commission may also decide, having given notice and a full statement setting out the reasons to the third country or international organisation, to râ€¦","COUNTERPART_LUNA":"to the third country or international organisation","RECIPIENT_LUNA":"to the third country or international organisation","SOURCE_EXCERPT":"The Commission may decide with effect for the entire Union that a third country, a territory or specified sector within a third country, or an international organisation, offers an adequate level of data protection, thus providing legal certainty and uniformity throughout the Union as regards the third country or international organisation which is considered to provide such level of protection. In such cases, transfers of personal data to that third country or international organisation may takâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 103]\r\n(103)\r\nThe Commission may decide with effect for the entire Union that a third country, a territory or specified sector within a third country, or an international organisation, offers an adequate level of data protection, thus providing legal certainty and uniformity throughout the Union as regards the third country or international organisation which is considered to provide such level of protection. In such cases, transfers of personal data to that third country or international organisation may take place without the need to obtain any further authorisation. The Commission may also decide, having given notice and a full statement setting out the reasons to the third country or international organisation, to revoke such a decision.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 102]\r\n(102)\r\nThis Regulation is without prejudice to international agreements concluded between the Union and third countries regulating the transfer of personal data including appropriate safeguards for the data subjects. Member States may conclude international agreements which involve the transfer of personal data to third countries or international organisations, as far as such agreements do not affect this Regulation or any other provisions of Union law and include an appropriate level of protection for the fundamental rights of the data subjects.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 104]\r\n(104)\r\nIn line with the fundamental values on which the Union is founded, in particular the protection of human rights, the Commission should, in its assessment of the third country, or of a territory or specified sector within a third country, take into account how a particular third country respects the rule of law, access to justice as well as international human rights norms and standards and its general and sectoral law, including legislation concerning public security, defence and national security as well as public order and criminal law. The adoption of an adequacy decision with regard to a territory or a specified sector in a third country should take into account clear and objective criteria, such as specific processing activities and the scope of applicable legal standards and legislation in force in the third country. The third country should offer guarantees ensuring an adequate level of protection essentially equivalent to that ensured within the Union, in particular where personal data are processed in one or several specific sectors. In particular, the third country should ensure effective independent data protection supervision and should provide for","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-027","EXTRACTION_ID":"EXT-000275","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_106","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"conduct assessment or evaluation","ACTION_OBJECT_LUNA":", within a reasonable time, the functioning of the latter decisions and report any relevant findings to the Committee within the meaning of Regulation (EU) No 182/2011 of the Europâ€¦","COUNTERPART_LUNA":"with the third country or international organisation in question and take into account all relevant developm","RECIPIENT_LUNA":"with the third country or international organisation in question and take into account all relevant developm","SOURCE_EXCERPT":"The Commission should monitor the functioning of decisions on the level of protection in a third country, a territory or specified sector within a third country, or an international organisation, and monitor the functioning of decisions adopted on the basis of Article 25(6) or Article 26(4) of Directive 95/46/EC. In its adequacy decisions, the Commission should provide for a periodic review mechanism of their functioning. That periodic review should be conducted in consultation with the third coâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 106]\r\n(106)\r\nThe Commission should monitor the functioning of decisions on the level of protection in a third country, a territory or specified sector within a third country, or an international organisation, and monitor the functioning of decisions adopted on the basis of Article 25(6) or Article 26(4) of Directive 95/46/EC. In its adequacy decisions, the Commission should provide for a periodic review mechanism of their functioning. That periodic review should be conducted in consultation with the third country or international organisation in question and take into account all relevant developments in the third country or international organisation. For the purposes of monitoring and of carrying out the periodic reviews, the Commission should take into consideration the views and findings of the European Parliament and of the Council as well as of other relevant bodies and sources. The Commission should evaluate, within a reasonable time, the functioning of the latter decisions and report any relevant findings to the Committee within the meaning of Regulation (EU) No 182/2011 of the European Parliament and of the Council (12) as established under this Regulation, to the European Parliament and to the Council.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 105]\r\n(105)\r\nApart from the international commitments the third country or international organisation has entered into, the Commission should take account of obligations arising from the third country\u0027s or international organisation\u0027s participation in multilateral or regional systems in particular in relation to the protection of personal data, as well as the implementation of such obligations. In particular, the third country\u0027s accession to the Council of Europe Convention of 28 January 1981 for the Protection of Individuals with regard to the Automatic Processing of Personal Data and its Additional Protocol should be taken into account. The Commission should consult the Board when assessing the level of protection in third countries or international organisations.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 107]\r\n(107)\r\nThe Commission may recognise that a third country, a territory or a specified sector within a third country, or an international organisation no longer ensures an adequate level of data protection. Consequently the transfer of personal data to that third country or international organisation should be prohibited, unless the requirements in this Regulation relating to transfers subject to appropriate safeguards, including binding corporate rules, and derogations for specific situations are fulfilled. In that case, provision should be made for consultations between the Commission and such third countries or international organisations. The Commission should, in a timely manner, inform the third country or international organisation of the reasons and enter into consultations with it in order to remedy the situation.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-028","EXTRACTION_ID":"EXT-000279","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_107","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"recognise that a third country","ACTION_OBJECT_LUNA":", a territory or a specified sector within a third country, or an international organisation no longer ensures an adequate level of data protection. Consequently the transfer of peâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The Commission may recognise that a third country, a territory or a specified sector within a third country, or an international organisation no longer ensures an adequate level of data protection. Consequently the transfer of personal data to that third country or international organisation should be prohibited, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 107]\r\n(107)\r\nThe Commission may recognise that a third country, a territory or a specified sector within a third country, or an international organisation no longer ensures an adequate level of data protection. Consequently the transfer of personal data to that third country or international organisation should be prohibited, unless the requirements in this Regulation relating to transfers subject to appropriate safeguards, including binding corporate rules, and derogations for specific situations are fulfilled. In that case, provision should be made for consultations between the Commission and such third countries or international organisations. The Commission should, in a timely manner, inform the third country or international organisation of the reasons and enter into consultations with it in order to remedy the situation.","FULL_SOURCE_CONTEXT_BEFORE":"uld monitor the functioning of decisions on the level of protection in a third country, a territory or specified sector within a third country, or an international organisation, and monitor the functioning of decisions adopted on the basis of Article 25(6) or Article 26(4) of Directive 95/46/EC. In its adequacy decisions, the Commission should provide for a periodic review mechanism of their functioning. That periodic review should be conducted in consultation with the third country or international organisation in question and take into account all relevant developments in the third country or international organisation. For the purposes of monitoring and of carrying out the periodic reviews, the Commission should take into consideration the views and findings of the European Parliament and of the Council as well as of other relevant bodies and sources. The Commission should evaluate, within a reasonable time, the functioning of the latter decisions and report any relevant findings to the Committee within the meaning of Regulation (EU) No 182/2011 of the European Parliament and of the Council (12) as established under this Regulation, to the European Parliament and to the Council.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 108]\r\n(108)\r\nIn the absence of an adequacy decision, the controller or processor should take measures to compensate for the lack of data protection in a third country by way of appropriate safeguards for the data subject. Such appropriate safeguards may consist of making use of binding corporate rules, standard data protection clauses adopted by the Commission, standard data protection clauses adopted by a supervisory authority or contractual clauses authorised by a supervisory authority. Those safeguards should ensure compliance with data protection requirements and the rights of the data subjects appropriate to processing within the Union, including the availability of enforceable data subject rights and of effective legal remedies, including to obtain effective administrative or judicial redress and to claim compensation, in the Union or in a third country. They should relate in particular to compliance with the general principles relating to personal data processing, the principles of data protection by design and by default. Transfers may also be carried out by public authorities or bodies with public authorities or bodies in third countries or with international orga","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-029","EXTRACTION_ID":"EXT-000304","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_125","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"The lead authority","LEGAL_ACTION_LUNA":"be competent to adopt binding decisions regarding","ACTION_OBJECT_LUNA":"measures applying the powers conferred on it ","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The lead authority should be competent to adopt binding decisions regarding measures applying the powers conferred on it ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_SCOPE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 125]\r\n(125)\r\nThe lead authority should be competent to adopt binding decisions regarding measures applying the powers conferred on it in accordance with this Regulation. In its capacity as lead authority, the supervisory authority should closely involve and coordinate the supervisory authorities concerned in the decision-making process. Where the decision is to reject the complaint by the data subject in whole or in part, that decision should be adopted by the supervisory authority with which the complaint has been lodged.","FULL_SOURCE_CONTEXT_BEFORE":"stablishment of a controller or processor in the Union substantially affects or is likely to substantially affect data subjects in more than one Member State, the supervisory authority for the main establishment of the controller or processor or for the single establishment of the controller or processor should act as lead authority. It should cooperate with the other authorities concerned, because the controller or processor has an establishment on the territory of their Member State, because data subjects residing on their territory are substantially affected, or because a complaint has been lodged with them. Also where a data subject not residing in that Member State has lodged a complaint, the supervisory authority with which such complaint has been lodged should also be a supervisory authority concerned. Within its tasks to issue guidelines on any question covering the application of this Regulation, the Board should be able to issue guidelines in particular on the criteria to be taken into account in order to ascertain whether the processing in question substantially affects data subjects in more than one Member State and on what constitutes a relevant and reasoned objection.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 126]\r\n(126)\r\nThe decision should be agreed jointly by the lead supervisory authority and the supervisory authorities concerned and should be directed towards the main or single establishment of the controller or processor and be binding on the controller and processor. The controller or processor should take the necessary measures to ensure compliance with this Regulation and the implementation of the decision notified by the lead supervisory authority to the main establishment of the controller or processor as regards the processing activities in the Union.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-030","EXTRACTION_ID":"EXT-000286","CASE_ID":"D1_GDPR","SOURCE_POINTER":"32016R0679#recital_113","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"The controller","LEGAL_ACTION_LUNA":"notify or inform","ACTION_OBJECT_LUNA":"subject about the transfer.","COUNTERPART_LUNA":"to the nature of the personal data","RECIPIENT_LUNA":"to the nature of the personal data","SOURCE_EXCERPT":"Transfers which can be qualified as not repetitive and that only concern a limited number of data subjects, could also be possible ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTION_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 113]\r\n(113)\r\nTransfers which can be qualified as not repetitive and that only concern a limited number of data subjects, could also be possible for the purposes of the compelling legitimate interests pursued by the controller, when those interests are not overridden by the interests or rights and freedoms of the data subject and when the controller has assessed all the circumstances surrounding the data transfer. The controller should give particular consideration to the nature of the personal data, the purpose and duration of the proposed processing operation or operations, as well as the situation in the country of origin, the third country and the country of final destination, and should provide suitable safeguards to protect fundamental rights and freedoms of natural persons with regard to the processing of their personal data. Such transfers should be possible only in residual cases where none of the other grounds for transfer are applicable. For scientific or historical research purposes or statistical purposes, the legitimate expectations of society for an increase of knowledge should be taken into consideration. The controller should inform the supervisory authority and the data subject about the transfer.","FULL_SOURCE_CONTEXT_BEFORE":"tent for social security matters, or for public health, for example in the case of contact tracing for contagious diseases or in order to reduce and/or eliminate doping in sport. A transfer of personal data should also be regarded as lawful where it is necessary to protect an interest which is essential for the data subject\u0027s or another person\u0027s vital interests, including physical integrity or life, if the data subject is incapable of giving consent. In the absence of an adequacy decision, Union or Member State law may, for important reasons of public interest, expressly set limits to the transfer of specific categories of data to a third country or an international organisation. Member States should notify such provisions to the Commission. Any transfer to an international humanitarian organisation of personal data of a data subject who is physically or legally incapable of giving consent, with a view to accomplishing a task incumbent under the Geneva Conventions or to complying with international humanitarian law applicable in armed conflicts, could be considered to be necessary for an important reason of public interest or because it is in the vital interest of the data subject.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 114]\r\n(114)\r\nIn any case, where the Commission has taken no decision on the adequate level of data protection in a third country, the controller or processor should make use of solutions that provide data subjects with enforceable and effective rights as regards the processing of their data in the Union once those data have been transferred so that that they will continue to benefit from fundamental rights and safeguards.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-031","EXTRACTION_ID":"EXT-000486","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_10/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"ensure or safeguard","ACTION_OBJECT_LUNA":"in paragraph 1 is transmitted to the provider, it meets at least the following conditions:","COUNTERPART_LUNA":"to the provider","RECIPIENT_LUNA":"to the provider","SOURCE_EXCERPT":"Member States shall ensure that when an order referred to in paragraph 1 is transmitted to the provider, it meets at least the following conditions:","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 10]\r\nArticle 10\r\nOrders to provide information\r\n1. Upon receipt of an order to provide specific information about one or more specific individual recipients of the service, issued by the relevant national judicial or administrative authorities on the basis of the applicable Union law or national law in compliance with Union law, providers of intermediary services shall, without undue delay inform the authority issuing the order, or any other authority specified in the order, of its receipt and of the effect given to the order, specifying if and when effect was given to the order.\r\n2. Member States shall ensure that when an order referred to in paragraph 1 is transmitted to the provider, it meets at least the following conditions:\r\n(a)\r\nthat order contains the following elements:\r\n(i)\r\na reference to the legal basis under Union or national law for the order;\r\n(ii)\r\ninformation identifying the issuing authority;\r\n(iii)\r\nclear information enabling the provider of intermediary services to identify the specific recipient or recipients on whom information is sought, such as one or more account names or unique identifiers;\r\n(iv)\r\na statement of reasons explaining the objective for which the information is required and why the requirement to provide the information is necessary and proportionate to determine compliance by the recipients of the intermediary services with applicable Union law or national law in compliance with Union law, unless such a statement cannot be provided for reasons related to the prevention, investigation, detection and prosecution of criminal offences;\r\n(v)\r\ninformation about redress mechanisms available to the provider and to the recipients of the service concerned;\r\n(vi)\r\nwhere applicable, information about which authority is to receive the information about the effect given to the orders;\r\n(b)\r\nthat order only requires the provider to provide information already collected for the purposes of providing the service and which lies within its control;\r\n(c)\r\nthat order is transmitted in one of the languages declared by the provider of intermediary services pursuant to Article 11(3) or in another official language of the Member States, agreed between the authority issuing the order and the provider, and is sent to the electronic point of contact designated by that provider, in accordance with Article 11; where the order is not drafted in the language declared by the provider of intermediary services or in another bilaterally agreed language, the order may be transmitted in the language of the authority issuing the order, provided that it is accompanied by a translation into such declared or bilaterally agreed language of at least the elements set out in points (a) and (b) of this paragraph.\r\n3. The authority issuing the order or, where applicable, the authority specified therein, shall transmit it, along with any information received from the provider of intermediary services concerning the effect given to that order to the Digital Services Coordinator from the Member State of the issuing authority.\r\n4. After receiving the order from the judicial or administrative authority, the Digital Services Coordinator of the Member State concerned shall, without undue delay, transmit a copy of the order referred to in paragraph 1 of this Article to all Digital Services Coordinators through the system established in accordance with Article 85.\r\n5. At the latest when effect is given to the order, or, where applicable, at the time provided by the issuing authority in its order, providers of intermediary services shall inform the recipient of the service concerned of the order received and the effect given to it. Such information provided to the recipient of the service shall include a statement of reasons and the possibilities for redress that exist, in accordance with paragraph 2.\r\n6. The conditions and requirements laid down in this Article shall be without prejudice to national civil and criminal procedural law.\r\n[CHAPTER III]\r\nCHAPTER III\r\nDUE DILIGENCE OBLIGATIONS FOR A TRANSPARENT AND SAFE ONLINE ENVIRONMENT\r\n[SECTION 1]\r\nSECTION 1\r\nProvisions applicable to all providers of intermediary services","FULL_SOURCE_CONTEXT_BEFORE":" transmit it, along with any information received from the provider of intermediary services concerning the effect given to that order to the Digital Services Coordinator from the Member State of the issuing authority.\r\n4. After receiving the order from the judicial or administrative authority, the Digital Services Coordinator of the Member State concerned shall, without undue delay, transmit a copy of the order referred to in paragraph 1 of this Article to all other Digital Services Coordinators through the system established in accordance with Article 85.\r\n5. At the latest when effect is given to the order or, where applicable, at the time provided by the issuing authority in its order, providers of intermediary services shall inform the recipient of the service concerned of the order received and to the effect given to it. Such information provided to the recipient of the service shall include a statement of reasons, the possibilities for redress that exist, and a description of the territorial scope of the order, in accordance with paragraph 2.\r\n6. The conditions and requirements laid down in this Article shall be without prejudice to national civil and criminal procedural law.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 11]\r\nArticle 11\r\nPoints of contact for Member Statesâ€™ authorities, the Commission and the Board\r\n1. Providers of intermediary services shall designate a single point of contact to enable them to communicate directly, by electronic means, with Member Statesâ€™ authorities, the Commission and the Board referred to in Article 61 for the application of this Regulation.\r\n2. Providers of intermediary services shall make public the information necessary to easily identify and communicate with their single points of contact. That information shall be easily accessible, and shall be kept up to date.\r\n3. Providers of intermediary services shall specify in the information referred to in paragraph 2 the official language or languages of the Member States which, in addition to a language broadly understood by the largest possible number of Union citizens, can be used to communicate with their points of contact, and which shall include at least one of the official languages of the Member State in which the provider of intermediary services has its main establishment or where its legal representative resides or is established.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-032","EXTRACTION_ID":"EXT-000504","CASE_ID":"D2_DSA","SOURCE_POINTER":"32022R2065#article_16/p2","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|HIGH|NO|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"the providers of hosting services","LEGAL_ACTION_LUNA":"take the necessary measures to enable and","ACTION_OBJECT_LUNA":"to facilitate the submission of notices containing all of the following elements:","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The mechanisms referred to in paragraph 1 shall be such as to facilitate the submission of sufficiently precise and adequately substantiated notices. To that end, the providers of hosting services shall take the necessary measures to enable and to facilitate the submission of notices containing all of the following elements:","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 16]\r\nArticle 16\r\nNotice and action mechanisms\r\n1. Providers of hosting services shall put mechanisms in place to allow any individual or entity to notify them of the presence on their service of specific items of information that the individual or entity considers to be illegal content. Those mechanisms shall be easy to access and user-friendly, and shall allow for the submission of notices exclusively by electronic means.\r\n2. The mechanisms referred to in paragraph 1 shall be such as to facilitate the submission of sufficiently precise and adequately substantiated notices. To that end, the providers of hosting services shall take the necessary measures to enable and to facilitate the submission of notices containing all of the following elements:\r\n(a)\r\na sufficiently substantiated explanation of the reasons why the individual or entity alleges the information in question to be illegal content;\r\n(b)\r\na clear indication of the exact electronic location of that information, such as the exact URL or URLs, and, where necessary, additional information enabling the identification of the illegal content adapted to the type of content and to the specific type of hosting service;\r\n(c)\r\nthe name and email address of the individual or entity submitting the notice, except in the case of information considered to involve one of the offences referred to in Articles 3 to 7 of Directive 2011/93/EU;\r\n(d)\r\na statement confirming the bona fide belief of the individual or entity submitting the notice that the information and allegations contained therein are accurate and complete.\r\n3. Notices referred to in this Article shall be considered to give rise to actual knowledge or awareness for the purposes of Article 6 in respect of the specific item of information concerned where they allow a diligent provider of hosting services to identify the illegality of the relevant activity or information without a detailed legal examination.\r\n4. Where the notice contains the electronic contact information of the individual or entity that submitted it, the provider of hosting services shall, without undue delay, send a confirmation of receipt of the notice to that individual or entity.\r\n5. The provider shall also, without undue delay, notify that individual or entity of its decision in respect of the information to which the notice relates, providing information on the possibilities for redress in respect of that decision.\r\n6. Providers of hosting services shall process any notices that they receive under the mechanisms referred to in paragraph 1 and take their decisions in respect of the information to which the notices relate, in a timely, diligent, non-arbitrary and objective manner. Where they use automated means for that processing or decision-making, they shall include information on such use in the notification referred to in paragraph 5.","FULL_SOURCE_CONTEXT_BEFORE":" the basis for those complaints, decisions taken in respect of those complaints, the median time needed for taking those decisions and the number of instances where those decisions were reversed;\r\n(e)\r\nany use made of automated means for the purpose of content moderation, including a qualitative description, a specification of the precise purposes, indicators of the accuracy and the possible rate of error of the automated means used in fulfilling those purposes, and any safeguards applied.\r\n2. Paragraph 1 of this Article shall not apply to providers of intermediary services that qualify as micro or small enterprises as defined in Recommendation 2003/361/EC and which are not very large online platforms within the meaning of Article 33 of this Regulation.\r\n3. The Commission may adopt implementing acts to lay down templates concerning the form, content and other details of reports pursuant to paragraph 1 of this Article, including harmonised reporting periods. Those implementing acts shall be adopted in accordance with the advisory procedure referred to in Article 88.\r\n[SECTION 2]\r\nSECTION 2\r\nAdditional provisions applicable to providers of hosting services, including online platforms","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 17]\r\nArticle 17\r\nStatement of reasons\r\n1. Providers of hosting services shall provide a clear and specific statement of reasons to any affected recipients of the service for any of the following restrictions imposed on the ground that the information provided by the recipient of the service is illegal content or incompatible with their terms and conditions:\r\n(a)\r\nany restrictions of the visibility of specific items of information provided by the recipient of the service, including removal of content, disabling access to content, or demoting content;\r\n(b)\r\nsuspension, termination or other restriction of monetary payments;\r\n(c)\r\nsuspension or termination of the provision of the service in whole or in part;\r\n(d)\r\nsuspension or termination of the recipient of the service\u0027s account.\r\n2. Paragraph 1 shall only apply where the relevant electronic contact details are known to the provider. It shall apply at the latest from the date that the restriction is imposed, regardless of why or how it was imposed.\r\nParagraph 1 shall not apply where the information is deceptive high-volume commercial content.\r\n3. The statement of reasons referred to in paragraph 1 shall at least contain the ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-033","EXTRACTION_ID":"EXT-000505"
