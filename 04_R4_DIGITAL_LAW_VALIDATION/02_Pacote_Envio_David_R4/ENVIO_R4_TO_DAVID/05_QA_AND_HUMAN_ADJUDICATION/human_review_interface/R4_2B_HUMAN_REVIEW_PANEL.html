lable to the Commission access to the general-purpose AI model or general-purpose AI model with systemic risk with a view to conducting an evaluation pursuant to Article 92.\r\nIn fixing the amount of the fine or periodic penalty payment, regard shall be had to the nature, gravity and duration of the infringement, taking due account of the principles of proportionality and appropriateness. The Commission shall also into account commitments made in accordance with Article 93(3) or made in relevant codes of practice in accordance with Article 56.\r\n2. Before adopting the decision pursuant to paragraph 1, the Commission shall communicate its preliminary findings to the provider of the general-purpose AI model and give it an opportunity to be heard.\r\n3. Fines imposed in accordance with this Article shall be effective, proportionate and dissuasive.\r\n4. Information on fines imposed under this Article shall also be communicated to the Board as appropriate.\r\n5. The Court of Justice of the European Union shall have unlimited jurisdiction to review decisions of the Commission fixing a fine under this Article. It may cancel, reduce or increase the fine imposed.\r\n6. The Commission shall adopt implementing acts containing detailed arrangements and procedural safeguards for proceedings in view of the possible adoption of decisions pursuant to paragraph 1 of this Article. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 98(2).\r\n[CHAPTER XIII]\r\nCHAPTER XIII\r\nFINAL PROVISIONS","FULL_SOURCE_CONTEXT_BEFORE":"ution, body, office or agency which is the subject of the proceedings conducted by the European Data Protection Supervisor the opportunity of being heard on the matter regarding the possible infringement. The European Data Protection Supervisor shall base his or her decisions only on elements and circumstances on which the parties concerned have been able to comment. Complainants, if any, shall be associated closely with the proceedings.\r\n5. The rights of defence of the parties concerned shall be fully respected in the proceedings. They shall be entitled to have access to the European Data Protection Supervisorâ€™s file, subject to the legitimate interest of individuals or undertakings in the protection of their personal data or business secrets.\r\n6. Funds collected by imposition of fines in this Article shall contribute to the general budget of the Union. The fines shall not affect the effective operation of the Union institution, body, office or agency fined.\r\n7. The European Data Protection Supervisor shall, on an annual basis, notify the Commission of the administrative fines it has imposed pursuant to this Article and of any litigation or judicial proceedings it has initiated.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 102]\r\nArticle 102\r\nAmendment to Regulation (EC) No 300/2008\r\nIn Article 4(3) of Regulation (EC) No 300/2008, the following subparagraph is added:\r\nâ€˜When adopting detailed measures related to technical specifications and procedures for approval and use of security equipment concerning Artificial Intelligence systems within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-075","EXTRACTION_ID":"EXT-000930","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#article_101/p5","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"The Court of Justice of the European Union","LEGAL_ACTION_LUNA":"have unlimited jurisdiction to review decisions of","ACTION_OBJECT_LUNA":"the Commission fixing a fine under this Article. It may cancel, reduce or increase the fine imposed.","COUNTER ticle and of any litigation or judicial proceedings it has initiated.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 102]\r\nArticle 102\r\nAmendment to Regulation (EC) No 300/2008\r\nIn Article 4(3) of Regulation (EC) No 300/2008, the following subparagraph is added:\r\nâ€˜When adopting detailed measures related to technical specifications and procedures for approval and use of security equipment concerning Artificial Intelligence systems within the meaning of Regulation (EU) 2024/1689 of the European Parliament and of the Council (*), the requirements set out in Chapter III, Section 2, of that Regulation shall be taken into account.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-077","EXTRACTION_ID":"EXT-000958","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#article_25/p1","SOURCE_TYPE":"OPERATIVE_ARTICLE","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"OPERATIVE_ARTICLE|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"deployer or other third-party","LEGAL_ACTION_LUNA":"be considered to be a provider of","ACTION_OBJECT_LUNA":"a high-risk AI system ","COUNTERPART_LUNA":"to the obligations of the provider under Article 16","RECIPIENT_LUNA":"to the obligations of the provider under Article 16","SOURCE_EXCERPT":"Any distributor, importer, deployer or other third-party shall be considered to be a provider of a high-risk AI system ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ARTICLE 25]\r\nArticle 25\r\nResponsibilities along the AI value chain\r\n1. Any distributor, importer, deployer or other third-party shall be considered to be a provider of a high-risk AI system for the purposes of this Regulation and shall be subject to the obligations of the provider under Article 16, in any of the following circumstances:\r\n(a)\r\nthey put their name or trademark on a high-risk AI system already placed on the market or put into service, without prejudice to contractual arrangements stipulating that the obligations are otherwise allocated;\r\n(b)\r\nthey make a substantial modification to a high-risk AI system that has already been placed on the market or has already been put into service in such a way that it remains a high-risk AI system pursuant to Article 6;\r\n(c)\r\nthey modify the intended purpose of an AI system, including a general-purpose AI system, which has not been classified as high-risk and has already been placed on the market or put into service in such a way that the AI system concerned becomes a high-risk AI system in accordance with Article 6.\r\n2. Where the circumstances referred to in paragraph 1 occur, the provider that initially placed the AI system on the market or put it into service shall no longer be considered to be a provider of that specific AI system for the purposes of this Regulation. That initial provider shall closely cooperate with new providers and shall make available the necessary information and provide the reasonably expected technical access and other assistance that are required for the fulfilment of the obligations set out in this Regulation, in particular regarding the compliance with the conformity assessment of high-risk AI systems. This paragraph shall not apply in cases where the initial provider has clearly specified that its AI system is not to be changed into a high-risk AI system and therefore does not fall under the obligation to hand over the documentation.\r\n3. In the case of high-risk AI systems that are safety components of products covered by the Union harmonisation legislation listed in Section A of Annex I, the product manufacturer shall be considered to be the provider of the high-risk AI system, and shall be subject to the obligations under Article 16 under either of the following circumstances:\r\n(a)\r\nthe high-risk AI system is placed on the market together with the product under the name or trademark of the product manufacturer;\r\n(b)\r\nthe high-risk AI system is put into service under the name or trademark of the product manufacturer after the product has been placed on the market.\r\n4. The provider of a high-risk AI system and the third party that supplies an AI system, tools, services, components, or processes that are used or integrated in a high-risk AI system shall, by written agreement, specify the necessary information, capabilities, technical access and other assistance based on the generally acknowledged state of the art, in order to enable the provider of the high-risk AI system to fully comply with the obligations set out in this Regulation. This paragraph shall not apply to third parties making accessible to the public tools, services, processes, or components, other than general-purpose AI models, under a free and open-source licence.\r\nThe AI Office may develop and recommend voluntary model terms for contracts between providers of high-risk AI systems and third parties that supply tools, services, components or processes that are used for or integrated into high-risk AI systems. When developing those voluntary model terms, the AI Office shall take into account possible contractual requirements applicable in specific sectors or business cases. The voluntary model terms shall be published and be available free of charge in an easily usable electronic format.\r\n5. Paragraphs 2 and 3 are without prejudice to the need to observe and protect intellectual property rights, confidential business information and trade secrets in accordance with Union and national law.","FULL_SOURCE_CONTEXT_BEFORE":"the requirements set out in Section 2, shall take the corrective actions necessary to bring that system into conformity with those requirements, to withdraw it or recall it, or shall ensure that the provider, the importer or any relevant operator, as appropriate, takes those corrective actions. Where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall immediately inform the provider or importer of the system and the authorities competent for the high-risk AI system concerned, giving details, in particular, of the non-compliance and of any corrective actions taken.\r\n5. Upon a reasoned request from a relevant competent authority, distributors of a high-risk AI system shall provide that authority with all the information and documentation regarding their actions pursuant to paragraphs 1 to 4 necessary to demonstrate the conformity of that system with the requirements set out in Section 2.\r\n6. Distributors shall cooperate with the relevant competent authorities in any action those authorities take in relation to a high-risk AI system made available on the market by the distributors, in particular to reduce or mitigate the risk posed by it.","FULL_SOURCE_CONTEXT_AFTER":"[ARTICLE 26]\r\nArticle 26\r\nObligations of deployers of high-risk AI systems\r\n1. Deployers of high-risk AI systems shall take appropriate technical and organisational measures to ensure they use such systems in accordance with the instructions for use accompanying the systems, pursuant to paragraphs 3 and 6.\r\n2. Deployers shall assign human oversight to natural persons who have the necessary competence, training and authority, as well as the necessary support.\r\n3. The obligations set out in paragraphs 1 and 2, are without prejudice to other deployer obligations under Union or national law and to the deployerâ€™s freedom to organise its own resources and activities for the purpose of implementing the human oversight measures indicated by the provider.\r\n4. Without prejudice to paragraphs 1 and 2, to the extent the deployer exercises control over the input data, that deployer shall ensure that input data is relevant and sufficiently representative in view of the intended purpose of the high-risk AI system.\r\n5. Deployers shall monitor the operation of the high-risk AI system on the basis of the instructions for use and, where relevant, inform providers in accordance with Article 72. Wher","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-078","EXTRACTION_ID":"EXT-001398","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_87","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"the product manufacturer defined in that legislation","LEGAL_ACTION_LUNA":"comply with the obligations of the provider","ACTION_OBJECT_LUNA":"established in this Regulation and should, in particular, ensure that the AI system embedded in the final product complies with the requirements of this Regulation.","COUNTERPART_LUNA":"from the product","RECIPIENT_LUNA":"from the product","SOURCE_EXCERPT":"In addition, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 87]\r\n(87)\r\nIn addition, where a high-risk AI system that is a safety component of a product which falls within the scope of Union harmonisation legislation based on the New Legislative Framework is not placed on the market or put into service independently from the product, the product manufacturer defined in that legislation should comply with the obligations of the provider established in this Regulation and should, in particular, ensure that the AI system embedded in the final product complies with the requirements of this Regulation.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 86]\r\n(86)\r\nWhere, under the conditions laid down in this Regulation, the provider that initially placed the AI system on the market or put it into service should no longer be considered to be the provider for the purposes of this Regulation, and when that provider has not expressly excluded the change of the AI system into a high-risk AI system, the former provider should nonetheless closely cooperate and make available the necessary information and provide the reasonably expected technical access and other assistance that are required for the fulfilment of the obligations set out in this Regulation, in particular regarding the compliance with the conformity assessment of high-risk AI systems.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 88]\r\n(88)\r\nAlong the AI value chain multiple parties often supply AI systems, tools and services but also components or processes that are incorporated by the provider into the AI system with various objectives, including the model training, model retraining, model testing and evaluation, integration into software, or other aspects of model development. Those parties have an important role to play in the value chain towards the provider of the high-risk AI system into which their AI systems, tools, services, components or processes are integrated, and should provide by written agreement this provider with the necessary information, capabilities, technical access and other assistance based on the generally acknowledged state of the art, in order to enable the provider to fully comply with the obligations set out in this Regulation, without compromising their own intellectual property rights or trade secrets.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-079","EXTRACTION_ID":"EXT-001400","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_90","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"HIGH","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|HIGH|NO|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"the Commission","LEGAL_ACTION_LUNA":"also take into account possible contractual requirements","ACTION_OBJECT_LUNA":"applicable in specific sectors or business cases.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"The Commission could develop and recommend voluntary model contractual terms between providers of high-risk AI systems and third parties that supply tools, services, components or processes that are used or integrated in high-risk AI systems, to facilitate the cooperation along the value chain. When developing voluntary model contractual terms, the Commission should also take into account possible contractual requirements applicable in specific sectors or business cases.","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 90]\r\n(90)\r\nThe Commission could develop and recommend voluntary model contractual terms between providers of high-risk AI systems and third parties that supply tools, services, components or processes that are used or integrated in high-risk AI systems, to facilitate the cooperation along the value chain. When developing voluntary model contractual terms, the Commission should also take into account possible contractual requirements applicable in specific sectors or business cases.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 89]\r\n(89)\r\nThird parties making accessible to the public tools, services, processes, or AI components other than general-purpose AI models, should not be mandated to comply with requirements targeting the responsibilities along the AI value chain, in particular towards the provider that has used or integrated them, when those tools, services, processes, or AI components are made accessible under a free and open-source licence. Developers of free and open-source tools, services, processes, or AI components other than general-purpose AI models should be encouraged to implement widely adopted documentation practices, such as model cards and data sheets, as a way to accelerate information sharing along the AI value chain, allowing the promotion of trustworthy AI systems in the Union.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 91]\r\n(91)\r\nGiven the nature of AI systems and the risks to safety and fundamental rights possibly associated with their use, including as regards the need to ensure proper monitoring of the performance of an AI system in a real-life setting, it is appropriate to set specific responsibilities for deployers. Deployers should in particular take appropriate technical and organisational measures to ensure they use high-risk AI systems in accordance with the instructions of use and certain other obligations should be provided for with regard to monitoring of the functioning of the AI systems and with regard to record-keeping, as appropriate. Furthermore, deployers should ensure that the persons assigned to implement the instructions for use and human oversight as set out in this Regulation have the necessary competence, in particular an adequate level of AI literacy, training and authority to properly fulfil those tasks. Those obligations should be without prejudice to other deployer obligations in relation to high-risk AI systems under Union or national law.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-080","EXTRACTION_ID":"EXT-001286","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_127","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|MEDIUM|NO|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"the Commission","LEGAL_ACTION_LUNA":"actively explore possible international instruments for that","ACTION_OBJECT_LUNA":"purpose and in particular pursue the conclusion of mutual recognition agreements with third countries.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"In line with Union commitments under the World Trade Organization Agreement on Technical Barriers to Trade, it is adequate to facilitate the mutual recognition of conformity assessment results produced by competent conformity assessment bodies, independent of the territory in which they are established, ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 127]\r\n(127)\r\nIn line with Union commitments under the World Trade Organization Agreement on Technical Barriers to Trade, it is adequate to facilitate the mutual recognition of conformity assessment results produced by competent conformity assessment bodies, independent of the territory in which they are established, provided that those conformity assessment bodies established under the law of a third country meet the applicable requirements of this Regulation and the Union has concluded an agreement to that extent. In this context, the Commission should actively explore possible international instruments for that purpose and in particular pursue the conclusion of mutual recognition agreements with third countries.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 126]\r\n(126)\r\nIn order to carry out third-party conformity assessments when so required, notified bodies should be notified under this Regulation by the national competent authorities, provided that they comply with a set of requirements, in particular on independence, competence, absence of conflicts of interests and suitable cybersecurity requirements. Notification of those bodies should be sent by national competent authorities to the Commission and the other Member States by means of the electronic notification tool developed and managed by the Commission pursuant to Article R23 of Annex I to Decision No 768/2008/EC.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 128]\r\n(128)\r\nIn line with the commonly established notion of substantial modification for products regulated by Union harmonisation legislation, it is appropriate that whenever a change occurs which may affect the compliance of a high-risk AI system with this Regulation (e.g. change of operating system or software architecture), or when the intended purpose of the system changes, that AI system should be considered to be a new AI system which should undergo a new conformity assessment. However, changes occurring to the algorithm and the performance of AI systems which continue to â€˜learnâ€™ after being placed on the market or put into service, namely automatically adapting how functions are carried out, should not constitute a substantial modification, provided that those changes have been pre-determined by the provider and assessed at the moment of the conformity assessment.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-081","EXTRACTION_ID":"EXT-001295","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_135","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"MEDIUM","STRUCTURAL_AMBIGUITY":"NO","SAMPLING_STRATUM":"RECITAL|MEDIUM|NO|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"the Commission","LEGAL_ACTION_LUNA":"also encourage and facilitate the drawing up","ACTION_OBJECT_LUNA":"of codes of practice at Union level to facilitate the effective implementation of the obligations regarding the detection and labelling of artificially generated or manipulated conâ€¦","COUNTERPART_LUNA":"to the mandatory nature and full applicability of the transparency obligations","RECIPIENT_LUNA":"to the mandatory nature and full applicability of the transparency obligations","SOURCE_EXCERPT":"Without prejudice to the mandatory nature and full applicability of the transparency obligations, the Commission may also encourage and facilitate the drawing up of codes of practice at Union level to facilitate the effective implementation of the obligations regarding the detection and labelling of artificially generated or manipulated content, including to support practical arrangements for making, as appropriate, the detection mechanisms accessible and facilitating cooperation with other actoâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 135]\r\n(135)\r\nWithout prejudice to the mandatory nature and full applicability of the transparency obligations, the Commission may also encourage and facilitate the drawing up of codes of practice at Union level to facilitate the effective implementation of the obligations regarding the detection and labelling of artificially generated or manipulated content, including to support practical arrangements for making, as appropriate, the detection mechanisms accessible and facilitating cooperation with other actors along the value chain, disseminating content or checking its authenticity and provenance to enable the public to effectively distinguish AI-generated content.","FULL_SOURCE_CONTEXT_BEFORE":"arency obligation should not be interpreted as indicating that the use of the AI system or its output impedes the right to freedom of expression and the right to freedom of the arts and sciences guaranteed in the Charter, in particular where the content is part of an evidently creative, satirical, artistic, fictional or analogous work or programme, subject to appropriate safeguards for the rights and freedoms of third parties. In those cases, the transparency obligation for deep fakes set out in this Regulation is limited to disclosure of the existence of such generated or manipulated content in an appropriate manner that does not hamper the display or enjoyment of the work, including its normal exploitation and use, while maintaining the utility and quality of the work. In addition, it is also appropriate to envisage a similar disclosure obligation in relation to AI-generated or manipulated text to the extent it is published with the purpose of informing the public on matters of public interest unless the AI-generated content has undergone a process of human review or editorial control and a natural or legal person holds editorial responsibility for the publication of the content.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 136]\r\n(136)\r\nThe obligations placed on providers and deployers of certain AI systems in this Regulation to enable the detection and disclosure that the outputs of those systems are artificially generated or manipulated are particularly relevant to facilitate the effective implementation of Regulation (EU) 2022/2065. This applies in particular as regards the obligations of providers of very large online platforms or very large online search engines to identify and mitigate systemic risks that may arise from the dissemination of content that has been artificially generated or manipulated, in particular the risk of the actual or foreseeable negative effects on democratic processes, civic discourse and electoral processes, including through disinformation. The requirement to label content generated by AI systems under this Regulation is without prejudice to the obligation in Article 16(6) of Regulation (EU) 2022/2065 for providers of hosting services to process notices on illegal content received pursuant to Article 16(1) of that Regulation and should not influence the assessment and the decision on the illegality of the specific content. That assessment should be performed so","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-082","EXTRACTION_ID":"EXT-001262","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_101","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|COUNTERPART_OR_RECIPIENT","ACTOR_TEXT_LUNA":"The Commission","LEGAL_ACTION_LUNA":"be empowered to amend those annexes by","ACTION_OBJECT_LUNA":"means of delegated acts in light of evolving technological developments.","COUNTERPART_LUNA":"to the AI Office and the national competent authorities","RECIPIENT_LUNA":"to the AI Office and the national competent authorities","SOURCE_EXCERPT":"Providers of general-purpose AI models have a particular role and responsibility along the AI value chain, as the models they provide may form the basis for a range of downstream systems, often provided by downstream providers that necessitate a good understanding of the models and their capabilities, both to enable the integration of such models into their products, and to fulfil their obligations under this or other regulations. Therefore, proportionate transparency measures should be laid dowâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"COUNTERPART_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 101]\r\n(101)\r\nProviders of general-purpose AI models have a particular role and responsibility along the AI value chain, as the models they provide may form the basis for a range of downstream systems, often provided by downstream providers that necessitate a good understanding of the models and their capabilities, both to enable the integration of such models into their products, and to fulfil their obligations under this or other regulations. Therefore, proportionate transparency measures should be laid down, including the drawing up and keeping up to date of documentation, and the provision of information on the general-purpose AI model for its usage by the downstream providers. Technical documentation should be prepared and kept up to date by the general-purpose AI model provider for the purpose of making it available, upon request, to the AI Office and the national competent authorities. The minimal set of elements to be included in such documentation should be set out in specific annexes to this Regulation. The Commission should be empowered to amend those annexes by means of delegated acts in light of evolving technological developments.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 100]\r\n(100)\r\nWhen a general-purpose AI model is integrated into or forms part of an AI system, this system should be considered to be general-purpose AI system when, due to this integration, this system has the capability to serve a variety of purposes. A general-purpose AI system can be used directly, or it may be integrated into other AI systems.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 102]\r\n(102)\r\nSoftware and data, including models, released under a free and open-source licence that allows them to be openly shared and where users can freely access, use, modify and redistribute them or modified versions thereof, can contribute to research and innovation in the market and can provide significant growth opportunities for the Union economy. General-purpose AI models released under free and open-source licences should be considered to ensure high levels of transparency and openness if their parameters, including the weights, the information on the model architecture, and the information on model usage are made publicly available. The licence should be considered to be free and open-source also when it allows users to run, copy, distribute, study, change and improve software and data, including models under the condition that the original provider of the model is credited, the identical or comparable terms of distribution are respected.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-083","EXTRACTION_ID":"EXT-001263","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_106","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"field among providers of general-purpose AI models where no provider","LEGAL_ACTION_LUNA":"be able to gain a competitive advantage","ACTION_OBJECT_LUNA":"in the Union market by applying lower copyright standards than those provided in the Union.","COUNTERPART_LUNA":"with the relevant obligations in this Regulation","RECIPIENT_LUNA":"with the relevant obligations in this Regulation","SOURCE_EXCERPT":"Providers that place general-purpose AI models on the Union market should ensure compliance with the relevant obligations in this Regulation. To that end, providers of general-purpose AI models should put in place a policy to comply with Union law on copyright and related rights, in particular to identify and comply with the reservation of rights expressed by rightsholders pursuant to Article 4(3) of Directive (EU) 2019/790. Any provider placing a general-purpose AI model on the Union market shoâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 106]\r\n(106)\r\nProviders that place general-purpose AI models on the Union market should ensure compliance with the relevant obligations in this Regulation. To that end, providers of general-purpose AI models should put in place a policy to comply with Union law on copyright and related rights, in particular to identify and comply with the reservation of rights expressed by rightsholders pursuant to Article 4(3) of Directive (EU) 2019/790. Any provider placing a general-purpose AI model on the Union market should comply with this obligation, regardless of the jurisdiction in which the copyright-relevant acts underpinning the training of those general-purpose AI models take place. This is necessary to ensure a level playing field among providers of general-purpose AI models where no provider should be able to gain a competitive advantage in the Union market by applying lower copyright standards than those provided in the Union.","FULL_SOURCE_CONTEXT_BEFORE":"ists, authors, and other creators and the way their creative content is created, distributed, used and consumed. The development and training of such models require access to vast amounts of text, images, videos and other data. Text and data mining techniques may be used extensively in this context for the retrieval and analysis of such content, which may be protected by copyright and related rights. Any use of copyright protected content requires the authorisation of the rightsholder concerned unless relevant copyright exceptions and limitations apply. Directive (EU) 2019/790 introduced exceptions and limitations allowing reproductions and extractions of works or other subject matter, for the purpose of text and data mining, under certain conditions. Under these rules, rightsholders may choose to reserve their rights over their works or other subject matter to prevent text and data mining, unless this is done for the purposes of scientific research. Where the rights to opt out has been expressly reserved in an appropriate manner, providers of general-purpose AI models need to obtain an authorisation from rightsholders if they want to carry out text and data mining over such works.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 107]\r\n(107)\r\nIn order to increase transparency on the data that is used in the pre-training and training of general-purpose AI models, including text and data protected by copyright law, it is adequate that providers of such models draw up and make publicly available a sufficiently detailed summary of the content used for training the general-purpose AI model. While taking into due account the need to protect trade secrets and confidential business information, this summary should be generally comprehensive in its scope instead of technically detailed to facilitate parties with legitimate interests, including copyright holders, to exercise and enforce their rights under Union law, for example by listing the main data collections or sets that went into training the model, such as large private or public databases or data archives, and by providing a narrative explanation about other data sources used. It is appropriate for the AI Office to provide a template for the summary, which should be simple, effective, and allow the provider to provide the required summary in narrative form.","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-084","EXTRACTION_ID":"EXT-001267","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_109","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTIONS","ACTOR_TEXT_LUNA":"the obligations applicable to the providers of general-purpose AI models","LEGAL_ACTION_LUNA":"be commensurate and proportionate to the type","ACTION_OBJECT_LUNA":"of model provider, excluding the need for compliance for persons who develop or use models for non-professional or scientific research purposes, who should nevertheless be encouragâ€¦","COUNTERPART_LUNA":"with the obligations applicable to the providers of general-purpose AI models should be commensurate and pro","RECIPIENT_LUNA":"with the obligations applicable to the providers of general-purpose AI models should be commensurate and pro","SOURCE_EXCERPT":"Compliance with the obligations applicable to the providers of general-purpose AI models should be commensurate and proportionate to the type of model provider, excluding the need for compliance for persons who develop or use models for non-professional or scientific research purposes, who should nevertheless be encouraged to voluntarily comply with these requirements. Without prejudice to Union copyright law, compliance with those obligations should take due account of the size of the providerâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTION_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 109]\r\n(109)\r\nCompliance with the obligations applicable to the providers of general-purpose AI models should be commensurate and proportionate to the type of model provider, excluding the need for compliance for persons who develop or use models for non-professional or scientific research purposes, who should nevertheless be encouraged to voluntarily comply with these requirements. Without prejudice to Union copyright law, compliance with those obligations should take due account of the size of the provider and allow simplified ways of compliance for SMEs, including start-ups, that should not represent an excessive cost and not discourage the use of such models. In the case of a modification or fine-tuning of a model, the obligations for providers of general-purpose AI models should be limited to that modification or fine-tuning, for example by complementing the already existing technical documentation with information on the modifications, including new training data sources, as a means to comply with the value chain obligations provided in this Regulation.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 108]\r\n(108)\r\nWith regard to the obligations imposed on providers of general-purpose AI models to put in place a policy to comply with Union copyright law and make publicly available a summary of the content used for the training, the AI Office should monitor whether the provider has fulfilled those obligations without verifying or proceeding to a work-by-work assessment of the training data in terms of copyright compliance. This Regulation does not affect the enforcement of copyright rules as provided for under Union law.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 110]\r\n(110)\r\nGeneral-purpose AI models could pose systemic risks which include, but are not limited to, any actual or reasonably foreseeable negative effects in relation to major accidents, disruptions of critical sectors and serious consequences to public health and safety; any actual or reasonably foreseeable negative effects on democratic processes, public and economic security; the dissemination of illegal, false, or discriminatory content. Systemic risks should be understood to increase with model capabilities and model reach, can arise along the entire lifecycle of the model, and are influenced by conditions of misuse, model reliability, model fairness and model security, the level of autonomy of the model, its access to tools, novel or combined modalities, release and distribution strategies, the potential to remove guardrails and other factors. In particular, international approaches have so far identified the need to pay attention to risks from potential intentional misuse or unintended issues of control relating to alignment with human intent; chemical, biological, radiological, and nuclear risks, such as the ways in which barriers to entry can be lowered, includ","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-085","EXTRACTION_ID":"EXT-001269","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_111","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|MULTIPLE_ACTORS","ACTOR_TEXT_LUNA":"the Commission should take the request into account and","LEGAL_ACTION_LUNA":"issue, adopt or make decision","ACTION_OBJECT_LUNA":"model can still be considered to present systemic risks.","COUNTERPART_LUNA":"with the model","RECIPIENT_LUNA":"with the model","SOURCE_EXCERPT":"It is appropriate to establish a methodology for the classification of general-purpose AI models as general-purpose AI model with systemic risks. Since systemic risks result from particularly high capabilities, a general-purpose AI model should be considered to present systemic risks ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"MULTI_ACTOR_PROVISION","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 111]\r\n(111)\r\nIt is appropriate to establish a methodology for the classification of general-purpose AI models as general-purpose AI model with systemic risks. Since systemic risks result from particularly high capabilities, a general-purpose AI model should be considered to present systemic risks if it has high-impact capabilities, evaluated on the basis of appropriate technical tools and methodologies, or significant impact on the internal market due to its reach. High-impact capabilities in general-purpose AI models means capabilities that match or exceed the capabilities recorded in the most advanced general-purpose AI models. The full range of capabilities in a model could be better understood after its placing on the market or when deployers interact with the model. According to the state of the art at the time of entry into force of this Regulation, the cumulative amount of computation used for the training of the general-purpose AI model measured in floating point operations is one of the relevant approximations for model capabilities. The cumulative amount of computation used for training includes the computation used across the activities and methods that are intended to enhance the capabilities of the model prior to deployment, such as pre-training, synthetic data generation and fine-tuning. Therefore, an initial threshold of floating point operations should be set, which, if met by a general-purpose AI model, leads to a presumption that the model is a general-purpose AI model with systemic risks. This threshold should be adjusted over time to reflect technological and industrial changes, such as algorithmic improvements or increased hardware efficiency, and should be supplemented with benchmarks and indicators for model capability. To inform this, the AI Office should engage with the scientific community, industry, civil society and other experts. Thresholds, as well as tools and benchmarks for the assessment of high-impact capabilities, should be strong predictors of generality, its capabilities and associated systemic risk of general-purpose AI models, and could take into account the way the model will be placed on the market or the number of users it may affect. To complement this system, there should be a possibility for the Commission to take individual decisions designating a general-purpose AI model as a general-purpose AI model with systemic risk if it is found that such model has capabilities or an impact equivalent to those captured by the set threshold. That decision should be taken on the basis of an overall assessment of the criteria for the designation of a general-purpose AI model with systemic risk set out in an annex to this Regulation, such as quality or size of the training data set, number of business and end users, its input and output modalities, its level of autonomy and scalability, or the tools it has access to. Upon a reasoned request of a provider whose model has been designated as a general-purpose AI model with systemic risk, the Commission should take the request into account and may decide to reassess whether the general-purpose AI model can still be considered to present systemic risks.","FULL_SOURCE_CONTEXT_BEFORE":"rdrails and other factors. In particular, international approaches have so far identified the need to pay attention to risks from potential intentional misuse or unintended issues of control relating to alignment with human intent; chemical, biological, radiological, and nuclear risks, such as the ways in which barriers to entry can be lowered, including for weapons development, design acquisition, or use; offensive cyber capabilities, such as the ways in vulnerability discovery, exploitation, or operational use can be enabled; the effects of interaction and tool use, including for example the capacity to control physical systems and interfere with critical infrastructure; risks from models of making copies of themselves or â€˜self-replicatingâ€™ or training other models; the ways in which models can give rise to harmful bias and discrimination with risks to individuals, communities or societies; the facilitation of disinformation or harming privacy with threats to democratic values and human rights; risk that a particular event could lead to a chain reaction with considerable negative effects that could affect up to an entire city, an entire domain activity or an entire community.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 112]\r\n(112)\r\nIt is also necessary to clarify a procedure for the classification of a general-purpose AI model with systemic risks. A general-purpose AI model that meets the applicable threshold for high-impact capabilities should be presumed to be a general-purpose AI models with systemic risk. The provider should notify the AI Office at the latest two weeks after the requirements are met or it becomes known that a general-purpose AI model will meet the requirements that lead to the presumption. This is especially relevant in relation to the threshold of floating point operations because training of general-purpose AI models takes considerable planning which includes the upfront allocation of compute resources and, therefore, providers of general-purpose AI models are able to know if their model would meet the threshold before the training is completed. In the context of that notification, the provider should be able to demonstrate that, because of its specific characteristics, a general-purpose AI model exceptionally does not present systemic risks, and that it thus should not be classified as a general-purpose AI model with systemic risks. That information is valuable fo","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-086","EXTRACTION_ID":"EXT-001297","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_138","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|SINGLE_ACTOR_SINGLE_ACTION","ACTOR_TEXT_LUNA":"Establishing authorities","LEGAL_ACTION_LUNA":"also ensure that the AI regulatory sandboxes","ACTION_OBJECT_LUNA":"have the adequate resources for their functioning, including financial and human resources.","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"AI is a rapidly developing family of technologies that requires regulatory oversight and a safe and controlled space for experimentation, while ensuring responsible innovation and integration of appropriate safeguards and risk mitigation measures. To ensure a legal framework that promotes innovation, is future-proof and resilient to disruption, Member States should ensure that their national competent authorities establish at least one AI regulatory sandbox at national level to facilitate the deâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_SCOPE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 138]\r\n(138)\r\nAI is a rapidly developing family of technologies that requires regulatory oversight and a safe and controlled space for experimentation, while ensuring responsible innovation and integration of appropriate safeguards and risk mitigation measures. To ensure a legal framework that promotes innovation, is future-proof and resilient to disruption, Member States should ensure that their national competent authorities establish at least one AI regulatory sandbox at national level to facilitate the development and testing of innovative AI systems under strict regulatory oversight before these systems are placed on the market or otherwise put into service. Member States could also fulfil this obligation through participating in already existing regulatory sandboxes or establishing jointly a sandbox with one or more Member Statesâ€™ competent authorities, insofar as this participation provides equivalent level of national coverage for the participating Member States. AI regulatory sandboxes could be established in physical, digital or hybrid form and may accommodate physical as well as digital products. Establishing authorities should also ensure that the AI regulatory sandboxes have the adequate resources for their functioning, including financial and human resources.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 137]\r\n(137)\r\nCompliance with the transparency obligations for the AI systems covered by this Regulation should not be interpreted as indicating that the use of the AI system or its output is lawful under this Regulation or other Union and Member State law and should be without prejudice to other transparency obligations for deployers of AI systems laid down in Union or national law.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 139]\r\n(139)\r\nThe objectives of the AI regulatory sandboxes should be to foster AI innovation by establishing a controlled experimentation and testing environment in the development and pre-marketing phase with a view to ensuring compliance of the innovative AI systems with this Regulation and other relevant Union and national law. Moreover, the AI regulatory sandboxes should aim to enhance legal certainty for innovators and the competent authoritiesâ€™ oversight and understanding of the opportunities, emerging risks and the impacts of AI use, to facilitate regulatory learning for authorities and undertakings, including with a view to future adaptions of the legal framework, to support cooperation and the sharing of best practices with the authorities involved in the AI regulatory sandbox, and to accelerate access to markets, including by removing barriers for SMEs, including start-ups. AI regulatory sandboxes should be widely available throughout the Union, and particular attention should be given to their accessibility for SMEs, including start-ups. The participation in the AI regulatory sandbox should focus on issues that raise legal uncertainty for providers and prospec","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-087","EXTRACTION_ID":"EXT-001298","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#recital_138","SOURCE_TYPE":"RECITAL","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"RECITAL|LOW|YES|ACTOR_NORMALIZATION_CASE","ACTOR_TEXT_LUNA":"Member States","LEGAL_ACTION_LUNA":"ensure or safeguard","ACTION_OBJECT_LUNA":"at least one AI regulatory sandbox at national level to facilitate the development and testing of innovative AI systems under strict regulatory oversight before these systems are pâ€¦","COUNTERPART_LUNA":"","RECIPIENT_LUNA":"","SOURCE_EXCERPT":"AI is a rapidly developing family of technologies that requires regulatory oversight and a safe and controlled space for experimentation, while ensuring responsible innovation and integration of appropriate safeguards and risk mitigation measures. To ensure a legal framework that promotes innovation, is future-proof and resilient to disruption, Member States should ensure that their national competent authorities establish at least one AI regulatory sandbox at national level to facilitate the deâ€¦","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_TRUNCATED_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"ACTION_OBJECT_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[RECITAL 138]\r\n(138)\r\nAI is a rapidly developing family of technologies that requires regulatory oversight and a safe and controlled space for experimentation, while ensuring responsible innovation and integration of appropriate safeguards and risk mitigation measures. To ensure a legal framework that promotes innovation, is future-proof and resilient to disruption, Member States should ensure that their national competent authorities establish at least one AI regulatory sandbox at national level to facilitate the development and testing of innovative AI systems under strict regulatory oversight before these systems are placed on the market or otherwise put into service. Member States could also fulfil this obligation through participating in already existing regulatory sandboxes or establishing jointly a sandbox with one or more Member Statesâ€™ competent authorities, insofar as this participation provides equivalent level of national coverage for the participating Member States. AI regulatory sandboxes could be established in physical, digital or hybrid form and may accommodate physical as well as digital products. Establishing authorities should also ensure that the AI regulatory sandboxes have the adequate resources for their functioning, including financial and human resources.","FULL_SOURCE_CONTEXT_BEFORE":"[RECITAL 137]\r\n(137)\r\nCompliance with the transparency obligations for the AI systems covered by this Regulation should not be interpreted as indicating that the use of the AI system or its output is lawful under this Regulation or other Union and Member State law and should be without prejudice to other transparency obligations for deployers of AI systems laid down in Union or national law.","FULL_SOURCE_CONTEXT_AFTER":"[RECITAL 139]\r\n(139)\r\nThe objectives of the AI regulatory sandboxes should be to foster AI innovation by establishing a controlled experimentation and testing environment in the development and pre-marketing phase with a view to ensuring compliance of the innovative AI systems with this Regulation and other relevant Union and national law. Moreover, the AI regulatory sandboxes should aim to enhance legal certainty for innovators and the competent authoritiesâ€™ oversight and understanding of the opportunities, emerging risks and the impacts of AI use, to facilitate regulatory learning for authorities and undertakings, including with a view to future adaptions of the legal framework, to support cooperation and the sharing of best practices with the authorities involved in the AI regulatory sandbox, and to accelerate access to markets, including by removing barriers for SMEs, including start-ups. AI regulatory sandboxes should be widely available throughout the Union, and particular attention should be given to their accessibility for SMEs, including start-ups. The participation in the AI regulatory sandbox should focus on issues that raise legal uncertainty for providers and prospec","SOURCE_RESOLUTION_STATUS":"RESOLVED_FROM_FROZEN_PROCESSING_CORPUS","HUMAN_NOTES":""},{"QA_ID":"QA2B-088","EXTRACTION_ID":"EXT-000910","CASE_ID":"D3_AI_ACT","SOURCE_POINTER":"32024R1689#annex_VII","SOURCE_TYPE":"ANNEX","EXTRACTION_CONFIDENCE":"LOW","STRUCTURAL_AMBIGUITY":"YES","SAMPLING_STRATUM":"ANNEX|LOW|YES|CROSS_REFERENCED_PROVISION","ACTOR_TEXT_LUNA":"an application with a notified body of their choice","LEGAL_ACTION_LUNA":"be lodged by the provider for the","ACTION_OBJECT_LUNA":"assessment of the technical documentation relating to the AI system which the provider intends to place on the market or put into service and which is covered by the quality manageâ€¦","COUNTERPART_LUNA":"with any other notified body","RECIPIENT_LUNA":"with any other notified body","SOURCE_EXCERPT":"Conformity based on an assessment of the quality management system and an assessment of the technical documentation 1. Introduction Conformity based on an assessment of the quality management system and an assessment of the technical documentation is the conformity assessment procedure based on points 2 to 5. 2. Overview The approved quality management system for the design, development and testing of AI systems pursuant to Article 17 shall be examined ","SOURCE_TEXT_CHECKED":"YES_MECHANICAL; HUMAN_CONFIRMATION_PENDING","ACTOR_CORRECT":"","ACTION_CORRECT":"","OBJECT_CORRECT":"","COUNTERPART_CORRECT":"","RECIPIENT_CORRECT":"","SOURCE_POINTER_CORRECT":"","EXCERPT_CORRECT":"","AMBIGUITY_JUSTIFIED":"","ERROR_TYPE":"","HUMAN_CORRECTION":"","HUMAN_REVIEWER":"","HUMAN_REVIEW_STATUS":"PENDING","NOTES":"AI-assisted pre-review only; do not treat as human adjudication. Mechanical checks: pointer=YES; excerpt=YES_EXACT_MECHANICAL. R/I/T and mechanism review prohibited.","CURRENT_AMBIGUITY_TYPE":"CROSS_REFERENCE_AMBIGUITY","STRUCTURAL_NOTE":"","FULL_SOURCE_TEXT":"[ANNEX VII]\r\nANNEX VII\r\nConformity based on an assessment of the quality management system and an assessment of the technical documentation\r\n1. Introduction\r\nConformity based on an assessment of the quality management system and an assessment of the technical documentation is the conformity assessment procedure based on points 2 to 5.\r\n2. Overview\r\nThe approved quality management system for the design, development and testing of AI systems pursuant to Article 17 shall be examined in accordance with point 3 and shall be subject to surveillance as specified in point 5. The technical documentation of the AI system shall be examined in accordance with point 4.\r\n3. Quality management system\r\n3.1.\r\n(a)\r\nthe name and address of the provider and, if the application is lodged by an authorised representative, also their name and address;\r\n(b)\r\nthe list of AI systems covered under the same quality management system;\r\n(c)\r\nthe technical documentation for each AI system covered under the same quality management system;\r\n(d)\r\nthe documentation concerning the quality management system which shall cover all the aspects listed under Article 17;\r\n(e)\r\na description of the procedures in place to ensure that the quality management system remains adequate and effective;\r\n(f)\r\na written declaration that the same application has not been lodged with any other notified body.\r\n3.2.\r\nThe decision shall be notified to the provider or its authorised representative.\r\nThe notification shall contain the conclusions of the assessment of the quality management system and the reasoned assessment decision.\r\n3.3.\r\nThe quality management system as approved shall continue to be implemented and maintained by the provider so that it remains adequate and efficient.\r\n3.4.\r\nThe proposed changes shall be examined by the notified body, which shall decide whether the modified quality management system continues to satisfy the requirements referred to in point 3.2 or whether a reassessment is necessary.\r\nThe notified body shall notify the provider of its decision. The notification shall contain the conclusions of the examination of the changes and the reasoned assessment decision.\r\n4. Control of the technical documentation.\r\n4.1.\r\nIn addition to the application referred to in point 3, an application with a notified body of their choice shall be lodged by the provider for the assessment of the technical documentation relating to the AI system which the provider intends to place on the market or put into service and which is covered by the quality management system referred to under point 3.\r\n4.2.\r\n(a)\r\nthe name and address of the provider;\r\n(b)\r\na written declaration that the same application has not been lodged with any other notified body;\r\n(c)\r\nthe technical documentation referred to in Annex IV.\r\n4.3.\r\nThe technical documentation shall be examined by the notified body. Where relevant, and limited to what is necessary to fulfil its tasks, the notified body shall be granted full access to the training, validation, and testing data sets used, including, where appropriate and subject to security safeguards, through API or other relevant technical means and tools enabling remote access.\r\n4.4.\r\nIn examining the technical documentation, the notified body may require that the provider supply further evidence or carry out further tests so as to enable a proper assessment of the conformity of the AI system with the requirements set out in Chapter III, Section 2. Where the notified body is not satisfied with the tests carried out by the provider, the notified body shall itself directly carry out adequate tests, as appropriate.\r\n4.5.\r\nWhere necessary to assess the conformity of the high-risk AI system with the requirements set out in Chapter III, Section 2, after all other reasonable means to verify conformity have been exhausted and have proven to be insufficient, and upon a reasoned request, the notified body shall also be granted access to the training and trained models of the AI system, including its relevant parameters. Such access shall be subject to existing Union law on the protection of intellectual property and trade secrets.\r\n4.6.\r\nWhere the AI system is in conformity with the requirements set out in Chapter III, Section 2, the notified body shall issue a Union technical documentation assessment certificate. The certificate shall indicate the name and address of the provider, the conclusions of the examination, the conditions (if any) for its validity and the data necessary for the identification of the AI system.\r\nThe certificate and its annexes shall contain all relevant information to allow the conformity of the AI system to be evaluated, and to allow for control of the AI system while in use, where applicable.\r\nWhere the AI system is not in conformity with the requirements set out in Chapter III, Section 2, the notified body shall refuse to issue a Union technical documentation assessment certificate and shall inform the applicant accordingly, giving detailed reasons for its refusal.\r\nWhere the AI system does not meet the requirement relating to the data used to train it, re-training of the AI system will be needed prior to the application for a new conformity assessment. In this case, the reasoned assessment decision of the notified body refusing to issue the Union technical documentation assessment certificate shall contain specific considerations on the quality data used to train the AI system, in particular on the reasons for non-compliance.\r\n4.7.\r\nAny change to the AI system that could affect the compliance of the AI system with the requirements or its intended purpose shall be assessed by the notified body which issued the Union technical documentation assessment certificate. The provider shall inform such notified body of its intention to introduce any of the abovementioned changes, or if it otherwise becomes aware of the occurrence of such changes. The intended changes shall be assessed by the notified body, which shall decide whether those changes require a new conformity assessment in accordance with Article 43(4) or whether they could be addressed by means of a supplement to the Union technical documentation assessment certificate. In the latter case, the notified body shall assess the changes, notify the provider of its decision and, where the changes are approved, issue to the provider a supplement to the Union technical documentation assessment certificate.\r\n5. Surveillance of the approved quality management system.\r\n5.1.\r\nThe purpose of the surveillance carried out by the notified body referred to in Point 3 is to make sure that the provider duly complies with the terms and conditions of the approved quality management system.\r\n5.2.\r\nFor assessment purposes, the provider shall allow the notified body to access the premises where the design, development, testing of the AI systems is taking place. The provider shall further share with the notified body all necessary information.\r\n5.3.\r\nThe notified body shall carry out periodic audits to make sure that the provider maintains and applies the quality management system and shall provide the provider with an audit report. In the context of those audits, the notified body may carry out additional tests of the AI systems for which a Union technical documentation assessment certificate was issued.","FULL_SOURCE_CONTEXT_BEFORE":"[ANNEX VI]\r\nANNEX VI\r\nConformity assessment procedure based on internal control\r\n1.\r\nThe conformity assessment procedure based on internal control is the conformity assessment procedure based on points 2, 3 and 4.\r\n2.\r\nThe provider verifies that the established quality management system is in compliance with the requirements of Article 17.\r\n3.\r\nThe provider examines the information contained in the technical documentation in order to assess the compliance of the AI system with the relevant essential requirements set out in Chapter III, Section 2.\r\n4.\r\nThe provider also verifies that the design and development process of the AI system and its post-market monitoring as referred to in Article 72 is consistent with the technical documentation.","FULL_SOURCE_CONTEXT_AFTER":"[ANNEX VIII]\r\nANNEX VIII\r\nInformation to be submitted upon the registration of high-risk AI systems in accordance with Article 49\r\nSection A â€” Information to be submitted by providers of high-risk AI systems in accordance with Article 49(1)\r\nThe following information shall be provided and thereafter kept up to date with regard to high-risk AI systems to be registered in accordance with Article 49(1):\r\n1.\r\nThe name, address and contact details of the provider;\r\n2.\r\nWhere submission of information is carried out by another person on behalf of the provider, the name, address and contact details of that person;\r\n3.\r\nThe name, address and contact details of the authorised representative, where applicable;\r\n4.\r\nThe AI system trade name and any additional unambiguous reference allowing the identification and traceability of the AI system;\r\n5.\r\nA description of the intended purpose of the AI system and of the components and functions supported through this AI system;\r\n6.\r\nA basic and concise description of the information used by the system (data, inputs) and its operating logic;\r\n7.\r\nThe status of the AI system (on the market, or in service; no longer placed on the market/in service, re","SOURCE_RESOLUTION_STATUS":"RESOL d on an assessment of the quality management system and an assessment of the technical documentation is the conformity assessment procedure based on points 2 to 5.\r\n2. Overview\r\nThe approved quality management system for the design, development and testing of AI systems pursuant to Article 17 shall be examined in accordance with point 3 and shall be subject to surveillance as specified in point 5. The technical documentation of the AI system shall be examined in accordance with point 4.\r\n3. Quality management system\r\n3.1.\r\n(a)\r\nthe name and address of the provider and, if the application is lodged by an authorised representative, also their name and address;\r\n(b)\r\nthe list of AI systems covered under the same quality management system;\r\n(c)\r\nthe technical documentation for each AI system covered under the same quality management system;\r\n(d)\r\nthe documentation concerning the quality management system which shall cover all the aspects listed under Article 17;\r\n(e)\r\na description of the procedures in place to ensure that the quality management system remains adequate and effective;\r\n(f)\r\na written declaration that the same application has not been lodged with any other notified body.\r\n3.2.\r\nThe decision shall be notified to the provider or its authorised representative.\r\nThe notification shall contain the conclusions of the assessment of the quality management system and the reasoned assessment decision.\r\n3.3.\r\nThe quality management system as approved shall continue to be implemented and maintained by the provider so that it remains adequate and efficient.\r\n3.4.\r\nThe proposed changes shall be examined by the notified body, which shall decide whether the modified quality management system continues to satisfy the requirements referred to in point 3.2 or whether a reassessment is necessary.\r\nThe notified body shall notify the provider of its decision. The notification shall contain the conclusions of the examination of the changes and the reasoned assessment decision.\r\n4. Control of the technical documentation.\r\n4.1.\r\nIn addition to the application referred to in point 3, an application with a notified body of their choice shall be lodged by the provider for the assessment of the technical documentation relating to the AI system which the provider intends to place on the market or put into service and which is covered by the quality management system referred to under point 3.\r\n4.2.\r\n(a)\r\nthe name and address of the provider;\r\n(b)\r\na written declaration that the same application has not been lodged with any other notified body;\r\n(c)\r\nthe technical documentation referred to in Annex IV.\r\n4.3.\r\nThe technical documentation shall be examined by the notified body. Where relevant, and limited to what is necessary to fulfil its tasks, the notified body shall be granted full access to the training, validation, and testing data sets used, including, where appropriate and subject to security safeguards, through API or other relevant technical means and tools enabling remote access.\r\n4.4.\r\nIn examining the technical documentation, the notified body may require that the provider supply further evidence or carry out further tests so as to enable a proper assessment of the conformity of the AI system with the requirements set out in Chapter III, Section 2. Where the notified body is not satisfied with the tests carried out by the provider, the notified body shall itself directly carry out adequate tests, as appropriate.\r\n4.5.\r\nWhere necessary to assess the conformity of the high-risk AI system with the requirements set out in Chapter III, Section 2, after all other reasonable means to verify conformity have been exhausted and have proven to be insufficient, and upon a reasoned request, the notified body shall also be granted access to the training and trained models of the AI system, including its relevant parameters. Such access shall be subject to existing Union law on the protection of intellectual property and trade secrets.\r\n4.6.\r\nWhere the AI system is in conformity with the requirements set out in Chapter III, Section 2, the notified body shall issue a Union technical documentation assessment certificate. The certificate shall indicate the name and address of the provider, the conclusions of the examination, the conditions (if any) for its validity and the data necessary for the identification of the AI system.\r\nThe certificate and its annexes shall contain all relevant information to allow the conformity of the AI system to be evaluated, and to allow for control of the AI system while in use, where applicable.\r\nWhere the AI system is not in conformity with the requirements set out in Chapter III, Section 2, the notified body shall refuse to issue a Union technical documentation assessment certificate and shall inform the applicant accordingly, giving detailed reasons for its refusal.\r\nWhere the AI system does not meet the requirement relating to the data used to train it, re-training of the AI system will be needed prior to the application for a new conformity assessment. In this case, the reasoned assessment decision of the notified body refusing to issue the Union technical documentation assessment certificate shall contain specific considerations on the quality data used to train the AI system, in particular on the reasons for non-compliance.\r\n4.7.\r\nAny change to the AI system that could affect the compliance of the AI system with the requirements or its intended purpose shall be assessed by the notified body which issued the Union technical documentation assessment certificate. The provider shall inform such notified body of its intention to introduce any of the abovementioned changes, or if it otherwise becomes aware of the occurrence of such changes. The intended changes shall be assessed by the notified body, which shall decide whether those changes require a new conformity assessment in accordanc
