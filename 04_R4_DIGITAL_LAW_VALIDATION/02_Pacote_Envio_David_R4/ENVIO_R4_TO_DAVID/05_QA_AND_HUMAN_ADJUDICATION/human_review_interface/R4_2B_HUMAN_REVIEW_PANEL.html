function field(label,key,value){return `<div class="field"><span class="label">${esc(label)}</span><div class="text">${esc(value)||'<span class="small">(empty)</span>'}</div></div>`}function question(label,key,opts,r){return `<div class="review-row"><label>${esc(label)}<small>Extraction fidelity only</small></label><select data-q="${key}"><option value="">Selectâ€¦</option>${opts.map(o=>`<option ${r[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`}
function render(){filtered=filteredRows();if(current>=filtered.length)current=Math.max(0,filtered.length-1);const r=filtered[current];const total=records.length,reviewed=records.filter(x=>x.HUMAN_REVIEW_STATUS==='REVIEWED').length;document.getElementById('progress').textContent=`Reviewed ${reviewed} / ${total} (${Math.round(reviewed/total*100)}%)`;document.getElementById('position').textContent=filtered.length?`Filtered record ${current+1} / ${filtered.length}`:'No records match filters';if(!r){document.getElementById('app').innerHTML='<div class="card">No records match the selected filters.</div>';return}const errors=selectedErrors(r);document.getElementById('app').innerHTML=`<div class="meta"><div><div class="label">QA ID</div><div class="value">${esc(r.QA_ID)}</div></div><div><div class="label">Case / CELEX</div><div class="value">${esc(r.CASE_ID)} / ${esc(r.CELEX||'')}</div></div><div><div class="label">Source pointer</div><div class="value">${esc(r.SOURCE_POINTER)}</div></div><div><div class="label">Review status</div><div class="value"><span class="status ${statusClass(r.HUMAN_REVIEW_STATUS)}">${esc(r.HUMAN_REVIEW_STATUS||'PENDING')}</span></div></div></div><div class="small">Source type: ${esc(r.SOURCE_TYPE)} Â· Luna confidence: ${esc(r.EXTRACTION_CONFIDENCE)} Â· Ambiguity: ${esc(r.STRUCTURAL_AMBIGUITY)} Â· Stratum: ${esc(r.SAMPLING_STRATUM)}</div><div class="grid"><div><div class="card legal"><h2>Frozen legal source</h2><div class="source">${esc(r.FULL_SOURCE_TEXT)}</div></div><div class="card context"><h3>Context before</h3><div class="source">${esc(r.FULL_SOURCE_CONTEXT_BEFORE)||'(none)'}</div><h3>Context after</h3><div class="source">${esc(r.FULL_SOURCE_CONTEXT_AFTER)||'(none)'}</div></div></div><div><div class="card ai"><h2>Luna extraction</h2>${field('Actor', 'ACTOR_TEXT_LUNA', r.ACTOR_TEXT_LUNA)}${field('Legal action','LEGAL_ACTION_LUNA',r.LEGAL_ACTION_LUNA)}${field('Action object','ACTION_OBJECT_LUNA',r.ACTION_OBJECT_LUNA)}${field('Counterpart','COUNTERPART_LUNA',r.COUNTERPART_LUNA)}${field('Recipient','RECIPIENT_LUNA',r.RECIPIENT_LUNA)}${field('Source excerpt','SOURCE_EXCERPT',r.SOURCE_EXCERPT)}<h3>Ambiguity context</h3>${field('Current ambiguity type','CURRENT_AMBIGUITY_TYPE',r.CURRENT_AMBIGUITY_TYPE)}${field('Structural note','STRUCTURAL_NOTE',r.STRUCTURAL_NOTE)}</div><div class="card review"><h2>Researcher review</h2><div class="field"><span class="label">Reviewer</span><input id="reviewer" value="${esc(r.HUMAN_REVIEWER||'Igor Caires Machado')}" placeholder="Reviewer name"></div>${question('Actor correct?','ACTOR_CORRECT',['YES','NO','N/A'],r)}${question('Action correct?','ACTION_CORRECT',['YES','NO','N/A'],r)}${question('Object correct?','OBJECT_CORRECT',['YES','NO','N/A'],r)}${question('Counterpart correct?','COUNTERPART_CORRECT',['YES','NO','N/A'],r)}${question('Recipient correct?','RECIPIENT_CORRECT',['YES','NO','N/A'],r)}${question('Source pointer correct?','SOURCE_POINTER_CORRECT',['YES','NO'],r)}${question('Excerpt adequate?','EXCERPT_CORRECT',['YES','NO'],r)}${question('Ambiguity justified?','AMBIGUITY_JUSTIFIED',['YES','NO'],r)}<div class="field"><span class="label">Error type â€” select all that apply if any answer is NO</span><div class="errors">${errorOptions.map(e=>`<label><input type="checkbox" data-error="${e}" ${errors.includes(e)?'checked':''}> ${e}</label>`).join('')}</div></div><div class="field"><span class="label">Human correction</span><textarea id="correction" placeholder="Optional correction to the extraction">${esc(r.HUMAN_CORRECTION)}</textarea></div><div class="field"><span class="label">Human notes</span><textarea id="humanNotes" placeholder="Short methodological observation">${esc(r.HUMAN_NOTES)}</textarea></div><button id="saveRecord" class="primary">Save this record locally</button></div></div></div>`;
document.querySelectorAll('[data-q]').forEach(el=>el.addEventListener('change',e=>setField(r,e.target.dataset.q,e.target.value)));document.querySelectorAll('[data-error]').forEach(el=>el.addEventListener('change',e=>setError(r,e.target.dataset.error,e.target.checked)));document.getElementById('reviewer').addEventListener('change',e=>{r.HUMAN_REVIEWER=e.target.value;saveState()});document.getElementById('correction').addEventListener('input',e=>{r.HUMAN_CORRECTION=e.target.value;r.HUMAN_REVIEW_STATUS=r.HUMAN_REVIEW_STATUS==='REVIEWED'?'IN_PROGRESS':r.HUMAN_REVIEW_STATUS;saveState()});document.getElementById('humanNotes').addEventListener('input',e=>{r.HUMAN_NOTES=e.target.value;saveState()});document.getElementById('saveRecord').addEventListener('click',()=>{r.HUMAN_REVIEWER=reviewer();r.HUMAN_REVIEW_STATUS=isComplete(r)?'REVIEWED':'IN_PROGRESS';saveState();render();setNotice(r.HUMAN_REVIEW_STATUS==='REVIEWED'?'Record marked REVIEWED after required choices.':'Record saved as IN_PROGRESS.')})}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(){const cols=[...new Set(records.flatMap(r=>Object.keys(r)))];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [cols.map(q).join(','),...records.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n')}function exportCsv(){download('R4_2B_HUMAN_QA_REVIEW_COMPLETED.csv',csv(),'text/csv;charset=utf-8')}function exportJson(){download('R4_2B_HUMAN_QA_REVIEW_COMPLETED.json',JSON.stringify(records,null,2),'application/json;charset=utf-8')}
document.getElementById('caseFilter').onchange=()=>{current=0;render()};document.getElementById('confidenceFilter').onchange=()=>{current=0;render()};document.getElementById('ambiguityFilter').onchange=()=>{current=0;render()};document.getElementById('statusFilter').onchange=()=>{current=0;render()};document.getElementById('prevBtn').onclick=()=>{if(current>0){current--;render()}};document.getElementById('nextBtn').onclick=()=>{if(current<filtered.length-1){current++;render()}};document.getElementById('gotoBtn').onclick=()=>{const n=Number(document.getElementById('goto').value);if(n>=1&&n<=records.length){const id=records[n-1].QA_ID;const pos=filtered.findIndex(r=>r.QA_ID===id);if(pos>=0){current=pos;render()}else{setNotice('That record is hidden by the current filters.')}}};document.getElementById('saveBtn').onclick=saveState;document.getElementById('csvBtn').onclick=exportCsv;document.getElementById('jsonBtn').onclick=exportJson;loadState();render();
</script></body></html>
