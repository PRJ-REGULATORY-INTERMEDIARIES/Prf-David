[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-intermediaries-observatory"
version = "0.1.0"
description = "Provisional reproducible research infrastructure for regulatory intermediation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
